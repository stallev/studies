<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<title>Google Ads для владельца малого бизнеса в Беларуси</title>
<style>
:root{
  --bg:#ffffff; --bg2:#f5f5f7; --card:#ffffff; --text:#1d1d1f; --text2:#6e6e73; --line:rgba(0,0,0,.12);
  --blue:#0071e3; --blue-soft:rgba(0,113,227,.10); --green:#248a3d; --green-soft:rgba(52,199,89,.14);
  --orange:#b25000; --orange-soft:rgba(255,159,10,.16); --red:#d70015; --red-soft:rgba(255,59,48,.12);
  --purple:#8e44ad; --material:rgba(255,255,255,.72); --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.06);
  --bar:#0071e3; --bar2:#34c759; --bar3:#ff9f0a; --bar4:#ff453a; --bar5:#bf5af2; --bar6:#8e8e93;
  color-scheme:light; --code:#f5f5f7; --r:14px; --tabh:56px; --topbarh:52px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-reduced-transparency:reduce){:root{--material:var(--bg)}.material{backdrop-filter:none!important}}
@media (prefers-contrast:more){:root{--line:currentColor;--text2:var(--text)}.material{border-color:var(--text)!important}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:100%;-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--topbarh) + 12px)}
body{margin:0;background:var(--bg);color:var(--text);font:1.0625rem/1.55 var(--font);letter-spacing:0;font-optical-sizing:auto;
  padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none;text-underline-offset:3px}
a:hover{text-decoration:underline}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px;top:8px;background:var(--blue);color:#fff;padding:.5rem .75rem;border-radius:8px;z-index:100}
.skip:focus{left:8px}
/* materials */
.material{background:var(--material);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%)}
#topbar{position:sticky;top:0;z-index:20;height:calc(var(--topbarh) + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);
  display:flex;align-items:center;gap:.5rem;padding-left:max(.75rem,env(safe-area-inset-left));padding-right:max(.75rem,env(safe-area-inset-right));
  border-bottom:1px solid var(--line)}
#topbar .crumb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.9375rem;font-weight:600;letter-spacing:-.01em}
#topbar .crumb small{display:block;font-weight:500;color:var(--text2);font-size:.75rem;letter-spacing:0;line-height:1.1}
#progress{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--blue);transform-origin:0 50%;transform:scaleX(0)}
.iconbtn{appearance:none;border:0;background:transparent;color:var(--text);width:44px;height:44px;border-radius:12px;font:inherit;font-size:1.25rem;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .1s,transform .1s}
.iconbtn:hover{background:var(--blue-soft)}
.iconbtn:active,.btn:active,.chip:active,.card:active,.tab:active{transform:scale(.97);transition:transform 100ms ease-out}
.iconbtn[disabled]{opacity:.35;pointer-events:none}
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;height:calc(var(--tabh) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.tab{appearance:none;border:0;background:transparent;color:var(--text2);font:inherit;font-size:.6875rem;font-weight:600;letter-spacing:.01em;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;cursor:pointer;min-height:44px}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="true"]{color:var(--blue)}
.tab[disabled]{opacity:.35}
/* layout */
#app{display:block}
#sidebar{display:none}
#view{display:block;max-width:46rem;margin:0 auto;padding:1.25rem max(1.25rem,env(safe-area-inset-left)) 3rem max(1.25rem,env(safe-area-inset-right));outline:none}
@media (min-width:960px){
  body{padding-bottom:0}
  #app{display:grid;grid-template-columns:20rem minmax(0,1fr);min-height:100vh}
  #sidebar{display:block;position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);background:var(--bg2);padding:1rem .75rem 2rem}
  #tabbar,#btn-menu,#sheet,#scrim{display:none!important}
  #view{padding:2.5rem 2.5rem 5rem}
}
/* type */
h1,h2,h3,h4{font-weight:700;margin:0}
.hero h1,.page-h1{font-size:clamp(2.125rem,8vw,3.5rem);line-height:1.05;letter-spacing:-.02em;font-weight:800}
h3{font-size:1.4rem;line-height:1.2;letter-spacing:-.012em;margin:2.25rem 0 .75rem}
h4{font-size:1.125rem;line-height:1.3;letter-spacing:-.008em;margin:1.5rem 0 .5rem}
p{margin:.75rem 0}
.eyebrow{font-size:.8125rem;font-weight:600;color:var(--blue);letter-spacing:.02em;margin:0 0 .5rem}
.lede{font-size:1.25rem;line-height:1.4;color:var(--text2);letter-spacing:-.01em;margin:1rem 0 1.5rem}
strong{font-weight:650}
code{font:.875em var(--mono);background:var(--code);padding:.12em .38em;border-radius:6px;overflow-wrap:anywhere}
hr{border:0;border-top:1px solid var(--line);margin:2.5rem 0}
ul,ol{padding-left:1.35rem;margin:.75rem 0}
li{margin:.3rem 0}
li.check{list-style:none;margin-left:-1.35rem;display:flex;gap:.6rem;align-items:flex-start}
li.check .box{flex:none;width:1.15rem;height:1.15rem;margin-top:.22rem;border:1.5px solid var(--text2);border-radius:5px}
/* tables */
.tablewrap{overflow-x:auto;margin:1rem 0;border:1px solid var(--line);border-radius:var(--r);background:var(--card);-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:30rem;font-size:.9375rem;line-height:1.4}
th,td{padding:.6rem .8rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{font-size:.75rem;letter-spacing:.03em;text-transform:uppercase;color:var(--text2);font-weight:600;background:var(--bg2);position:sticky;top:0}
tr:last-child td{border-bottom:0}
/* callouts */
.callout{margin:1.25rem 0;padding:.9rem 1.1rem;border-radius:var(--r);border:1px solid var(--line);background:var(--card)}
.callout p{margin:.4rem 0}
.callout.warn{background:var(--orange-soft);border-color:transparent}
.callout.analogy{background:var(--blue-soft);border-color:transparent}
.callout.info{background:var(--bg2);border-color:transparent}
/* code */
.codewrap{position:relative;margin:1rem 0}
pre{margin:0;padding:1rem;background:var(--code);border-radius:var(--r);overflow:auto;font:.8125rem/1.55 var(--mono);-webkit-overflow-scrolling:touch;border:1px solid var(--line)}
pre code{background:none;padding:0;font:inherit;overflow-wrap:normal}
.copy{position:absolute;right:.5rem;top:.5rem;min-height:32px;padding:.25rem .65rem;border:0;border-radius:8px;background:var(--material);color:var(--text);font:600 .75rem var(--font);cursor:pointer;backdrop-filter:blur(12px)}
.copy:active{transform:scale(.97)}
/* buttons & chips & cards */
.btn{appearance:none;border:0;background:var(--blue);color:#fff;font:600 1rem var(--font);padding:.8rem 1.4rem;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:.4rem;min-height:44px;text-decoration:none!important}
.btn.secondary{background:var(--blue-soft);color:var(--blue)}
.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin:1rem 0}
.chip{appearance:none;border:0;background:var(--bg2);color:var(--text);font:500 .875rem var(--font);padding:.5rem .8rem;border-radius:999px;cursor:pointer;min-height:36px;text-decoration:none!important;display:inline-flex;align-items:center}
.chip:hover{background:var(--blue-soft)}
.chip[aria-pressed="true"]{background:var(--blue);color:#fff}
.cards{display:grid;gap:.75rem;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));margin:1rem 0}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.1rem;color:var(--text)!important;text-decoration:none!important;box-shadow:var(--shadow)}
.card b{display:block;font-size:1.0625rem;letter-spacing:-.01em}
.card span{display:block;color:var(--text2);font-size:.875rem;margin-top:.25rem}
.pager{display:grid;gap:.75rem;grid-template-columns:1fr 1fr;margin:3rem 0 1rem}
.pager .card.next{text-align:right}
.pager .empty{visibility:hidden}
/* home */
.hero{padding:1.5rem 0 1rem}
.partblock{margin:2rem 0}
.partblock h2{font-size:.8125rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);margin:0 0 .5rem}
.chlist{list-style:none;padding:0;margin:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
.chlist li{margin:0;border-bottom:1px solid var(--line)}
.chlist li:last-child{border-bottom:0}
.chlist a{display:flex;gap:.8rem;padding:.8rem 1rem;color:var(--text);text-decoration:none!important;min-height:44px;align-items:center}
.chlist a:hover{background:var(--blue-soft)}
.chlist .n{flex:none;min-width:1.9rem;color:var(--text2);font-variant-numeric:tabular-nums;font-weight:600}
.stats{display:flex;gap:1.5rem;flex-wrap:wrap;color:var(--text2);margin:1rem 0 1.5rem;font-size:.9375rem}
.stats b{display:block;color:var(--text);font-size:1.5rem;letter-spacing:-.02em}
/* sidebar & sheet toc */
.toc h2{font-size:.6875rem;text-transform:uppercase;letter-spacing:.07em;color:var(--text2);margin:1.1rem .5rem .3rem}
.toc a{display:flex;gap:.55rem;padding:.5rem .6rem;border-radius:10px;color:var(--text);text-decoration:none!important;font-size:.9375rem;line-height:1.3;min-height:40px;align-items:center}
.toc a:hover{background:var(--blue-soft)}
.toc a[aria-current="page"]{background:var(--blue);color:#fff}
.toc a .n{flex:none;min-width:1.5rem;opacity:.65;font-variant-numeric:tabular-nums}
.toc .home{font-weight:700;margin-bottom:.25rem}
.search{width:100%;appearance:none;border:1px solid var(--line);background:var(--card);color:var(--text);font:1rem var(--font);padding:.65rem .85rem;border-radius:12px;min-height:44px}
.results a{display:block}
.results small{display:block;color:var(--text2);font-size:.8125rem;margin-top:.15rem}
.results mark{background:var(--orange-soft);color:inherit;border-radius:3px}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.38);opacity:0;pointer-events:none;z-index:30}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;height:min(82vh,40rem);border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:0;
  display:flex;flex-direction:column;transform:translateY(100%);visibility:hidden;box-shadow:0 -10px 40px rgba(0,0,0,.18);will-change:transform;touch-action:none}
#sheet.open{visibility:visible}
.sheet-grip{flex:none;padding:.6rem 1rem .4rem;cursor:grab;touch-action:none}
.sheet-grip:active{cursor:grabbing}
.sheet-grip i{display:block;width:2.5rem;height:5px;border-radius:3px;background:var(--text2);opacity:.45;margin:0 auto .6rem}
.sheet-body{flex:1;overflow:auto;padding:0 .9rem calc(1rem + env(safe-area-inset-bottom));overscroll-behavior:contain;touch-action:pan-y}
/* diagrams & widgets */
.diagram,.widget{margin:1.5rem 0;padding:1rem;border:1px solid var(--line);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow)}
.diagram>h4,.widget>h4{margin:0 0 .25rem;font-size:1rem}
.cap{font-size:.8125rem;color:var(--text2);margin:.5rem 0 0}
.flow{display:flex;flex-direction:column;gap:.5rem}
.node{position:relative;padding:.7rem .9rem;border-radius:12px;background:var(--bg2);font-size:.9375rem;line-height:1.35}
.node b{display:block}
.node.accent{background:var(--blue-soft)}
.node.good{background:var(--green-soft)}
.node.warn{background:var(--orange-soft)}
.node.bad{background:var(--red-soft)}
.flow .arr{height:14px;display:flex;justify-content:center;color:var(--text2);font-size:.8rem;line-height:14px}
.badge{display:inline-block;font-size:.6875rem;font-weight:700;padding:.1rem .5rem;border-radius:999px;margin-left:.4rem;vertical-align:middle;background:var(--orange-soft);color:var(--orange)}
.tree,.tree ul{list-style:none;padding-left:0;margin:0}
.tree ul{padding-left:1.1rem;margin-left:.55rem;border-left:2px solid var(--line)}
.tree li{margin:.35rem 0}
.tree .node{display:inline-block}
.row{display:grid;grid-template-columns:5.2rem 1fr 4.5rem;gap:.5rem;align-items:center;margin:.35rem 0;font-size:.875rem}
.row .lbl{color:var(--text2)}
.bar{height:18px;border-radius:6px;background:var(--bar);min-width:2px;transition:width .3s}
.hbar{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2fr) auto;gap:.6rem;align-items:center;margin:.4rem 0;font-size:.875rem}
.hbar .lbl{line-height:1.25;overflow-wrap:anywhere}
.hbar .track{height:14px;background:var(--bg2);border-radius:7px;overflow:hidden}
.hbar .fill{height:100%;background:var(--bar);border-radius:7px}
.hbar .val{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.ctrl{display:grid;grid-template-columns:1fr auto;gap:.25rem .75rem;align-items:center;margin:.6rem 0}
.ctrl label{font-size:.875rem;color:var(--text2)}
.ctrl output{font-variant-numeric:tabular-nums;font-weight:650}
.ctrl input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--blue);min-height:32px}
.ctrl input[type=number]{width:6.5rem;font:1rem var(--font);padding:.45rem .6rem;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem;margin:1rem 0 .25rem}
.kpi{background:var(--bg2);border-radius:12px;padding:.7rem .85rem}
.kpi small{display:block;color:var(--text2);font-size:.75rem}
.kpi b{font-size:1.35rem;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi.good{background:var(--green-soft)}
.kpi.bad{background:var(--red-soft)}
.verdict{margin-top:.75rem;padding:.7rem .9rem;border-radius:12px;font-size:.9375rem}
.verdict.good{background:var(--green-soft)}
.verdict.bad{background:var(--red-soft)}
.verdict.warn{background:var(--orange-soft)}
svg text{font-family:var(--font);fill:var(--text2);font-size:11px}
svg .axis{stroke:var(--line);stroke-width:1}
svg .line{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
svg .area{fill:var(--blue-soft)}
.legend{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.6rem;font-size:.8125rem;color:var(--text2)}
.legend i{display:inline-block;width:.7rem;height:.7rem;border-radius:3px;margin-right:.35rem;vertical-align:-1px}
.stack{display:flex;height:28px;border-radius:8px;overflow:hidden;margin:.6rem 0}
.stack div{height:100%}
.gantt{position:relative;margin:.5rem 0}
.gantt .g{display:grid;grid-template-columns:7.2rem 1fr;gap:.5rem;align-items:center;margin:.35rem 0;font-size:.8125rem}
.gantt .gt{position:relative;height:22px;background:var(--bg2);border-radius:6px}
.gantt .gb{position:absolute;top:2px;bottom:2px;border-radius:5px;background:var(--bar)}
details.acc{border:1px solid var(--line);border-radius:12px;margin:.5rem 0;background:var(--bg)}
details.acc summary{cursor:pointer;padding:.7rem .9rem;font-weight:600;min-height:44px;list-style:none;display:flex;align-items:center;justify-content:space-between}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"+";color:var(--text2);font-size:1.25rem}
details.acc[open] summary::after{content:"\2212"}
details.acc div{padding:0 .9rem .8rem;font-size:.9375rem}
@media (max-width:30em){
  /* tables: stack rows on narrow screens when small */
  .tablewrap table{font-size:.875rem}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.bar,.hbar .fill{transition:none}}
</style>
</head>
<body>
<a class="skip" href="#view">К содержимому</a>
<div id="app">
  <aside id="sidebar" class="toc" aria-label="Оглавление"></aside>
  <div id="main">
    <header id="topbar" class="material">
      <button id="btn-menu" class="iconbtn" type="button" aria-label="Открыть оглавление" aria-haspopup="dialog">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="crumb" id="crumb"></div>
      <button id="btn-prev" class="iconbtn" type="button" aria-label="Предыдущая глава">&#8592;</button>
      <button id="btn-next" class="iconbtn" type="button" aria-label="Следующая глава">&#8594;</button>
      <div id="progress" aria-hidden="true"></div>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<nav id="tabbar" class="material" aria-label="Навигация">
  <button class="tab" id="tab-home" type="button"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Главная</button>
  <button class="tab" id="tab-toc" type="button" aria-haspopup="dialog"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Оглавление</button>
  <button class="tab" id="tab-prev" type="button"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Назад</button>
  <button class="tab" id="tab-next" type="button"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>Далее</button>
</nav>
<div id="scrim"></div>
<section id="sheet" class="material" role="dialog" aria-modal="true" aria-label="Оглавление" aria-hidden="true">
  <div class="sheet-grip" id="grip"><i></i><strong>Оглавление</strong></div>
  <div class="sheet-body toc" id="sheetbody"></div>
</section>

<script>
const PAYLOAD={"title": "Google Ads для владельца малого бизнеса в Беларуси", "subtitle": "Руководство для инженера-программиста, который запускает первую рекламу. Версия 1.0, 22.10.2026. Пример сайта: `kanalizacia-brest.by` (монтаж канализации, кольца ЖБИ, манипулятор, кессоны, Брест и область).", "parts": ["Начало", "Часть I. Основы", "Часть II. Стратегии продвижения", "Часть III. Объявления и страницы", "Часть IV. Аналитика и инструменты", "Часть V. Беларусь, локальный бизнес, Яндекс.Директ", "Часть VI. Практика", "Часть VII. Ваш проект: стратегия и план (обновлено 26.10.2026)", "Приложения"], "pages": [{"id": "ch0", "num": "0", "title": "Как пользоваться руководством", "full": "0. Как пользоваться руководством", "part": "Начало", "html": "<p>Это руководство написано для человека, который хорошо понимает системы, данные и код, но не имел дела с контекстной рекламой. Оно объясняет, <strong>как работает Google Ads</strong> (раньше он назывался AdWords), как строить кампанию, писать объявления, мерить результат и принимать решения. Отдельные главы про <strong>Яндекс.Директ</strong>, особенности Беларуси, реальные ошибки и автоматизацию.</p>\n<h3 id=\"что-вы-получите\">Что вы получите</h3>\n<ul><li>Понимание механики: аукцион, ставки, показатель качества, конверсии и атрибуция.</li><li>Умение собрать структуру аккаунта, ключевые слова, минус-слова и объявления.</li><li>Понимание аналитики: как данные идут из клика в отчёт и как их проверить. Инструменты, отчёты, формулы и правила принятия решений.</li><li>Автоматизацию для программиста: GAQL, Google Ads Scripts, API, BigQuery.</li><li>Разбор типичных успехов и провалов, чтобы не повторять чужие ошибки.</li><li>План запуска для вашего сайта.</li></ul>\n<h3 id=\"маршруты-чтения\">Маршруты чтения</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>Маршрут</th><th>Главы</th><th>Зачем</th></tr></thead><tbody><tr><td data-label=\"Маршрут\"><strong>Быстрый старт (2 часа)</strong></td><td data-label=\"Главы\">1, 2, 3, 6, 8,  рекламу на своём сайте</td></tr><tr><td data-label=\"Название\"><strong>Google Analytics 4 (GA4)</strong></td><td data-label=\"Что это\">Аналитика сайта</td><td data-label=\"Для вас\">Нужен: источник данных о поведении и конверсиях</td></tr><tr><td data-label=\"Название\"><strong>Google Business Profile</strong></td><td data-label=\"Что это\">Карточка организации в Google Картах и поиске</td><td data-label=\"Для вас\">Нужен: местный поиск и доверие</td></tr><tr><td data-label=\"Название\"><strong>Яндекс.Директ</strong></td><td data-label=\"Что это\">Аналог Google Ads от Яндекса</td><td data-label=\"Для вас\">Нужен как второй канал (глава 18)</td></tr></tbody></table></div>\n<aside class=\"callout analogy\"><p><strong>Аналогия для программиста.</strong> AdWords, AdSense и Analytics это три разных сервиса одной компании с общим логином, как S3, Lambda и CloudWatch в одном облаке. Не путайте «купить рекламу» (Ads) и «продавать рекламу» (AdSense).</p></aside>\n<h3 id=\"12-где-показывается-реклама\">1.2 Где показывается реклама</h3>\n<p>Объявление может появиться в нескольких местах (в зависимости от типа кампании):</p>\n<ul><li><strong>Поиск Google</strong> (верхние и нижние блоки над и под органической выдачей). Человек сам ввёл запрос, поэтому намерение самое сильное. Начинайте здесь.</li><li><strong>Партнёры по поиску.</strong> Сторонние сайты с поиском Google. Для малого бюджета лучше отключить.</li><li><strong>Медийная сеть</strong> (баннеры на сайтах), <strong>YouTube</strong>, <strong>Gmail</strong>, <strong>Discover</strong>. Показ без запроса, больше для охвата.</li><li><strong>Карты</strong>, <strong>Покупки</strong>, <strong>приложения</strong> (по типам кампаний, глава 3).</li></ul>\n<p>Оплата чаще всего <strong>за клик</strong> (CPC, cost per click). Показы бесплатные.</p>\n<h3 id=\"13-аукцион-как-выбирается-чьё-объявление-показать\">1.3 Аукцион: как выбирается, чьё объявление показать</h3>\n<p>Каждый запрос в Google запускает аукцион за доли секунды. Участвуют все рекламодатели, чьи ключевые слова подходят запросу. Побеждает не тот, кто заплатил больше всех, а тот, у кого выше <strong>рейтинг объявления (Ad Rank)</strong>.</p>\n<div class=\"diagram\" data-svg=\"auction\" role=\"img\" aria-label=\"Диаграмма\"></div>\n<p><strong>Ad Rank</strong> (упрощённо) складывается из:</p>\n<ol><li><strong>Вашей ставки</strong> (максимум, который вы готовы заплатить за клик).</li><li><strong>Качества объявления и страницы</strong>: ожидаемый CTR, релевантность объявления запросу, удобство посадочной страницы.</li><li><strong>Контекста</strong>: устройство, время, местоположение человека, формулировка запроса.</li><li><strong>Влияния расширений и форматов</strong> (дополнительные ссылки, звонок и т.д.).</li></ol>\n<p><strong>Цена клика</strong> определяется так, чтобы сохранить вашу позицию: примерно «ранг соседа снизу, делённый на ваше качество, плюс минимальная копейка». Поэтому <strong>реальная цена клика обычно ниже максимальной ставки</strong>, а при высоком качестве вы платите меньше конкурента с той же ставкой.</p>\n<aside class=\"callout analogy\"><p><strong>Аналогия для программиста.</strong> Аукцион похож на сортировку результатов по формуле <code>score = bid * quality</code>, где победитель платит ровно столько, сколько нужно, чтобы остаться выше следующего. Качество работает как множитель ранга: хороший код (страница) удешевляет трафик.</p></aside>\n<h3 id=\"14-пример-на-условных-числах\">1.4 Пример на условных числах</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>Рекламодатель</th><th>Макс. ставка</th><th>Качество (условно)</th><th>Ad Rank = ставка x качество</th><th>Позиция</th><th>Цена клика (формула ранг соседа / свое качество + 0,01)</th></tr></thead><tbody><tr><td data-label=\"Рекламодатель\">A</td><td data-label=\"Макс. ставка\">1,0</td><td data-label=\"Качество (условно)\">9</td><td data-label=\"Ad Rank = ставка x качество\">9,0</td><td data-label=\"Позиция\">1</td><td data-label=\"Цена клика (формула ранг соседа / свое качество + 0,01)\">7,5 / 9 + 0,01 = примерно 0,84</td></tr><tr><td data-label=\"Рекламодатель\">B</td><td data-label=\"Макс. ставка\">1,5</td><td data-label=\"Качество (условно)\">5</td><td data-label=\"Ad Rank = ставка x качество\">7,5</td><td data-label=\"Позиция\">2</td><td data-label=\"Цена клика (формула ранг соседа / свое качество + 0,01)\">6,0 / 5 + 0,01 = примерно 1,21</td></tr><tr><td data-label=\"Рекламодатель\">C</td><td data-label=\"Макс. ставка\">2,0</td><td data-label=\"Качество (условно)\">3</td><td data-label=\"Ad Rank = ставка x качество\">6,0</td><td data-label=\"Позиция\">3</td><td data-label=\"Цена клика (формула ранг соседа / свое качество + 0,01)\">минимальная цена по порогу (условно 0,30)</td></tr></tbody></table></div>\n<p>Рекламодатель A с самой низкой ставкой стоит выше и платит <strong>меньше</strong> конкурентов, потому что его объявление и страница релевантнее. Формула цены упрощённая (реальная учитывает контекст и пороги), но логика та же. Поэтому <strong>вкладываться нужно в качество</strong>, а не только в ставку.</p>\n<h3 id=\"15-показатель-качества-quality-score\">1.5 Показатель качества (Quality Score)</h3>\n<p>Для каждого ключевого слова Google показывает оценку <strong>от 1 до 10</strong> и три компонента:</p>\n<div class=\"diagram\" data-svg=\"qs\" role=\"img\" aria-label=\"Диаграмма\"></div>\n<ul><li><strong>Ожидаемый CTR:</strong> вероятность клика по вашему объявлению для этого слова.</li><li><strong>Релевантность объявления:</strong> насколько текст отвечает запросу.</li><li><strong>Качество страницы (landing page experience):</strong> релевантность, скорость, удобство, мобильность.</li></ul>\n<p><strong>Важно.</strong> Quality Score это <strong>диагностическое число</strong>, а не прямая величина аукциона: в аукционе работают данные в реальном времени. Но он хорошо показывает слабое место. Статус «ниже среднего» это конкретная задача: переписать объявление, ускорить страницу, сузить группу.</p>\n<h3 id=\"что-сделать-на-вашем-сайте\">Что сделать на вашем сайте</h3>\n<ul><li>Для каждой группы объявлений из <a href=\"#/plan\">плана</a> используйте свою страницу (монтаж, кольца, манипулятор): это повышает «качество страницы».</li><li>Включите в заголовки слова из ключей (город и услуга): это повышает «релевантность».</li><li>Проверьте скорость и доступность страниц до запуска (глава 9 и 23).</li></ul>\n<hr>", "text": " 1.1 Названия и сервисы Название Что это Для вас Google Ads (до 2018 года AdWords) Платформа, где вы покупаете показы объявлений в поиске Google, на сайтах-партнёрах, в YouTube, Gmail, приложениях Нужен, вы его запускаете AdSense Сервис, где владелец сайта показывает чужую рекламу и зарабатывает Не нужен. Это обратная сторона: вы не размещаете чужую рекламу на своём сайте Google Analytics 4 (GA4) Аналитика сайта Нужен: источник данных о поведении и конверсиях Google Business Profile Карточка организации в Google Картах и поиске Нужен: местный поиск и доверие Яндекс.Директ Аналог Google Ads от Яндекса Нужен как второй канал (глава 18) Аналогия для программиста. AdWords, AdSense и Analytics это три разных сервиса одной компании с общим логином, как S3, Lambda и CloudWatch в одном облаке. Не путайте «купить рекламу» (Ads) и «продавать рекламу» (AdSense). 1.2 Где показывается реклама Объявление может появиться в нескольких местах (в зависимости от типа кампании): Поиск Google (верхние и нижние блоки над и под органической выдачей). Человек сам ввёл запрос, поэтому намерение самое сильное. Начинайте здесь. Партнёры по поиску. Сторонние сайты с поиском Google. Для малого бюджета лучше отключить. Медийная сеть (баннеры на сайтах), YouTube , Gmail , Discover . Показ без запроса, больше для охвата. Карты , Покупки , приложения (по типам кампаний, глава 3). Оплата чаще всего за клик (CPC, cost per click). Показы бесплатные. 1.3 Аукцион: как выбирается, чьё объявление показать Каждый запрос в Google запускает аукцион за доли секунды. Участвуют все рекламодатели, чьи ключевые слова подходят запросу. Побеждает не тот, кто заплатил больше всех, а тот, у кого выше рейтинг объявления (Ad Rank) . Ad Rank (упрощённо) складывается из: Вашей ставки (максимум, который вы готовы заплатить за клик). Качества объявления и страницы : ожидаемый CTR, релевантность объявления запросу, удобство посадочной страницы. Контекста : устройство, время, местоположение человека, формулировка запроса. Влияния расширений и форматов (дополнительные ссылки, звонок и т.д.). Цена клика определяется так, чтобы сохранить вашу позицию: примерно «ранг соседа снизу, делённый на ваше качество, плюс минимальная копейка». Поэтому реальная цена клика обычно ниже максимальной ставки , а при высоком качестве вы платите меньше конкурента с той же ставкой. Аналогия для программиста. Аукцион похож на сортировку результатов по формуле score = bid * quality , где победитель платит ровно столько, сколько нужно, чтобы остаться выше следующего. Качество работает как множитель ранга: хороший код (страница) удешевляет трафик. 1.4 Пример на условных числах Рекламодатель Макс. ставка Качество (условно) Ad Rank = ставка x качество Позиция Цена клика (формула ранг соседа / свое качество + 0,01) A 1,0 9 9,0 1 7,5 / 9 + 0,01 = примерно 0,84 B 1,5 5 7,5 2 6,0 / 5 + 0,01 = примерно 1,21 C 2,0 3 6,0 3 минимальная цена по порогу (условно 0,30) Рекламодатель A с самой низкой ставкой стоит выше и платит меньше конкурентов, потому что его объявление и страница релевантнее. Формула цены упрощённая (реальная учитывает контекст и пороги), но логика та же. Поэтому вкладываться нужно в качество , а не только в ставку. 1.5 Показатель качества (Quality Score) Для каждого ключевого слова Google показывает оценку от 1 до 10 и три компонента: Ожидаемый CTR: вероятность клика по вашему объявлению для этого слова. Релевантность объявления: насколько текст отвечает запросу. Качество страницы (landing page experience): релевантность, скорость, удобство, мобильность. Важно. Quality Score это диагностическое число , а не прямая величина аукциона: в аукционе работают данные в реальном времени. Но он хорошо показывает слабое место. Статус «ниже среднего» это конкретная задача: переписать объявление, ускорить страницу, сузить группу. Что сделать на вашем сайте Для каждой группы объявлений из плана используйте свою страницу (монтаж, кольца, манипулятор): это повышает «качество страницы». Включите в заголовки слова из ключей (город и услуга): это повышает «релевантность». Проверьте скорость и доступность страниц до запуска (глава 9 и 23). ", "toc": [["11-названия-и-сервисы", "1.1 Названия и сервисы"], ["12-где-показывается-реклама", "1.2 Где показывается реклама"], ["13-аукцион-как-выбирается-чьё-объявление-показать", "1.3 Аукцион: как выбирается, чьё объявление показать"], ["14-пример-на-условных-числах", "1.4 Пример на условных числах"], ["15-показатель-качества-quality-score", "1.5 Показатель качества (Quality Score)"], ["что-сделать-на-вашем-сайте", "Что сделать на вашем сайте"]]}, {"id": "ch2", "num": "2", "title": "Словарь терминов и метрик", "full": "2. Словарь терминов и метрик", "part": "Часть I. Основы", "html": "<h3 id=\"21-основные-термины\">2.1 Основные термины</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>Термин</th><th>Расшифровка</th><th>Простыми словами</th></tr></thead><tbody><tr><td data-label=\"Термин\">Impression, показ</td><td data-label=\"Расшифровка\">Объявление показано</td><td data-label=\"Простыми словами\">Кто-то увидел его на экране</td></tr><tr><td data-label=\"Термин\">Click, клик</td><td data-label=\"Расшифровка\">Нажатие на объявление</td><td data-label=\"Простыми словами\">Человек перешёл на сайт, вы платите</td></tr><tr><td data-label=\"Термин\">CTR</td><td data-label=\"Расшифровка\">Click-Through Rate</td><td data-label=\"Простыми словами\">Доля показов, закончившихся кликом</td></tr><tr><td data-label=\"Термин\">CPC</td><td data-label=\"Расшифровка\">Cost Per Click</td><td data-label=\"Простыми словами\">Цена одного клика</td></tr><tr><td data-label=\"Термин\">Conversion, конверсия</td><td data-label=\"Расшифровка\">Целевое действие</td><td data-label=\"Простыми словами\">Заявка, звонок, переход в Telegram</td></tr><tr><td data-label=\"Термин\">CR</td><td data-label=\"Расшифровка\">Conversion Rate</td><td data-label=\"Простыми словами\">Доля кликов, закончившихся конверсией</td></tr><tr><td data-label=\"Термин\">CPA, CPL</td><td data-label=\"Расшифровка\">Cost Per Acquisition / Lead</td><td data-label=\"Простыми словами\">Цена одной конверсии или заявки</td></tr><tr><td data-label=\"Термин\">ROAS</td><td data-label=\"Расшифровка\">Return On Ad Spend</td><td data-label=\"Простыми словами\">Выручка с рекламы к расходам</td></tr><tr><td data-label=\"Термин\">Impression Share</td><td data-label=\"Расшифровка\">Доля показов</td><td data-label=\"Простыми словами\">Какую часть возможных показов вы получили</td></tr><tr><td data-label=\"Термин\">Ad Rank</td><td data-label=\"Расшифровка\">Рейтинг объявления</td><td data-label=\"Простыми словами\">Что решает позицию</td></tr><tr><td data-label=\"Термин\">Quality Score</td><td data-label=\"Расшифровка\">Показатель качества</td><td data-label=\"Простыми словами\">Оценка слова 1–10</td></tr><tr><td data-label=\"Термин\">Search term</td><td data-label=\"Расшифровка\">Поисковый запрос</td><td data-label=\"Простыми словами\">Что человек реально ввёл (не равно ключу)</td></tr><tr><td data-label=\"Термин\">Keyword</td><td data-label=\"Расшифровка\">Ключевое слово</td><td data-label=\"Простыми словами\">Что вы купили</td></tr><tr><td data-label=\"Термин\">Negative keyword</td><td data-label=\"Расшифровка\">Минус-слово</td><td data-label=\"Простыми словами\">Запросы, на которые показывать нельзя</td></tr><tr><td data-label=\"Термин\">Match type</td><td data-label=\"Расшифровка\">Тип соответствия</td><td data-label=\"Простыми словами\">Как строго запрос должен совпадать с ключом</td></tr><tr><td data-label=\"Термин\">Attribution</td><td data-label=\"Расшифровка\">Атрибуция</td><td data-label=\"Простыми словами\">Кому приписать заслугу за конверсию</td></tr><tr><td data-label=\"Термин\">gclid</td><td data-label=\"Расшифровка\">Google Click ID</td><td data-label=\"Простыми словами\">Идентификатор клика в URL</td></tr></tbody></table></div>\n<h3 id=\"22-формулы\">2.2 Формулы</h3>\n<div class=\"codewrap\"><button class=\"copy\" type=\"button\" aria-label=\"Копировать код\">Копировать</button><pre><code class=\"lang-text\">CTR  = клики / показы\nCPC  = расход / клики\nCR   = конверсии / клики\nCPA  = расход / конверсии = CPC / CR\nROAS = выручка / расход\nКол-во заявок = бюджет / CPC * CR</code></pre></div>\n<p><strong>Ключевое соотношение: <code>CPA = CPC / CR</code>.</strong> Цена заявки падает, если вы снижаете цену клика или повышаете конверсию страницы. Второе обычно проще и надёжнее.</p>\n<h3 id=\"23-воронка\">2.3 Воронка</h3>\n<div class=\"widget\" data-widget=\"funnel\"></div>\n<p>Воронка показывает потери на каждом шаге: показы, клики, визиты (клики, дошедшие до страницы), заявки. <strong>Потери между кликами и визитами</strong> вызывают технические проблемы (обрывы соединения, медленная загрузка), а между визитами и заявками контент и удобство страницы.</p>\n<h3 id=\"24-аналогии-для-программиста\">2.4 Аналогии для программиста</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>Реклама</th><th>Инженерный аналог</th></tr></thead><tbody><tr><td data-label=\"Реклама\">Аккаунт, кампания, группа, объявление</td><td data-label=\"Инженерный аналог\">Организация, проект, модуль, функция</td></tr><tr><td data-label=\"Реклама\">Ключевое слово</td><td data-label=\"Инженерный аналог\">Подписка на событие (запрос)</td></tr><tr><td data-label=\"Реклама\">Минус-слово</td><td data-label=\"Инженерный аналог\">Фильтр или denylist</td></tr><tr><td data-label=\"Реклама\">Ставка</td><td data-label=\"Инженерный аналог\">Приоритет в очереди</td></tr><tr><td data-label=\"Реклама\">Quality Score</td><td data-label=\"Инженерный аналог\">Показатель здоровья сервиса (health check)</td></tr><tr><td data-label=\"Реклама\">Конверсия</td><td data-label=\"Инженерный аналог\">Событие <code>success</code> в трекинге</td></tr><tr><td data-label=\"Реклама\">Атрибуция</td><td data-label=\"Инженерный аналог\">Правило, кому присвоить результат при нескольких источниках</td></tr><tr><td data-label=\"Реклама\">Эксперимент</td><td data-label=\"Инженерный аналог\">A/B-тест с feature flag</td></tr></tbody></table></div>\n<h3 id=\"что-сделать-на-вашем-сайте\">Что сделать на вашем сайте</h3>\n<ul><li>Посчитайте для старта: <code>CPA = CPC / CR</code>. Нужны цена клика (покажет «Планировщик ключевых слов») и ожидаемая конверсия (на старте 3–8% от кликов в услугу, дальше по реальным данным).</li></ul>\n<hr>", "text": " 2.1 Основные термины Термин Расшифровка Простыми словами Impression, показ Объявление показано Кто-то увидел его на экране Click, клик Нажатие на объявление Человек перешёл на сайт, вы платите CTR Click-Through Rate Доля показов, закончившихся кликом CPC Cost Per Click Цена одного клика Conversion, конверсия Целевое действие Заявка, звонок, переход в Telegram CR Conversion Rate Доля кликов, закончившихся конверсией CPA, CPL Cost Per Acquisition / Lead Цена одной конверсии или заявки ROAS Return On Ad Spend Выручка с рекламы к расходам Impression Share Доля показов Какую часть возможных показов вы получили Ad Rank Рейтинг объявления Что решает позицию Quality Score Показатель качества Оценка слова 1–10 Search term Поисковый запрос Что человек реально ввёл (не равно ключу) Keyword Ключевое слово Что вы купили Negative keyword Минус-слово Запросы, на которые показывать нельзя Match type Тип соответствия Как строго запрос должен совпадать с ключом Attribution Атрибуция Кому приписать заслугу за конверсию gclid Google Click ID Идентификатор клика в URL 2.2 Формулы Копировать CTR = клики / показы CPC = расход / клики CR = конверсии / клики CPA = расход / конверсии = CPC / CR ROAS = выручка / расход Кол-во заявок = бюджет / CPC * CR Ключевое соотношение: CPA = CPC / CR . Цена заявки падает, если вы снижаете цену клика или повышаете конверсию страницы. Второе обычно проще и надёжнее. 2.3 Воронка Воронка показывает потери на каждом шаге: показы, клики, визиты (клики, дошедшие до страницы), заявки. Потери между кликами и визитами вызывают технические проблемы (обрывы соединения, медленная загрузка), а между визитами и заявками контент и удобство страницы. 2.4 Аналогии для программиста Реклама Инженерный аналог Аккаунт, кампания, группа, объявление Организация, проект, модуль, функция Ключевое слово Подписка на событие (запрос) Минус-слово Фильтр или denylist Ставка Приоритет в очереди Quality Score Показатель здоровья сервиса (health check) Конверсия Событие success в трекинге Атрибуция Правило, кому присвоить результат при нескольких источниках Эксперимент A/B-тест с feature flag Что сделать на вашем сайте Посчитайте для старта: CPA = CPC / CR . Нужны цена клика (покажет «Планировщик ключевых слов») и ожидаемая конверсия (на старте 3–8% от кликов в услугу, дальше по реальным данным). ", "toc": [["21-основные-термины", "2.1 Основные термины"], ["22-формулы", "2.2 Формулы"], ["23-воронка", "2.3 Воронка"], ["24-аналогии-для-программиста", "2.4 Аналогии для программиста"], ["что-сделать-на-вашем-сайте", "Что сделать на вашем сайте"]]}, {"id": "ch3", "num": "3", "title": "Устройство аккаунта и типы кампаний", "full": "3. Устройство аккаунта и типы кампаний", "part": "Часть I. Основы", "html": "<h3 id=\"31-иерархия\">3.1 Иерархия</h3>\n<div class=\"diagram\" data-svg=\"hierarchy\" role=\"img\" aria-label=\"Диаграмма\"></div>\n<div class=\"tablewrap\"><table><thead><tr><th>Уровень</th><th>Что настраивается</th></tr></thead><tbody><tr><td data-label=\"Уровень\"><strong>Аккаунт</strong></td><td data-label=\"Что настраивается\">Оплата, доступ пользователей, связь с GA4, конверсии</td></tr><tr><td data-label=\"Уровень\"><strong>Кампания</strong></td><td data-label=\"Что настраивается\">Тип, бюджет, гео, расписание, ставки, сети, языки</td></tr><tr><td data-label=\"Уровень\"><strong>Группа объявлений</strong></td><td data-label=\"Что настраивается\">Тема (одна услуга и группа похожих запросов), ключи</td></tr><tr><td data-label=\"Уровень\"><strong>Объявление</strong></td><td data-label=\"Что настраивается\">Заголовки, описания, ссылка на страницу</td></tr><tr><td data-label=\"Уровень\"><strong>Ресурсы (assets)</strong></td><td data-label=\"Что настраивается\">Дополнительные ссылки, уточнения, звонок, адрес</td></tr></tbody></table></div>\n<p><strong>Правило.</strong> Бюджет, гео и расписание задаются на уровне <strong>кампании</strong>, поэтому разные цели и регионы нужны в разных кампаниях (поэтому у вас манипулятор в Пинске и Барановичах вынесен в отдельную кампанию).</p>\n<h3 id=\"32-типы-кампаний\">3.2 Типы кампаний</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>Тип</th><th>Где показывается</th><th>Когда подходит</th><th>Для вашего сайта</th></tr></thead><tbody><tr><td data-label=\"Тип\"><strong>Поиск (Search)</strong></td><td data-label=\"Где показывается\">Поиск Google</td><td data-label=\"Когда подходит\">Человек ищет услугу прямо сейчас</td><td data-label=\"Для вашего сайта\"><strong>Начать с него</strong></td></tr><tr><td data-label=\"Тип\"><strong>Performance Max</strong></td><td data-label=\"Где показывается\">Все площадки Google, автоматика</td><td data-label=\"Когда подходит\">Много конверсий, магазин, готовые материалы</td><td data-label=\"Для вашего сайта\">Не на старте</td></tr><tr><td data-label=\"Тип\"><strong>Медийная (Display)</strong></td><td data-label=\"Где показывается\">Баннеры на сайтах</td><td data-label=\"Когда подходит\">Охват, ремаркетинг</td><td data-label=\"Для вашего сайта\">Позже, для ремаркетинга</td></tr><tr><td data-label=\"Тип\"><strong>Видео (YouTube)</strong></td><td data-label=\"Где показывается\">Видеореклама</td><td data-label=\"Когда подходит\">Бренд, охват</td><td data-label=\"Для вашего сайта\">Не нужно</td></tr><tr><td data-label=\"Тип\"><strong>Demand Gen</strong></td><td data-label=\"Где показывается\">YouTube, Discover, Gmail</td><td data-label=\"Когда подходит\">Спрос на товары, визуальные услуги</td><td data-label=\"Для вашего сайта\">Позже</td></tr><tr><td data-label=\"Тип\"><strong>Покупки (Shopping)</strong></td><td data-label=\"Где показывается\">Товарные карточки</td><td data-label=\"Когда подходит\">Интернет-магазин с фидом</td><td data-label=\"Для вашего сайта\">Нет</td></tr><tr><td data-label=\"Тип\"><strong>Приложения</strong></td><td data-label=\"Где показывается\">Мобильные приложения</td><td data-label=\"Когда подходит\">Приложения</td><td data-label=\"Для вашего сайта\">Нет</td></tr><tr><td data-label=\"Тип\"><strong>Умные кампании / автоматические форматы</strong></td><td data-label=\"Где показывается\">Автоматика Google</td><td data-label=\"Когда подходит\">Минимум настроек</td><td data-label=\"Для вашего сайта\">Не рекомендую новичку: мало контроля</td></tr></tbody></table></div>\n<p><strong>Для малого бизнеса с локальной услугой</strong> почти всегда лучше начать с <strong>Поиска</strong> на точном и фразовом соответствии. Автоматические форматы (Performance Max и др.) требуют десятков конверсий в месяц, материалов и бюджета, иначе они тратят деньги на нецелевые площадки.</p>\n<h3 id=\"33-именование-инженерная-привычка\">3.3 Именование (инженерная привычка)</h3>\n<p>Используйте единое именование, чтобы отчёты читались как логи:</p>\n<div class=\"codewrap\"><button class=\"copy\" type=\"button\" aria-label=\"Копировать код\">Копировать</button><pre><code class=\"lang-text\">Кампания:  GGL | SEARCH | MONTAZH | BREST\nГруппа:    kanalizaciya-pod-klyuch | phrase+exact\nОбъявление: RSA v1 (2026-10)</code></pre></div>\n<h3 id=\"34-что-не-нужно-на-старте\">3.4 Что не нужно на старте</h3>\n<p>Динамические поисковые объявления (DSA), Performance Max, smart-кампании, широкое соответствие с автоматикой. Сначала нужны точные данные о том, что приносит заявки.</p>\n<h3 id=\"что-сделать-на-вашем-сайте\">Что сделать на вашем сайте</h3>\n<ul><li>Создайте кампании A, B, C из <a href=\"#/plan\">плана</a> и назовите их по схеме выше.</li><li>Включите только «Поиск Google», отключите «Поисковые партнёры» и Медийную сеть.</li></ul>", "text": " 3.1 Иерархия Уровень Что настраивается Аккаунт Оплата, доступ пользователей, связь с GA4, конверсии Кампания Тип, бюджет, гео, расписание, ставки, сети, языки Группа объявлений Тема (одна услуга и группа похожих запросов), ключи Объявление Заголовки, описания, ссылка на страницу Ресурсы (assets) Дополнительные ссылки, уточнения, звонок, адрес Правило. Бюджет, гео и расписание задаются на уровне кампании , поэтому разные цели и регионы нужны в разных кампаниях (поэтому у вас манипулятор в Пинске и Барановичах вынесен в отдельную кампанию). 3.2 Типы кампаний Тип Где показывается Когда подходит Для вашего сайта Поиск (Search) Поиск Google Человек ищет услугу прямо сейчас Начать с него Performance Max Все площадки Google, автоматика Много конверсий, магазин, готовые материалы Не на старте Медийная (Display) Баннеры на сайтах Охват, ремаркетинг Позже, для ремаркетинга Видео (YouTube) Видеореклама Бренд, охват Не нужно Demand Gen YouTube, Discover, Gmail Спрос на товары, визуальные услуги Позже Покупки (Shopping) Товарные карточки Интернет-магазин с фидом Нет Приложения Мобильные приложения Приложения Нет Умные кампании / автоматические форматы Автоматика Google Минимум настроек Не рекомендую новичку: мало контроля Для малого бизнеса с локальной услугой почти всегда лучше начать с Поиска на точном и фразовом соответствии. Автоматические форматы (Performance Max и др.) требуют десятков конверсий в месяц, материалов и бюджета, иначе они тратят деньги на нецелевые площадки. 3.3 Именование (инженерная привычка) Используйте единое именование, чтобы отчёты читались как логи: Копировать Кампания: GGL | SEARCH | MONTAZH | BREST Группа: kanalizaciya-pod-klyuch | phrase+exact Объявление: RSA v1 (2026-10) 3.4 Что не нужно на старте Динамические поисковые объявления (DSA), Performance Max, smart-кампании, широкое соответствие с автоматикой. Сначала нужны точные данные о том, что приносит заявки. Что сделать на вашем сайте Создайте кампании A, B, C из плана и назовите их по схеме выше. Включите только «Поиск Google», отключите «Поисковые партнёры» и Медийную сеть. ", "toc": [["31-иерархия", "3.1 Иерархия"], ["32-типы-кампаний", "3.2 Типы кампаний"], ["33-именование-инженерная-привычка", "3.3 Именование (инженерная привычка)"], ["34-что-не-нужно-на-старте", "3.4 Что не нужно на старте"], ["что-сделать-на-вашем-сайте", "Что сделать на вашем сайте"]]}, {"id": "ch4", "num": "4", "title": "Стратегии продвижения по размеру бизнеса", "full": "4. Стратегии продвижения по размеру бизнеса", "part": "Часть II. Стратегии продвижения", "html": "<p>Размер бизнеса определяет не «правильную» стратегию, а <strong>ограничения</strong>: бюджет, количество конверсий, время владельца и допустимый риск. Ниже подробно описан малый бизнес (это вы), средний кратко, крупный минимально.</p>\n<h3 id=\"41-малый-бизнес-ваш-случай\">4.1 Малый бизнес (ваш случай)</h3>\n<p><strong>Ограничения:</strong> небольшой бюджет, мало конверсий в месяц, нет отдельного специалиста, спрос локальный и сезонный.</p>\n<p><strong>Принципы:</strong></p>\n<ol><li><strong>Один канал, одна цель.</strong> Только Поиск, только заявки и звонки. Не размывайте бюджет.</li><li><strong>Узкая семантика.</strong> Точное и фразовое соответствие, строгие минус-слова, нужный город.</li><li><strong>Каждая группа ведёт на свою страницу.</strong> Релевантность важнее красоты.</li><li><strong>Ручной контроль на старте.</strong> Автоматические ставки включаются, когда накопятся конверсии (глава 5).</li><li><strong>Локальный комплект.</strong> Карточка Google, отзывы, кнопка звонка.</li><li><strong>Дисциплина учёта.</strong> Каждый звонок: «откуда узнали?». Реальный результат считается вами, а не только кабинетом.</li><li><strong>Маленькие шаги.</strong> Меняйте одно за раз и фиксируйте дату (журнал изменений).</li></ol>\n<p><strong>Типовая структура для локальной услуги:</strong></p>\n<div class=\"diagram\" data-svg=\"hierarchy-small\" role=\"img\" aria-label=\"Диаграмма\"></div>\n<p><strong>Бюджет:</strong> задаётся дневной лимит, который вы готовы потерять за 2–3 недели теста. Оценка: <code>дней теста x дневной бюджет</code>. Цель теста: собрать по 30–50 кликов на услугу и увидеть CTR и конверсию.</p>\n<h3 id=\"42-средний-бизнес-кратко\">4.2 Средний бизнес (кратко)</h3>\n<ul><li>Несколько услуг и регионов, <strong>несколько кампаний</strong> с разной ценностью конверсий.</li><li><strong>Автоматические ставки</strong> (максимум конверсий, потом целевая цена) при 30 и более конверсиях в месяц на кампанию.</li><li><strong>Ремаркетинг</strong> (возврат посетителей), <strong>ценность конверсий</strong> (разные услуги разной ценности).</li><li><strong>Отчёты и автоматизация:</strong> Looker Studio, скрипты, импорт офлайн-конверсий (глава 14).</li><li><strong>Отдел или подрядчик,</strong> еженедельные отчёты и эксперименты.</li></ul>\n<h3 id=\"43-крупный-бизнес-минимум\">4.3 Крупный бизнес (минимум)</h3>\n<p>Коротко: сотни кампаний, <strong>Performance Max и Demand Gen</strong>, интеграции с CRM и BigQuery, атрибуция по нескольким каналам, отдельные команды и подрядчики. Для вас это справочная информация: к ней стоит возвращаться, когда малый бизнес перерастёт свой формат.</p>\n<h3 id=\"44-сравнение\">4.4 Сравнение</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>Критерий</th><th>Малый</th><th>Средний</th><th>Крупный</th></tr></thead><tbody><tr><td data-label=\"Критерий\">Типы кампаний</td><td data-label=\"Малый\">Поиск</td><td data-label=\"Средний\">Поиск + ремаркетинг + PMax</td><td data-label=\"Крупный\">Все типы</td></tr><tr><td data-label=\"Критерий\">Ставки</td><td data-label=\"Малый\">Ручные, затем максимум конверсий</td><td data-label=\"Средний\">Автоматические</td><td data-label=\"Крупный\">Автоматические + портфели</td></tr><tr><td data-label=\"Критерий\">Конверсий в месяц</td><td data-label=\"Малый\">10–50</td><td data-label=\"Средний\">50–500</td><td data-label=\"Крупный\">500+</td></tr><tr><td data-label=\"Критерий\">Аналитика</td><td data-label=\"Малый\">GA4 + кабинет + таблица звонков</td><td data-label=\"Средний\">+ Looker Studio, скрипты</td><td data-label=\"Крупный\">+ BigQuery, CRM, MMM</td></tr><tr><td data-label=\"Критерий\">Главный риск</td><td data-label=\"Малый\">Потеря бюджета на мусорные клики</td><td data-label=\"Средний\">Потеря контроля над автоматикой</td><td data-label=\"Крупный\">Сложность и разрозненные данные</td></tr></tbody></table></div>\n<h3 id=\"что-сделать-на-вашем-сайте\">Что сделать на вашем сайте</h3>\n<ul><li>Запускайте <strong>только этап 1</strong> из <a href=\"#/plan\">плана</a> (кампании A, B, C). Этап 2 (Пинск и Барановичи, кессоны) после результатов.</li></ul>\n<hr>", "text": " Размер бизнеса определяет не «правильную» стратегию, а ограничения : бюджет, количество конверсий, время владельца и допустимый риск. Ниже подробно описан малый бизнес (это вы), средний кратко, крупный минимально. 4.1 Малый бизнес (ваш случай) Ограничения: небольшой бюджет, мало конверсий в месяц, нет отдельного специалиста, спрос локальный и сезонный. Принципы: Один канал, одна цель. Только Поиск, только заявки и звонки. Не размывайте бюджет. Узкая семантика. Точное и фразовое соответствие, строгие минус-слова, нужный город. Каждая группа ведёт на свою страницу. Релевантность важнее красоты. Ручной контроль на старте. Автоматические ставки включаются, когда накопятся конверсии (глава 5). Локальный комплект. Карточка Google, отзывы, кнопка звонка. Дисциплина учёта. Каждый звонок: «откуда узнали?». Реальный результат считается вами, а не только кабинетом. Маленькие шаги. Меняйте одно за раз и фиксируйте дату (журнал изменений). Типовая структура для локальной услуги: Бюджет: задаётся дневной лимит, который вы готовы потерять за 2–3 недели теста. Оценка: дней теста x дневной бюджет . Цель теста: собрать по 30–50 кликов на услугу и увидеть CTR и конверсию. 4.2 Средний бизнес (кратко) Несколько услуг и регионов, несколько кампаний с разной ценностью конверсий. Автоматические ставки (максимум конверсий, потом целевая цена) при 30 и более конверсиях в месяц на кампанию. Ремаркетинг (возврат посетителей), ценность конверсий (разные услуги разной ценности). Отчёты и автоматизация: Looker Studio, скрипты, импорт офлайн-конверсий (глава 14). Отдел или подрядчик, еженедельные отчёты и эксперименты. 4.3 Крупный бизнес (минимум) Коротко: сотни кампаний, Performance Max и Demand Gen , интеграции с CRM и BigQuery, атрибуция по нескольким каналам, отдельные команды и подрядчики. Для вас это справочная информация: к ней стоит возвращаться, когда малый бизнес перерастёт свой формат. 4.4 Сравнение Критерий Малый Средний Крупный Типы кампаний Поиск Поиск + ремаркетинг + PMax Все типы Ставки Ручные, затем максимум конверсий Автоматические Автоматические + портфели Конверсий в месяц 10–50 50–500 500+ Аналитика GA4 + кабинет + таблица звонков + Looker Studio, скрипты + BigQuery, CRM, MMM Главный риск Потеря бюджета на мусорные клики Потеря контроля над автоматикой Сложность и разрозненные данные Что сделать на вашем сайте Запускайте только этап 1 из плана (кампании A, B, C). Этап 2 (Пинск и Барановичи, кессоны) после результатов. ", "toc": [["41-малый-бизнес-ваш-случай", "4.1 Малый бизнес (ваш случай)"], ["42-средний-бизнес-кратко", "4.2 Средний бизнес (кратко)"], ["43-крупный-бизнес-минимум", "4.3 Крупный бизнес (минимум)"], ["44-сравнение", "4.4 Сравнение"], ["что-сделать-на-вашем-сайте", "Что сделать на вашем сайте"]]}, {"id": "ch5", "num": "5", "title": "Стратегии ставок", "full": "5. Стратегии ставок", "part": "Часть II. Стратегии продвижения", "html": "<h3 id=\"51-основные-стратегии\">5.1 Основные стратегии</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>Стратегия</th><th>Что делает</th><th>Когда подходит</th><th>Требования</th></tr></thead><tbody><tr><td data-label=\"Стратегия\"><strong>Ручная цена клика</strong></td><td data-label=\"Что делает\">Вы задаёте максимум за клик</td><td data-label=\"Когда подходит\">Старт, мало данных, полный контроль</td><td data-label=\"Требования\">Вы следите за ставками</td></tr><tr><td data-label=\"Стратегия\"><strong>Максимум кликов</strong></td><td data-label=\"Что делает\">Автоматика тратит бюджет на максимум кликов, можно ограничить макс. CPC</td><td data-label=\"Когда подходит\">Старт, сбор трафика и данных</td><td data-label=\"Требования\">Нужен лимит цены клика</td></tr><tr><td data-label=\"Стратегия\"><strong>Максимум конверсий</strong></td><td data-label=\"Что делает\">Автоматика ищет максимум конверсий в рамках бюджета</td><td data-label=\"Когда подходит\">Есть 15–30 конверсий за 30 дней</td><td data-label=\"Требования\">Корректные конверсии</td></tr><tr><td data-label=\"Стратегия\"><strong>Целевая цена конверсии (tCPA)</strong></td><td data-label=\"Что делает\">Держит среднюю цену конверсии около цели</td><td data-label=\"Когда подходит\">Стабильный поток конверсий</td><td data-label=\"Требования\">30 и более конверсий, ясная целевая цена</td></tr><tr><td data-label=\"Стратегия\"><strong>Целевая рентабельность (tROAS)</strong></td><td data-label=\"Что делает\">Держит отношение выручки к расходу</td><td data-label=\"Когда подходит\">Есть ценность конверсий (продажи)</td><td data-label=\"Требования\">50 и более конверсий с ценностью</td></tr><tr><td data-label=\"Стратегия\"><strong>Целевая доля показов</strong></td><td data-label=\"Что делает\">Покупает долю в верхних позициях</td><td data-label=\"Когда подходит\">Бренд, защита позиции</td><td data-label=\"Требования\">Осторожно: дорого</td></tr></tbody></table></div>\n<p><strong>Ориентиры по данным</strong> (15–30 и 30–50 конверсий) это практика специалистов, а не жёсткие правила Google. Чем больше чистых конверсий, тем лучше работает автоматика. Проверьте в справке Google Ads актуальные рекомендации перед включением.</p>\n<h3 id=\"52-как-выбрать\">5.2 Как выбрать</h3>\n<div class=\"widget\" data-widget=\"bidding-picker\"></div>\n<div class=\"diagram\" data-svg=\"bidding\" role=\"img\" aria-label=\"Диаграмма\"></div>\n<h3 id=\"53-период-обучения\">5.3 Период обучения</h3>\n<p>После смены стратегии автоматика <strong>обучается 1–2 недели</strong> (или десятки конверсий). В это время результаты нестабильны, поэтому:</p>\n<ul><li>не меняйте цель, бюджет или объявления каждый день;</li><li>не сравнивайте неделю обучения с неделей стабильной работы;</li><li>фиксируйте дату изменений в журнале.</li></ul>\n<aside class=\"callout analogy\"><p><strong>Аналогия для программиста.</strong> Автоматика ставок это модель машинного обучения. Ей нужны данные. На 5 конверсиях в месяц она переобучается на шуме, как нейросеть на маленьком датасете.</p></aside>\n<h3 id=\"54-лимит-цены-клика-и-дневной-бюджет\">5.4 Лимит цены клика и дневной бюджет</h3>\n<ul><li><strong>Дневной бюджет</strong> это средний лимит. Google может потратить до удвоенного значения в отдельный день, но не превысит месячный лимит (дневной x 30,4).</li><li><strong>Максимальная цена клика</strong> на старте ограничивает риск. Её задают по формуле: <code>макс. CPC = целевая цена заявки x ожидаемая конверсия</code>.</li></ul>\n<p>Пример на условных числах: цель 20 за заявку, ожидаемая конверсия 5% → <code>макс. CPC = 20 x 0,05 = 1,0</code>.</p>\n<h3 id=\"55-сезонность\">5.5 Сезонность</h3>\n<p>Монтаж канализации сезонный. В сезон спрос выше, значит выше цена клика и конкуренция. Планируйте бюджет по сезону: в пик увеличивайте, в низкий сезон снижайте или ставьте на паузу кампании, не окупающиеся.</p>\n<h3 id=\"что-сделать-на-вашем-сайте\">Что сделать на вашем сайте</h3>\n<ul><li>На старте поставьте <strong>ручную цену клика</strong> или <strong>максимум кликов с лимитом CPC</strong>. Цель: накопить хотя бы 15 конверсий (заявки, звонки, переходы в Telegram) и перейти на «максимум конверсий».</li><li>Запишите в таблицу дату запуска, бюджет и любые изменения.</li></ul>\n<hr>", "text": " 5.1 Основные стратегии Стратегия Что делает Когда подходит Требования Ручная цена клика Вы задаёте максимум за клик Старт, мало данных, полный контроль Вы следите за ставками Максимум кликов Автоматика тратит бюджет на максимум кликов, можно ограничить макс. CPC Старт, сбор трафика и данных Нужен лимит цены клика Максимум конверсий Автоматика ищет максимум конверсий в рамках бюджета Есть 15–30 конверсий за 30 дней Корректные конверсии Целевая цена конверсии (tCPA) Держит среднюю цену конверсии около цели Стабильный поток конверсий 30 и более конверсий, ясная целевая цена Целевая рентабельность (tROAS) Держит отношение выручки к расходу Есть ценность конверсий (продажи) 50 и более конверсий с ценностью Целевая доля показов Покупает долю в верхних позициях Бренд, защита позиции Осторожно: дорого Ориентиры по данным (15–30 и 30–50 конверсий) это практика специалистов, а не жёсткие правила Google. Чем больше чистых конверсий, тем лучше работает автоматика. Проверьте в справке Google Ads актуальные рекомендации перед включением. 5.2 Как выбрать 5.3 Период обучения После смены стратегии автоматика обучается 1–2 недели (или десятки конверсий). В это время результаты нестабильны, поэтому: не меняйте цель, бюджет или объявления каждый день; не сравнивайте неделю обучения с неделей стабильной работы; фиксируйте дату изменений в журнале. Аналогия для программиста. Автоматика ставок это модель машинного обучения. Ей нужны данные. На 5 конверсиях в месяц она переобучается на шуме, как нейросеть на маленьком датасете. 5.4 Лимит цены клика и дневной бюджет Дневной бюджет это средний лимит. Google может потратить до удвоенного значения в отдельный день, но не превысит месячный лимит (дневной x 30,4). Максимальная цена клика на старте ограничивает риск. Её задают по формуле: макс. CPC = целевая цена заявки x ожидаемая конверсия . Пример на условных числах: цель 20 за заявку, ожидаемая конверсия 5% → макс. CPC = 20 x 0,05 = 1,0 . 5.5 Сезонность Монтаж канализации сезонный. В сезон спрос выше, значит выше цена клика и конкуренция. Планируйте бюджет по сезону: в пик увеличивайте, в низкий сезон снижайте или ставьте на паузу кампании, не окупающиеся. Что сделать на вашем сайте На старте поставьте ручную цену клика или максимум кликов с лимитом CPC . Цель: накопить хотя бы 15 конверсий (заявки, звонки, переходы в Telegram) и перейти на «максимум конверсий». Запишите в таблицу дату запуска, бюджет и любые изменения. ", "toc": [["51-основные-стратегии", "5.1 Основные стратегии"], ["52-как-выбрать", "5.2 Как выбрать"], ["53-период-обучения", "5.3 Период обучения"], ["54-лимит-цены-клика-и-дневной-бюджет", "5.4 Лимит цены клика и дневной бюджет"], ["55-сезонность", "5.5 Сезонность"], ["что-сделать-на-вашем-сайте", "Что сделать на вашем сайте"]]}, {"id": "ch6", "num": "6", "title": "Ключевые слова и семантика", "full": "6. Ключевые слова и семантика", "part": "Часть II. Стратегии продвижения", "html": "<h3 id=\"61-намерение-запроса\">6.1 Намерение запроса</h3>\n<p>Запросы бывают трёх типов:</p>\n<div class=\"tablewrap\"><table><thead><tr><th>Намерение</th><th>Пример</th><th>Для вашей услуги</th></tr></thead><tbody><tr><td data-label=\"Намерение\"><strong>Коммерческое</strong> (купить, заказать)</td><td data-label=\"Пример\">«канализация под ключ брест цена»</td><td data-label=\"Для вашей услуги\"><strong>Основа кампании</strong></td></tr><tr><td data-label=\"Намерение\"><strong>Информационное</strong></td><td data-label=\"Пример\">«как сделать кессон своими руками»</td><td data-label=\"Для вашей услуги\">Не рекламировать (минус-слова), но можно вести блог</td></tr><tr><td data-label=\"Намерение\"><strong>Навигационное</strong></td><td data-label=\"Пример\">«название вашей компании»</td><td data-label=\"Для вашей услуги\">Брендовые запросы, их защищают отдельно</td></tr></tbody></table></div>\n<p>В ваших данных Яндекса по Беларуси видно: <strong>70% показов</strong> блога приходятся на «сделай сам», а коммерческие запросы дают клики на главную и каталог. Реклама должна покупать коммерческие запросы.</p>\n<p><strong>Ваши данные: запросы Яндекса по Беларуси (23.09–06.10.2026), топ по показам:</strong></p>\n<div class=\"widget\" data-widget=\"ya-top\"></div>\n<div class=\"tablewrap\"><table><thead><tr><th>Запрос</th><th>Показы</th><th>Клики</th><th>Страница</th></tr></thead><tbody><tr><td data-label=\"Запрос\">кольца канализационные купить в бресте</td><td data-label=\"Показы\">8</td><td data-label=\"Клики\">2</td><td data-label=\"Страница\"><code>/katalog/</code></td></tr><tr><td data-label=\"Запрос\">манипулятор брест</td><td data-label=\"Показы\">8</td><td data-label=\"Клики\">0</td><td data-label=\"Страница\"><code>/dostavka-manipulyatorom/</code></td></tr><tr><td data-label=\"Запрос\">канализация брест</td><td data-label=\"Показы\">7</td><td data-label=\"Клики\">5</td><td data-label=\"Страница\"><code>/</code></td></tr><tr><td data-label=\"Запрос\">канализация под ключ</td><td data-label=\"Показы\">6</td><td data-label=\"Клики\">0</td><td data-label=\"Страница\"><code>/</code></td></tr><tr><td data-label=\"Запрос\">манипулятор брест услуги</td><td data-label=\"Показы\">6</td><td data-label=\"Клики\">0</td><td data-label=\"Страница\"><code>/dostavka-manipulyatorom/</code></td></tr><tr><td data-label=\"Запрос\">сергей стриж канализация брест</td><td data-label=\"Показы\">6</td><td data-label=\"Клики\">0</td><td data-label=\"Страница\"><code>/</code></td></tr><tr><td data-label=\"Запрос\">услуги манипулятора в бресте</td><td data-label=\"Показы\">6</td><td data-label=\"Клики\">0</td><td data-label=\"Страница\"><code>/dostavka-manipulyatorom/</code></td></tr><tr><td data-label=\"Запрос\">купить канализационные кольца</td><td data-label=\"Показы\">5</td><td data-label=\"Клики\">1</td><td data-label=\"Страница\"><code>/katalog/</code></td></tr></tbody></table></div>\n<h3 id=\"62-типы-соответствия\">6.2 Типы соответствия</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>Тип</th><th>Запись</th><th>Что подходит</th><th>Пример</th></tr></thead><tbody><tr><td data-label=\"Тип\"><strong>Точное</strong></td><td data-label=\"Запись\"><code>[канализация под ключ брест]</code></td><td data-label=\"Что подходит\">Тот же смысл и намерение (допускаются близкие варианты)</td><td data-label=\"Пример\">«монтаж канализации под ключ в бресте»</td></tr><tr><td data-label=\"Тип\"><strong>Фраза</strong></td><td data-label=\"Запись\"><code>\"канализация под ключ брест\"</code></td><td data-label=\"Что подходит\">Запросы, содержащие смысл фразы</td><td data-label=\"Пример\">«сколько стоит канализация под ключ брест»</td></tr><tr><td data-label=\"Тип\"><strong>Широкое</strong></td><td data-label=\"Запись\"><code>канализация под ключ</code></td><td data-label=\"Что подходит\">Любые связанные по смыслу, в том числе далёкие</td><td data-label=\"Пример\">«септики в минске», «чистка канализации»</td></tr></tbody></table></div>\n<p><strong>Близкие варианты (close variants)</strong> есть у точного и фразового типов: опечатки, формы слова, синонимы. Поэтому «точное» не значит «ровно эта строка».</p>\n<p><strong>Правило малого бизнеса:</strong> старт только с <strong>фразы и точного</strong>, широкое после накопления данных и только с автоматикой ставок и строгими минус-словами.</p>\n<h3 id=\"63-как-собрать-ядро\">6.3 Как собрать ядро</h3>\n<ol><li><strong>Идеи из ваших данных:</strong> запросы Яндекса и Search Console (у вас уже есть <code>yandex_requests_belarus_*.csv</code>).</li><li><strong>Планировщик ключевых слов</strong> (в кабинете): оценка частоты и цены клика.</li><li><strong>Подсказки Google</strong> и «похожие запросы».</li><li><strong>Конкуренты:</strong> какие объявления показывают по вашим запросам (поиск в режиме инкогнито с геолокацией Брест).</li><li><strong>Кластеризация:</strong> группируйте по услуге и намерению. Одна группа, одна страница, 5–10 ключей.</li><li><strong>Отсев:</strong> уберите слова с информационным намерением.</li></ol>\n<h3 id=\"64-минус-слова\">6.4 Минус-слова</h3>\n<p>Минус-слово запрещает показ по запросам с этим словом. Это <strong>самый быстрый способ сэкономить</strong>.</p>\n<ul><li><strong>Общий список для аккаунта:</strong> «своими руками», «самому», «чертёж», «бесплатно», «вакансии», «фото», «видео», города вне региона.</li><li><strong>По кампаниям:</strong> для колец «пластиковые», для манипулятора «купить манипулятор», «запчасти».</li><li><strong>Ежедневная работа первые 2 недели:</strong> отчёт «Поисковые запросы» (глава 13), всё лишнее в минус.</li></ul>\n<p>Типы минус-слов: фразовое и точное. Широкое минус-слово исключает запрос только если в нём есть <strong>все</strong> слова (в любом порядке).</p>\n<h3 id=\"65-рабочий-процесс\">6.5 Рабочий процесс</h3>\n<div class=\"codewrap\"><button class=\"copy\" type=\"button\" aria-label=\"Копировать код\">Копировать</button><pre><code class=\"lang-text\">запросы -&gt; кластеры -&gt; группы -&gt; ключи (фраза + точное) -&gt; объявления -&gt; показы\n                                     ^                                   |\n                    минус-слова &lt;---- отчёт \"поисковые запросы\" &lt;--------+</code></pre></div>\n<aside class=\"callout analogy\"><p><strong>Аналогия для программиста.</strong> Минус-слова это denylist. Отчёт «поисковые запросы» это лог реальных обращений. Вы пишете правила по логу, как фильтры на входе API.</p></aside>\n<h3 id=\"что-сделать-на-вашем-сайте\">Что сделать на вашем сайте</h3>\n<ul><li>Используйте готовый <a href=\"#/kw\">google-ads-keywords.csv</a> и списки минус-слов из <a href=\"#/plan\">плана</a>.</li><li>Через 3 дня после запуска разберите отчёт «Поисковые запросы» и добавьте минус-слова.</li></ul>\n<hr>", "text": " 6.1 Намерение запроса Запросы бывают трёх типов: Намерение Пример Для вашей услуги Коммерческое (купить, заказать) «канализация под ключ брест цена» Основа кампании Информационное «как сделать кессон своими руками» Не рекламировать (минус-слова), но можно вести блог Навигационное «название вашей компании» Брендовые запросы, их защищают отдельно В ваших данных Яндекса по Беларуси видно: 70% показов блога приходятся на «сделай сам», а коммерческие запросы дают клики на главную и каталог. Реклама должна покупать коммерческие запросы. Ваши данные: запросы Яндекса по Беларуси (23.09–06.10.2026), топ по показам: Запрос Показы Клики Страница кольца канализационные купить в бресте 8 2 /katalog/ манипулятор брест 8 0 /dostavka-manipulyatorom/ канализация брест 7 5 / канализация под ключ 6 0 / манипулятор брест услуги 6 0 /dostavka-manipulyatorom/ сергей стриж канализация брест 6 0 / услуги манипулятора в бресте 6 0 /dostavka-manipulyatorom/ купить канализационные кольца 5 1 /katalog/ 6.2 Типы соответствия Тип Запись Что подходит Пример Точное [канализация под ключ брест] Тот же смысл и намерение (допускаются близкие варианты) «монтаж канализации под ключ в бресте» Фраза \"канализация под ключ брест\" Запросы, содержащие смысл фразы «сколько стоит канализация под ключ брест» Широкое канализация под ключ Любые связанные по смыслу, в том числе далёкие «септики в минске», «чистка канализации» Близкие варианты (close variants) есть у точного и фразового типов: опечатки, формы слова, синонимы. Поэтому «точное» не значит «ровно эта строка». Правило малого бизнеса: старт только с фразы и точного , широкое после накопления данных и только с автоматикой ставок и строгими минус-словами. 6.3 Как собрать ядро Идеи из ваших данных: запросы Яндекса и Search Console (у вас уже есть yandex_requests_belarus_*.csv ). Планировщик ключевых слов (в кабинете): оценка частоты и цены клика. Подсказки Google и «похожие запросы». Конкуренты: какие объявления показывают по вашим запросам (поиск в режиме инкогнито с геолокацией Брест). Кластеризация: группируйте по услуге и намерению. Одна группа, одна страница, 5–10 ключей. Отсев: уберите слова с информационным намерением. 6.4 Минус-слова Минус-слово запрещает показ по запросам с этим словом. Это самый быстрый способ сэкономить . Общий список для аккаунта: «своими руками», «самому», «чертёж», «бесплатно», «вакансии», «фото», «видео», города вне региона. По кампаниям: для колец «пластиковые», для манипулятора «купить манипулятор», «запчасти». Ежедневная работа первые 2 недели: отчёт «Поисковые запросы» (глава 13), всё лишнее в минус. Типы минус-слов: фразовое и точное. Широкое минус-слово исключает запрос только если в нём есть все слова (в любом порядке). 6.5 Рабочий процесс Копировать запросы -> кластеры -> группы -> ключи (фраза + точное) -> объявления -> показы ^ | минус-слова <---- отчёт \"поисковые запросы\" <--------+ Аналогия для программиста. Минус-слова это denylist. Отчёт «поисковые запросы» это лог реальных обращений. Вы пишете правила по логу, как фильтры на входе API. Что сделать на вашем сайте Используйте готовый google-ads-keywords.csv и списки минус-слов из плана . Через 3 дня после запуска разберите отчёт «Поисковые запросы» и добавьте минус-слова. ", "toc": [["61-намерение-запроса", "6.1 Намерение запроса"], ["62-типы-соответствия", "6.2 Типы соответствия"], ["63-как-собрать-ядро", "6.3 Как собрать ядро"], ["64-минус-слова", "6.4 Минус-слова"], ["65-рабочий-процесс", "6.5 Рабочий процесс"], ["что-сделать-на-вашем-сайте", "Что сделать на вашем сайте"]]}, {"id": "ch7", "num": "7", "title": "Таргетинг: география, расписание, устройства, аудитории", "full": "7. Таргетинг: география, расписание, устройства, аудитории", "part": "Часть II. Стратегии продвижения", "html": "<h3 id=\"71-география\">7.1 География</h3>\n<p>Два режима:</p>\n<ul><li><strong>Присутствие:</strong> показывать людям, которые находятся (или обычно находятся) в выбранном регионе. <strong>Для вашего сайта выбирайте его.</strong></li><li><strong>Присутствие или интерес:</strong> ещё и тем, кто интересуется регионом (читает про Брест). Для услуги с выездом это нецелевые показы.</li></ul>\n<p>Можно задавать <strong>город, область, радиус</strong> вокруг точки. Брестская область это зона обслуживания, радиус около 35 км от Бреста подходит для старта. Исключайте регионы, где вы не работаете.</p>\n<p>В ваших данных GA4 были визиты из Москвы и Санкт-Петербурга: режим «присутствие» их отсечёт.</p>\n<h3 id=\"72-расписание\">7.2 Расписание</h3>\n<p>Показ по дням и часам. У вас <strong>Пн–Сб круглосуточно, воскресенье выходной</strong>. Расписание: все часы Пн–Сб, воскресенье отключить или корректировка ставки -100%.</p>\n<p>Через 2–3 недели посмотрите отчёт по часам. Если ночные клики не дают заявок, снизьте ставку ночью, но не отключайте сразу: ночные звонки могут быть ценными, если вы отвечаете.</p>\n<h3 id=\"73-устройства\">7.3 Устройства</h3>\n<p>Корректировки ставки по устройствам. В ваших данных Google <strong>78% показов с мобильных</strong>. Для услуги с кнопкой «Позвонить» мобильный трафик самый важный. На старте корректировок не делайте: данных мало.</p>\n<h3 id=\"74-аудитории\">7.4 Аудитории</h3>\n<ul><li><strong>Ремаркетинг:</strong> показ людям, уже побывавшим на сайте (после накопления списка).</li><li><strong>Своя аудитория (Customer Match):</strong> списки клиентов, нужны согласия и объём.</li><li><strong>Аудитории по интересам:</strong> для медийной сети, а не для вашего поискового старта.</li></ul>\n<p><strong>Правило:</strong> добавляйте аудитории в режиме <strong>наблюдения</strong> (observation), а не <strong>таргетинга</strong> (targeting), иначе вы сузите показ до малой аудитории.</p>\n<h3 id=\"75-порядок-корректировок\">7.5 Порядок корректировок</h3>\n<ol><li>Сначала запросы и минус-слова.</li><li>Потом гео и время.</li><li>Потом устройства.</li><li>В конце аудитории.</li></ol>\n<h3 id=\"что-сделать-на-вашем-сайте\">Что сделать на вашем сайте</h3>\n<ul><li>Гео: режим «Присутствие», Брест и радиус; Пинск и Барановичи отдельной кампанией D.</li><li>Расписание Пн–Сб круглосуточно.</li><li>Устройства без корректировок первые 2 недели.</li></ul>", "text": " 7.1 География Два режима: Присутствие: показывать людям, которые находятся (или обычно находятся) в выбранном регионе. Для вашего сайта выбирайте его. Присутствие или интерес: ещё и тем, кто интересуется регионом (читает про Брест). Для услуги с выездом это нецелевые показы. Можно задавать город, область, радиус вокруг точки. Брестская область это зона обслуживания, радиус около 35 км от Бреста подходит для старта. Исключайте регионы, где вы не работаете. В ваших данных GA4 были визиты из Москвы и Санкт-Петербурга: режим «присутствие» их отсечёт. 7.2 Расписание Показ по дням и часам. У вас Пн–Сб круглосуточно, воскресенье выходной . Расписание: все часы Пн–Сб, воскресенье отключить или корректировка ставки -100%. Через 2–3 недели посмотрите отчёт по часам. Если ночные клики не дают заявок, снизьте ставку ночью, но не отключайте сразу: ночные звонки могут быть ценными, если вы отвечаете. 7.3 Устройства Корректировки ставки по устройствам. В ваших данных Google 78% показов с мобильных . Для услуги с кнопкой «Позвонить» мобильный трафик самый важный. На старте корректировок не делайте: данных мало. 7.4 Аудитории Ремаркетинг: показ людям, уже побывавшим на сайте (после накопления списка). Своя аудитория (Customer Match): списки клиентов, нужны согласия и объём. Аудитории по интересам: для медийной сети, а не для вашего поискового старта. Правило: добавляйте аудитории в режиме наблюдения (observation), а не таргетинга (targeting), иначе вы сузите показ до малой аудитории. 7.5 Порядок корректировок Сначала запросы и минус-слова. Потом гео и время. Потом устройства. В конце аудитории. Что сделать на вашем сайте Гео: режим «Присутствие», Брест и радиус; Пинск и Барановичи отдельной кампанией D. Расписание Пн–Сб круглосуточно. Устройства без корректировок первые 2 недели. ", "toc": [["71-география", "7.1 География"], ["72-расписание", "7.2 Расписание"], ["73-устройства", "7.3 Устройства"], ["74-аудитории", "7.4 Аудитории"], ["75-порядок-корректировок", "7.5 Порядок корректировок"], ["что-сделать-на-вашем-сайте", "Что сделать на вашем сайте"]]}, {"id": "ch8", "num": "8", "title": "Как создавать конверсионные объявления", "full": "8. Как создавать конверсионные объявления", "part": "Часть III. Объявления и страницы", "html": "<h3 id=\"81-адаптивное-поисковое-объявление-rsa\">8.1 Адаптивное поисковое объявление (RSA)</h3>\n<p>Сегодня основной формат это <strong>адаптивное поисковое объявление (Responsive Search Ad, RSA)</strong>. Вы даёте <strong>набор заголовков</strong> (до 15, по 30 знаков) и <strong>описаний</strong> (до 4, по 90 знаков), а Google собирает из них комбинации и учится, какие работают лучше.</p>\n<div class=\"tablewrap\"><table><thead><tr><th>Поле</th><th>Лимит</th><th>Заметки</th></tr></thead><tbody><tr><td data-label=\"Поле\">Заголовки</td><td data-label=\"Лимит\">от 3 до 15, до 30 знаков</td><td data-label=\"Заметки\">Показываются по 2–3 в одной строке</td></tr><tr><td data-label=\"Поле\">Описания</td><td data-label=\"Лимит\">от 2 до 4, до 90 знаков</td><td data-label=\"Заметки\">Показываются по 1–2</td></tr><tr><td data-label=\"Поле\">Путь (path)</td><td data-label=\"Лимит\">2 поля по 15 знаков</td><td data-label=\"Заметки\"><code>kanalizacia-brest.by/montazh/brest</code></td></tr><tr><td data-label=\"Поле\">Конечный URL</td><td data-label=\"Лимит\">страница сайта</td><td data-label=\"Заметки\">Своя для каждой группы</td></tr></tbody></table></div>\n<aside class=\"callout analogy\"><p><strong>Аналогия для программиста.</strong> RSA это мультивариантный тест (multi-armed bandit): система сама перебирает комбинации и показывает те, что дают больше кликов и конверсий.</p></aside>\n<h3 id=\"82-формула-сильного-заголовка\">8.2 Формула сильного заголовка</h3>\n<p>Хорошее объявление отвечает на пять вопросов человека:</p>\n<ol><li><strong>Что это?</strong> (ключ из запроса: «канализация под ключ», «кольца ЖБИ», «манипулятор»).</li><li><strong>Где?</strong> (Брест, область).</li><li><strong>Чем вы лучше / в чём выгода?</strong> (замер бесплатно, свой манипулятор, цена без наценки).</li><li><strong>Что делать дальше?</strong> (рассчитать, позвонить, заказать).</li><li><strong>Как это проверить?</strong> (конкретика: «200 руб до 30 км», «за 1–3 дня»).</li></ol>\n<p><strong>Набор заголовков для одной группы (минимум 10–12):</strong></p>\n<div class=\"tablewrap\"><table><thead><tr><th>Тип</th><th>Пример</th><th>Зачем</th></tr></thead><tbody><tr><td data-label=\"Тип\">Ключ</td><td data-label=\"Пример\">Канализация под ключ в Бресте</td><td data-label=\"Зачем\">Релевантность запросу</td></tr><tr><td data-label=\"Тип\">Выгода</td><td data-label=\"Пример\">Выезд на замер бесплатно</td><td data-label=\"Зачем\">Снимает риск</td></tr><tr><td data-label=\"Тип\">Доказательство</td><td data-label=\"Пример\">Монтаж за 1–3 дня</td><td data-label=\"Зачем\">Конкретика</td></tr><tr><td data-label=\"Тип\">Цена/условия</td><td data-label=\"Пример\">Доставка: 200 руб до 30 км</td><td data-label=\"Зачем\">Фильтрует нецелевых</td></tr><tr><td data-label=\"Тип\">Доверие</td><td data-label=\"Пример\">Свой манипулятор и кольца ЖБИ</td><td data-label=\"Зачем\">Ответ «почему вы»</td></tr><tr><td data-label=\"Тип\">Действие</td><td data-label=\"Пример\">Рассчитайте цену онлайн</td><td data-label=\"Зачем\">Призыв</td></tr><tr><td data-label=\"Тип\">Регион</td><td data-label=\"Пример\">Брест и Брестская область</td><td data-label=\"Зачем\">Локальность</td></tr></tbody></table></div>\n<h3 id=\"83-правила-хороших-описаний\">8.3 Правила хороших описаний</h3>\n<ul><li>Первое предложение повторяет <strong>главную выгоду и ключ</strong>.</li><li>Второе предложение даёт <strong>конкретику</strong> (условия, факты).</li><li>Последнее: <strong>призыв к действию</strong> («Позвоните», «Рассчитайте»).</li><li>Каждое описание <strong>самодостаточно</strong>: оно может показываться отдельно.</li></ul>\n<h3 id=\"84-разбор-слабое-и-сильное\">8.4 Разбор: слабое и сильное</h3>\n<div class=\"tablewrap\"><table><thead><tr><th></th><th>Слабое</th><th>Сильное</th></tr></thead><tbo
