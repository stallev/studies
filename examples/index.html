check\"><span class=\"box\"></span><span><strong>Безопасность:</strong> <code>creds/project_creds.json</code> удалён с хостинга, пароль WP сменён, токен бота перевыпущен, служебные каталоги темы отдают 403/404, <code>/wp-json/wp/v2/users</code> закрыт для анонимов.</span></li><li class=\"check\"><span class=\"box\"></span><span>Ответ hoster.by получен, обрывов TLS не более 1–2% на серии из 100 запросов, AdsBot допущен (повторить замер).</span></li><li class=\"check\"><span class=\"box\"></span><span><strong>Цены подтверждены владельцем</strong>, статус <code>demo</code> снят, цифры из объявлений совпадают с сайтом.</span></li><li class=\"check\"><span class=\"box\"></span><span>Правки задеплоены на прод, страницы открываются, кнопки Telegram и телефон работают.</span></li><li class=\"check\"><span class=\"box\"></span><span>GA4 связан с Google Ads, 3 конверсии импортированы, тестовый клик подтверждён.</span></li><li class=\"check\"><span class=\"box\"></span><span>Созданы кампании этапа 1 (A, B) с настройками раздела 4.</span></li><li class=\"check\"><span class=\"box\"></span><span>Добавлены ключевые слова, объявления, ресурсы и минус-слова.</span></li><li class=\"check\"><span class=\"box\"></span><span>Включена проверка рекламодателя Google, если кабинет её требует (проверить в разделе «Рекламодатель»).</span></li><li class=\"check\"><span class=\"box\"></span><span>Дневной бюджет ≈ $3,3 в сутки суммарно и ограничение макс. CPC установлены, включена предоплата без автопополнения свыше $100.</span></li><li class=\"check\"><span class=\"box\"></span><span>Включена таблица «откуда узнали».</span></li></ol>\n<hr>\n<h3 id=\"10-первые-3-недели-что-смотреть\">10. Первые 3 недели: что смотреть</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>Когда</th><th>Что делать</th></tr></thead><tbody><tr><td data-label=\"Когда\">День 1</td><td data-label=\"Что делать\">Проверить, что все объявления «Одобрено» (нет «Целевая страница недоступна»), метки UTM читаются в GA4 в реальном времени</td></tr><tr><td data-label=\"Когда\">Дни 2–3</td><td data-label=\"Что делать\">Отчёт «Поисковые запросы»: добавить в минус-слова всё лишнее (самодельщики, другие города, покупка техники)</td></tr><tr><td data-label=\"Когда\">Неделя 1</td><td data-label=\"Что делать\">CTR по группам: слабые заголовки заменить; ключи без показов проверить на соответствие</td></tr><tr><td data-label=\"Когда\">Неделя 2</td><td data-label=\"Что делать\">Конверсии по группам и по устройствам; сверить с таблицей «откуда узнали»; убрать убыточные ключи</td></tr><tr><td data-label=\"Когда\">Неделя 3</td><td data-label=\"Что делать\">Решение: поднять бюджет у лучших групп, запустить этап 2 (C, D, E), перейти на «Максимум конверсий» при 15+ конверсиях</td></tr></tbody></table></div>\n<p><strong>Ориентиры для поиска по местным услугам</strong> (не гарантия, зависят от конкуренции): CTR 5–10% и выше на точных запросах, конверсия сайта в заявку 3–8% от кликов. Если после ~125 кликов на кампанию нет ни одной заявки или звонка (при реальной конверсии ≥3% шанс этого около 2%), сломан трекинг, страница или оффер: чинить их, а не поднимать бюджет. На 125 кликах нельзя сравнивать заголовки и включать автостратегии.</p>\n<h3 id=\"11-риски\">11. Риски</h3>\n<ul><li><strong>Хостинг:</strong> пока есть обрывы TLS и нет подтверждения допуска AdsBot, часть кликов теряется или объявления отклоняются.</li><li><strong>Малый спрос:</strong> для некоторых слов Google может показывать мало показов. Это нормально для региона; расширять нужно ключами, а не широким соответствием.</li><li><strong>Атрибуция звонков:</strong> без звонков через кнопку и без таблицы «откуда узнали» реальная отдача занижена.</li><li><strong>Сезон:</strong> монтаж канализации сезонный, обучение показа и оптимизация займут 2–3 недели, а сезон идёт; запускать нужно как можно раньше после выполнения условий раздела 1.</li><li><strong>Яндекс.Директ:</strong> приводит основную часть трафика (около 53% пользователей), но часть сервисов Яндекса сейчас недоступна; вернитесь к нему отдельным этапом.</li></ul>", "text": "Версия 2 от 26.10.2026 (первая версия 22.10.2026) · Сайт: https://kanalizacia-brest.by · Сервис: Google Ads (рекламная сеть Google, бывший AdWords). AdSense не используется. Файлы для копирования: google-ads-keywords.csv (ключевые слова с типами соответствия и посадочными), google-ads-ads.csv (адаптивные объявления: заголовки и описания). Что изменилось в версии 2 (26.10.2026), по итогам анализа GSC за 73 дня, GA4 за 90 дней и проверки прода: Этап 1 сужен до двух кампаний: A (монтаж, 65%) и B (кольца, 35%). Манипулятор (C) переносится на этап 2: на $3,5 в сутки три кампании не набирают статистику. Бюджет $100 на 4 недели ≈ $3,3 в сутки суммарно (A $2,2, B $1,1), предоплата без автопополнения. Подробная оценка: RESEARCH-2026-10-26.md , раздел 8. Три новых условия запуска: закрыть публичные секреты на проде, подтвердить цены (в прайсе стоит demo ), пройти сквозной тест конверсий. Группа «Септик» ведёт на /montazh-kanalizacii-pod-klyuch/#systems , пока нет отдельной страницы /septik-pod-klyuch-brest/ . Критерий остановки пересчитан: ~125 кликов на кампанию без единой заявки = сломан трекинг, страница или оффер. Повторный замер TLS 26.10: 12 обрывов из 30 запросов (40%) : запуск по-прежнему заблокирован. 1. Статус: что должно быть сделано до запуска # Условие Статус 1 Оплата и доступность Google Ads из Беларуси ✅ проверено владельцем 2 Обрывы TLS на хостинге (26.10: 12 из 30 запросов, 40%) ❌ обращение отправлено 22.10, ответа нет 3 AdsBot-Google и AdsBot-Google-Mobile допущены хостингом ⏳ в том же обращении 4 Исправления сайта на проде (Telegram-кнопки, тексты, график, блок про Пинск) ⏳ деплой 5 Конверсии: GA4 связан с Google Ads, импортированы 3 события ⏳ после создания аккаунта 6 Таблица «откуда узнали» для звонков ⏳ владелец 7 Секреты на проде закрыты (файл creds/project_creds.json отдаёт 200 с паролем WP и токеном бота; пароль сменить, токен перевыпустить) ❌ проверено 26.10: открыт 8 Цены подтверждены (в прайсе на проде priceStatus: demo ; в объявлениях «200 руб до 30 км») ❌ владелец 9 Сквозной тест конверсий ( click_phone , click_telegram , generate_lead в GA4 DebugView, затем в Google Ads) ⏳ до запуска Не запускать платный трафик, пока не выполнены 2–4 и 7–9 : каждый оборванный клик оплачен и потерян. 2. Цели и ожидания Главная цель: заявки и звонки с сайта (событие generate_lead , клик по телефону click_phone , клик по Telegram click_telegram ). Объём небольшой. В Беларуси спрос по Яндексу на «канализация под ключ» всего 35 запросов за 14 дней, в Google, вероятно, меньше. Ожидайте десятки кликов в неделю на ядро, а не сотни. Первые 2–3 недели — тест: собрать данные о ключевых словах, CTR и конверсиях, затем решать о бюджете. Автоматические стратегии (максимум конверсий) включать только после 15–30 конверсий. Бюджет владельца: $100 на 3–4 недели (≈ $3,3–3,5 в сутки). Это тест гипотезы, а не план получения N клиентов: ограничением будет объём запросов в Бресте, а не деньги. Оценка и сценарии: RESEARCH-2026-10-26.md , раздел 8. Для оценки конверсии нужно 30–50 кликов на каждую услугу; реальные цены клика покажет «Планировщик ключевых слов» в кабинете (я их не вижу). 3. Структура кампаний Тип: Поисковая сеть (Search), без Медийной сети и без партнёров по поиску (отключить обе галочки). Языки: русский (и белорусский, если хотите охватить). Распределение бюджета по вашему приоритету услуг. Кампания Что рекламируем Доля бюджета Гео Этап A. Монтаж под ключ Монтаж канализации и септика под ключ (услуга №1) 65% (≈ $2,2 в сутки) Брест и окрестности (для старта радиус около 35 км, уточните по зоне выезда) запуск B. Кольца ЖБИ Кольца ЖБИ и комплектующие (услуга №2) 35% (≈ $1,1 в сутки) Брест и окрестности (для старта радиус около 35 км, уточните по зоне выезда) запуск C. Манипулятор Брест Манипулятор в Бресте (услуга №3) после результатов A–B Брест и окрестности (радиус около 35 км) этап 2 (перенесён: на $3,5 в сутки статистики не будет) D. Манипулятор Пинск и Барановичи Манипулятор в Пинске и Барановичах после результатов A–C Пинск, Барановичи позже E. Кессоны Кессоны (услуга №4) после результатов A–C Брест + Брестский район позже Этап 1: кампании A и B. Этап 2: C, D и E после первых результатов (D требует отдельного гео, поэтому это отдельная кампания). Посадочные страницы Группа объявлений Страница A / Канализация под ключ https://kanalizacia-brest.by/montazh-kanalizacii-pod-klyuch/ A / Септик https://kanalizacia-brest.by/montazh-kanalizacii-pod-klyuch/#systems (позже /septik-pod-klyuch-brest/ , когда появится) B / Кольца ЖБИ купить https://kanalizacia-brest.by/katalog/koltsa-zhbi/ B / Доборы и комплектующие https://kanalizacia-brest.by/katalog/ C / Манипулятор Брест https://kanalizacia-brest.by/dostavka-manipulyatorom/ D / Манипулятор Пинск Барановичи https://kanalizacia-brest.by/dostavka-manipulyatorom/#baranovichi-pinsk E / Кессон для скважины https://kanalizacia-brest.by/kesson-dlya-skvazhiny/ Конкретные страницы выбраны потому, что их H1 и title совпадают с запросами (проверено аудитом). Не отправляйте рекламу на главную: у неё нет совпадения с «кольца» или «манипулятор». 4. Настройки кампаний Параметр Значение Почему Цель кампании «Потенциальные клиенты» (Leads), тип кампании «Поиск», без рекомендованного Google шаблона Подходит для заявок и звонков Сети Только Поиск Google. Отключить «Поисковые партнёры» и Медийную сеть Меньше мусорных кликов Гео Параметр « Присутствие » (люди, находящиеся в регионе), а не «присутствие или интерес» Иначе показ людям из России (в GA4 были Москва и Петербург) Расписание Пн–Сб круглосуточно , воскресенье отключить (или -100% к ставке); ночью 23:00–07:00 ставка −30% Воскресенье выходной; ночью звонок не примут, форма и Telegram работают Устройства Все; на мобильных обязательно кнопка «Позвонить» 78% показов в Google с мобильных Ставки (старт) «Ручное назначение ставок» или «Максимум кликов» с ограничением макс. CPC $0,80 (поправить после Планировщика) Конверсий мало, автоматика не обучится Ставки (позже) «Максимум конверсий» после 15–30 конверсий за 30 дней Автоматика требует данных Соответствие Только фраза и точное ; широкое не использовать на старте Контроль запросов при малом бюджете Автотеггинг Включён (gclid), GA4 связан с Google Ads Нужен для импорта конверсий и атрибуции Суффикс конечного URL utm_source=google&utm_medium=cpc&utm_campaign={campaignid}&utm_content={adgroupid}&utm_term={keyword} Метки читаются GA4 и Яндекс.Метрикой, совпадают с UTM-LINKS.md ( medium=cpc ) Динамические вставки, DSA, Performance Max Не использовать на старте Нужны данные и бюджет 5. Конверсии В Google Ads: Цели → Конверсии → «Создать» → «Импорт» → Google Analytics 4 . Импортировать только 3 события: generate_lead (основная, заявка с формы), click_phone (основная, звонок), click_telegram (вторичная). Остальные события ( lightbox_open , calculator_interact , calc_open , click_cta_form ) не импортировать. Значения конверсии: если не знаете ценность заявки, оставьте без значений (стратегия «максимум конверсий» будет работать по числу). Проверка: открыть сайт по тестовой ссылке рекламы ( ?gclid=TEST ) в обычном окне (не от имени администратора), кликнуть по телефону и по Telegram, убедиться в DebugView GA4, затем через сутки в Google Ads. Звонки не через кнопку (набрали номер вручную) в Google Ads не попадут. Ведите таблицу «откуда узнали» и сверяйте её со статистикой раз в неделю. Расширение «Номер телефона» (call asset): +375 29 527-00-00 . Отчёт по звонкам из рекламы с номером Google в Беларуси может быть недоступен: проверить в кабинете. 6. Ключевые слова и объявления по группам Типы соответствия: каждое слово добавляется в кавычках (фраза) и в квадратных скобках (точное) . Полный список с посадочными: google-ads-keywords.csv . Ключевые слова взяты из реальных запросов Яндекса по Беларуси (файлы yandex_requests_belarus_*.csv ) и спроса по услугам. A. Монтаж под ключ / Канализация под ключ Страница: https://kanalizacia-brest.by/montazh-kanalizacii-po ылет стрелы 11 м. Стройматериалы, лесоматериалы, негабарит. Договор и смета.\" \"E. Кессоны\",\"Кессон для скважины\",\"https://kanalizacia-brest.by/kesson-dlya-skvazhiny/\",\"Кессон для скважины в Бресте\",\"Бетонный и пластиковый кессон\",\"Установка кессона под ключ\",\"Своё производство колец\",\"Выезд на замер бесплатно\",\"Брест и Брестская область\",\"Безнал и кредитные средства\",\"Работаем Пн–Сб круглосуточно\",\"Назовите глубину скважины\",\"Рассчитаем стоимость\",\"Заказать кессон\",\"Копка, кольца, монтаж\",\"\",\"\",\"\",\"Кессон для скважины: бетонный (кольца собственного производства) или пластиковый.\",\"Установка под ключ: копка, монтаж, гидроизоляция. Замер бесплатно.\",\"Скажите тип скважины и глубину по телефону — назовём вилку сразу.\",\"Безналичный расчёт. Брест, Брестский район и область.\"", "toc": []}, {"id": "utm", "num": "28", "title": "Ссылки с UTM-метками", "full": "28. Ссылки с UTM-метками", "part": "Часть VII. Ваш проект: стратегия и план (обновлено 26.10.2026)", "html": "<p><strong>Дата:</strong> 22.10.2026 · <strong>Сайт:</strong> <code>https://kanalizacia-brest.by/</code> <strong>Зачем:</strong> когда человек переходит с карточки, объявления, QR-кода или соцсети, GA4 (и позже Яндекс.Метрика) показывают, откуда он пришёл. Без меток такие переходы теряются в «Direct» (на сайте их сейчас около 40% трафика, качество низкое). <strong>Таблица для копирования:</strong> <a href=\"#/utm\">utm-links.csv</a> (те же ссылки в формате CSV, открывается в Excel и Google Таблицах).</p>\n<hr>\n<h3 id=\"1-правила-коротко\">1. Правила (коротко)</h3>\n<ol><li><strong>Метки ставим только на внешние ссылки</strong>, которые ведут на ваш сайт (карточки, объявления, соцсети, QR). <strong>На ссылки внутри сайта метки не ставим</strong>: они обрывают сессию и портят статистику.</li><li><strong>Всё латиницей, строчными буквами, без пробелов</strong>; слова разделять <code>_</code>.</li><li><strong>Один канал = одна пара <code>utm_source</code> + <code>utm_medium</code>.</strong> Не придумывать новые варианты написания: <code>kufar</code> и <code>Kufar</code> GA4 считает разными источниками.</li><li><strong>Метки не мешают поиску.</strong> У страниц сайта <code>canonical</code> без параметров (проверено на главной и страницах услуг), поэтому поисковики не считают ссылки с метками дублями.</li><li><strong>Ссылку не сокращать и не менять вручную</strong> после копирования. Если площадка режет параметры, сообщите мне.</li><li><strong>Якорь <code>#calc</code> ставится после параметров</strong> (так уже сделано в таблице ниже).</li></ol>\n<h3 id=\"2-как-устроены-метки\">2. Как устроены метки</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>Параметр</th><th>Что значит</th><th>Примеры значений</th></tr></thead><tbody><tr><td data-label=\"Параметр\"><code>utm_source</code></td><td data-label=\"Что значит\"><strong>Где</strong> стоит ссылка (площадка)</td><td data-label=\"Примеры значений\"><code>google_business</code>, <code>yandex_business</code>, <code>kufar</code>, <code>onliner</code>, <code>instagram</code>, <code>telegram</code>, <code>messenger</code>, <code>qr</code>, <code>email</code></td></tr><tr><td data-label=\"Параметр\"><code>utm_medium</code></td><td data-label=\"Что значит\"><strong>Тип</strong> размещения</td><td data-label=\"Примеры значений\"><code>referral</code> (карточки и каталоги), <code>social</code> (соцсети), <code>messenger</code> (личные сообщения), <code>offline</code> (QR-коды), <code>email</code>, <code>cpc</code> (платная реклама)</td></tr><tr><td data-label=\"Параметр\"><code>utm_campaign</code></td><td data-label=\"Что значит\"><strong>Какое</strong> именно размещение</td><td data-label=\"Примеры значений\"><code>gbp_website</code>, <code>ad</code>, <code>bio</code>, <code>vizitka</code>, <code>tehnika</code></td></tr><tr><td data-label=\"Параметр\"><code>utm_content</code></td><td data-label=\"Что значит\"><strong>Какая услуга или вариант</strong> (необязательно)</td><td data-label=\"Примеры значений\"><code>montazh</code>, <code>koltsa</code>, <code>manipulyator</code>, <code>kesson</code>, <code>vyvoz</code></td></tr></tbody></table></div>\n<p><strong>Почему для карточек Google и Яндекса выбран <code>referral</code>, а не <code>organic</code>.</strong> <code>organic</code> в GA4 означает обычный поиск, и переходы с карточек смешались бы с трафиком из поиска. Так видно отдельно: «Google Business Profile» против «обычная выдача».</p>\n<p><strong>Как это отобразится в GA4:</strong> Отчёты → Привлечение → Привлечение трафика → «Источник/канал сеанса». Переходы с <code>medium=referral</code> попадут в канал «Referral», <code>social</code> в «Organic Social», <code>email</code> в «Email», <code>cpc</code> в «Paid Search» (для рекламы Яндекса и Google). <code>offline</code> и <code>messenger</code> GA4 может показать как «Unassigned»; это нормально, фильтровать нужно по источнику (<code>qr</code>, <code>messenger</code>).</p>\n<h3 id=\"3-приоритет-услуг\">3. Приоритет услуг</h3>\n<p>Ссылки на услуги расположены по вашему приоритету: 1) монтаж под ключ → 2) кольца ЖБИ → 3) манипулятор → 4) кессоны и вывоз грунта. Если в карточке или объявлении можно указать только одну ссылку, ставьте ссылку на <strong>главную</strong> (<code>gbp_website</code>, <code>yabiz_website</code>, …) или на <strong>монтаж под ключ</strong>.</p>\n<hr>\n<h3 id=\"4-ссылки-по-каналам\">4. Ссылки по каналам</h3>\n<h4 id=\"карточки-организаций\">Карточки организаций</h4>\n<div class=\"tablewrap\"><table><thead><tr><th>Канал</th><th>Куда вставить</th><th>Страница</th><th>Статус</th><th>Ссылка</th></tr></thead><tbody><tr><td data-label=\"Канал\">Google Business Profile</td><td data-label=\"Куда вставить\">Поле «Веб-сайт»</td><td data-label=\"Страница\">Главная</td><td data-label=\"Статус\">создана, ждёт подтверждения</td><td data-label=\"Ссылка\"><code>https://kanalizacia-brest.by/?utm_source=google_business&amp;utm_medium=referral&amp;utm_campaign=gbp_website</code></td></tr><tr><td data печатан без метки, переделайте.</li><li><strong>Яндекс Бизнес</strong> и <strong>2ГИС</strong>: ссылки готовы, но размещать их можно, когда сервисы доступны (Яндекс сейчас недоступен, 2ГИС ещё не проверен).</li><li><strong>Реклама</strong> (<code>cpc</code>): не запускать, пока в GA4 и Метрике не работают цели (задачи 2.2 и 3.1 плана). Сейчас в таблице только шаблоны.</li><li>Когда карточка Google Business Profile будет подтверждена, замените в ней ссылку на сайт на ссылку из таблицы (если ещё не сделали).</li><li>Тексты и список каналов можно расширять: добавляйте строки в <code>utm-links.csv</code> по шаблону из раздела 5.</li></ul>", "text": "Дата: 22.10.2026 · Сайт: https://kanalizacia-brest.by/ Зачем: когда человек переходит с карточки, объявления, QR-кода или соцсети, GA4 (и позже Яндекс.Метрика) показывают, откуда он пришёл. Без меток такие переходы теряются в «Direct» (на сайте их сейчас около 40% трафика, качество низкое). Таблица для копирования: utm-links.csv (те же ссылки в формате CSV, открывается в Excel и Google Таблицах). 1. Правила (коротко) Метки ставим только на внешние ссылки , которые ведут на ваш сайт (карточки, объявления, соцсети, QR). На ссылки внутри сайта метки не ставим : они обрывают сессию и портят статистику. Всё латиницей, строчными буквами, без пробелов ; слова разделять _ . Один канал = одна пара utm_source + utm_medium . Не придумывать новые варианты написания: kufar и Kufar GA4 считает разными источниками. Метки не мешают поиску. У страниц сайта canonical без параметров (проверено на главной и страницах услуг), поэтому поисковики не считают ссылки с метками дублями. Ссылку не сокращать и не менять вручную после копирования. Если площадка режет параметры, сообщите мне. Якорь #calc ставится после параметров (так уже сделано в таблице ниже). 2. Как устроены метки Параметр Что значит Примеры значений utm_source Где стоит ссылка (площадка) google_business , yandex_business , kufar , onliner , instagram , telegram , messenger , qr , ema
