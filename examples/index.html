 1_000_000 print(row.campaign.name, row.metrics.clicks, cost, row.metrics.conversions) Нужны токен разработчика (developer token, заявка на доступ), OAuth-доступ и идентификатор клиента. Для вашего масштаба Scripts и Looker Studio проще . API имеет смысл, когда вы интегрируете рекламу с CRM или собственной панелью. 14.7 BigQuery Экспорт GA4 в BigQuery (бесплатный, в настройках GA4): таблицы событий по дням. Google Ads Data Transfer в BigQuery: статистика кампаний. SQL по обоим источникам. Пример: заявки по дням и источнику (на уровне пользователя, проверьте различия моделей атрибуции). Копировать SELECT PARSE_DATE('%Y%m%d', event_date) AS day, traffic_source.medium AS medium, COUNTIF(event_name = 'generate_lead') AS leads, COUNTIF(event_name = 'click_phone') AS phone_clicks FROM `PROJECT.analytics_PROPERTY.events_*` WHERE _TABLE_SUFFIX BETWEEN '20261101' AND '20261130' GROUP BY day, medium ORDER BY day, medium; Оговорка. traffic_source в GA4 хранит источник первого касания пользователя , для событий конкретной сессии используйте поля с collected_traffic_source и данные сессии. Проверьте схему текущего экспорта. 14.8 Версионирование и безопасность Храните структуру аккаунта в CSV (как в вашем google-ads-keywords.csv ) и импортируйте через Google Ads Editor : так изменения в git, а не только в кабинете. Не хардкодьте токены и секреты в скриптах, храните в защищённых настройках. Скрипты сначала запускайте в режиме предпросмотра . Любой скрипт, меняющий ставки или паузы, тестируйте на отдельной тестовой кампании. Ограничивайте права: скрипту, который только читает, не нужны права на запись. 14.9 Загрузка офлайн-конверсий (продажи по gclid) Когда сделка закрыта, загрузите её в Google Ads. В кабинете: Цели → Конверсии → Загрузки → создайте действие «Импорт» из кликов. Файл CSV (шаблон лучше скачать из кабинета, формат может меняться): Копировать Parameters:TimeZone=+0300 Google Click ID,Conversion Name,Conversion Time,Conversion Value,Conversion Currency EAIaIQobChMI-пример-gclid,Заявка закрыта,2026-11-10 14:30:00,800,BYN Google Click ID вы сохранили вместе с заявкой (раздел 11.6). Conversion Name должно совпадать с названием действия в кабинете. Часовой пояс: Минск UTC+3, то есть +0300 . Окно загрузки: до 90 дней после клика. Загрузку можно автоматизировать скриптом или API; для вашего объёма ручной CSV раз в неделю достаточно. 14.10 Если скрипт не работает Проблема Причина и решение Нет прав Скрипт просит разрешение на доступ к таблице или почте: предоставьте при первом запуске Ошибка запроса В скриптах используется GAQL через AdsApp.search . Старый язык AWQL больше не используется Поля пустые Названия полей в скриптах пишутся в верхнем «верблюжьем» регистре ( row.metrics.costMicros ), в запросе в виде metrics.cost_micros Скрипт долго работает Лимит времени выполнения (около 30 минут), добавляйте фильтры и LIMIT Письма не приходят Проверьте адрес, папку спам, квоты почты скриптов Результаты странные Запустите в режиме предпросмотра и выведите данные в журнал ( Logger.log ) Что сделать на вашем сайте После запуска поставьте скрипт проверки страниц (14.3) на каждый час. Через 2–3 недели соберите дашборд в Looker Studio (расход, клики, конверсии, цена заявки, таблица звонков). ", "toc": [["141-уровни-автоматизации", "14.1 Уровни автоматизации"], ["142-gaql-язык-запросов-google-ads", "14.2 GAQL: язык запросов Google Ads"], ["143-скрипт-1-проверка-доступности-страниц-для-вашей-ситуации", "14.3 Скрипт 1: проверка доступности страниц (для вашей ситуации с TLS)"], ["144-скрипт-2-оповещение-о-расходе", "14.4 Скрипт 2: оповещение о расходе"], ["145-скрипт-3-кандидаты-в-минус-слова-по-словам-запросов", "14.5 Скрипт 3: кандидаты в минус-слова по словам запросов"], ["146-python-и-api", "14.6 Python и API"], ["147-bigquery", "14.7 BigQuery"], ["148-версионирование-и-безопасность", "14.8 Версионирование и безопасность"], ["149-загрузка-офлайн-конверсий-продажи-по-gclid", "14.9 Загрузка офлайн-конверсий (продажи по gclid)"], ["1410-если-скрипт-не-работает", "14.10 Если скрипт не работает"], ["что-сделать-на-вашем-сайте", "Что сделать на вашем сайте"]]}, {"id": "ch15", "num": "15", "title": "Метрики, окупаемость и решения", "full": "15. Метрики, окупаемость и решения", "part": "Часть IV. Аналитика и инструменты", "html": "<h3 id=\"151-юнит-экономика\">15.1 Юнит-экономика</h3>\n<p>Реклама окупается, если стоимость привлечения клиента ниже его прибыли.</p>\n<div class=\"codewrap\"><button class=\"copy\" type=\"button\" aria-label=\"Копировать код\">Копировать</button><pre><code class=\"lang-text\">Цена заявки (CPL) = расход / заявки\nЦена клиента (CAC) = расход / клиенты  = CPL / (доля заявок, ставших клиентами)\nПрибыль клиента = выручка x маржа\nОкупаемость: CAC &lt; прибыль клиента\nПредельный CPL = прибыль клиента x доля заявок, ставших клиентами</code></pre></div>\n<p><strong>Пример (условные числа).</strong> Прибыль с заказа 800, из 10 заявок продажей заканчиваются 3. Тогда предельный CPL = 800 x 0,3 = 240 и предельная цена клика при конверсии 5% = 240 x 0,05 = 12. Если реальная цена клика выше, кампания убыточна.</p>\n<p>Подставьте свои числа для услуг по приоритету:</p>\n<div class=\"tablewrap\"><table><thead><tr><th>Услуга</th><th>Прибыль с заказа</th><th>Доля заявок → заказ</th><th>Предельный CPL</th><th>Конверсия клика в заявку</th><th>Предельный CPC</th></tr></thead><tbody><tr><td data-label=\"Услуга\">Монтаж под ключ</td><td data-label=\"Прибыль с заказа\">(ваше)</td><td data-label=\"Доля заявок → заказ\">(ваше)</td><td data-label=\"Предельный CPL\">прибыль x доля</td><td data-label=\"Конверсия клика в заявку\">3–8%</td><td data-label=\"Предельный CPC\">CPL x конверсия</td></tr><tr><td data-label=\"Услуга\">Кольца ЖБИ</td><td data-label=\"Прибыль с заказа\">(ваше)</td><td data-label=\"Доля заявок → заказ\">(ваше)</td><td data-label=\"Предельный CPL\">…</td><td data-label=\"Конверсия клика в заявку\">…</td><td data-label=\"Предельный CPC\">…</td></tr><tr><td data-label=\"Услуга\">Манипулятор</td><td data-label=\"Прибыль с заказа\">(ваше)</td><td data-label=\"Доля заявок → заказ\">(ваше)</td><td data-label=\"Предельный CPL\">…</td><td data-label=\"Конверсия клика в заявку\">…</td><td data-label=\"Предельный CPC\">…</td></tr></tbody></table></div>\n<h3 id=\"152-калькулятор-бюджета\">15.2 Калькулятор бюджета</h3>\n<div class=\"widget\" data-widget=\"budget-calc\"></div>\n<h3 id=\"153-влияние-недоступности-сайта-на-цену-заявки\">15.3 Влияние недоступности сайта на цену заявки</h3>\n<p>Если доля оплаченных кликов, которые не дошли до сайта, равна <code>p</code>, то реальная цена заявки растёт в <code>1 / (1 - p)</code> раза.</p>\n<div class=\"widget\" data-widget=\"cpl-failure\"></div>\n<div class=\"tablewrap\"><table><thead><tr><th>Доля сбоев</th><th>Рост реальной цены заявки</th></tr></thead><tbody><tr><td data-label=\"Доля сбоев\">5%</td><td data-label=\"Рост реальной цены заявки\">x1,05</td></tr><tr><td data-label=\"Доля сбоев\">10%</td><td data-label=\"Рост реальной цены заявки\">x1,11</td></tr><tr><td data-label=\"Доля сбоев\">20%</td><td data-label=\"Рост реальной цены заявки\">x1,25</td></tr><tr><td data-label=\"Доля сбоев\">30%</td><td data-label=\"Рост реальной цены заявки\">x1,43</td></tr><tr><td data-label=\"Доля сбоев\">43%</td><td data-label=\"Рост реальной цены заявки\">x1,75</td></tr></tbody></table></div>\n<p>Поэтому решение проблемы с обрывами TLS не техническая мелочь, а прямое снижение стоимости заявки.</p>\n<h3 id=\"154-правила-если-то\">15.4 Правила «если… то…»</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>Условие</th><th>Действие</th></tr></thead><tbody><tr><td data-label=\"Условие\">После 100 кликов в группе нет заявок</td><td data-label=\"Действие\">Проверить страницу, трекинг, запросы. Не повышать ставки</td></tr><tr><td data-label=\"Условие\">CTR группы меньше 2–3% при позиции 1–3</td><td data-label=\"Действие\">Переписать заголовки, сузить ключи</td></tr><tr><td data-label=\"Условие\">Цена клика выше предельной</td><td data-label=\"Действие\">Снизить ставку, убрать дорогие широкие слова</td></tr><tr><td data-label=\"Условие\">Много нецелевых запросов</td><td data-label=\"Действие\">Добавить минус-слова, перейти с широкого на фразу и точное</td></tr><tr><td data-label=\"Условие\">Заявок мало, цена клика низкая</td><td data-label=\"Действие\">Поднять ставки или бюджет у лучших групп</td></tr><tr><td data-label=\"Условие\">15 и более конверсий за 30 дней</td><td data-label=\"Действие\">Перейти на «максимум конверсий»</td></tr><tr><td data-label=\"Условие\">Сезон спада</td><td data-label=\"Действие\">Урезать бюджет у слабых кампаний</td></tr></tbody></table></div>\n<h3 id=\"155-сверка-с-реальностью\">15.5 Сверка с реальностью</h3>\n<p>Раз в неделю сравнивайте:</p>\n<ol><li>конверсии в кабинете,</li><li>события в GA4,</li><li>число реальных звонков и заявок в вашей таблице.</li></ol>\n<p>Если реальных заявок значительно меньше, чем в кабинете, часть «конверсий» это клики по телефону без звонка или тестовые.</p>\n<h3 id=\"что-сделать-на-вашем-сайте\">Что сделать на вашем сайте</h3>\n<ul><li>Заполните таблицу юнит-экономики своими цифрами до запуска. Без предельного CPL вы не поймёте, хорошо ли работает кампания.</li></ul>", "text": " 15.1 Юнит-экономика Реклама окупается, если стоимость привлечения клиента ниже его прибыли. Копировать Цена заявки (CPL) = расход / заявки Цена клиента (CAC) = расход / клиенты = CPL / (доля заявок, ставших клиентами) Прибыль клиента = выручка x маржа Окупаемость: CAC < прибыль клиента Предельный CPL = прибыль клиента x доля заявок, ставших клиентами Пример (условные числа). Прибыль с заказа 800, из 10 заявок продажей заканчиваются 3. Тогда предельный CPL = 800 x 0,3 = 240 и предельная цена клика при конверсии 5% = 240 x 0,05 = 12. Если реальная цена клика выше, кампания убыточна. Подставьте свои числа для услуг по приоритету: Услуга Прибыль с заказа Доля заявок → заказ Предельный CPL Конверсия клика в заявку Предельный CPC Монтаж под ключ (ваше) (ваше) прибыль x доля 3–8% CPL x конверсия Кольца ЖБИ (ваше) (ваше) … … … Манипулятор (ваше) (ваше) … … … 15.2 Калькулятор бюджета 15.3 Влияние недоступности сайта на цену заявки Если доля оплаченных кликов, которые не дошли до сайта, равна p , то реальная цена заявки растёт в 1 / (1 - p) раза. Доля сбоев Рост реальной цены заявки 5% x1,05 10% x1,11 20% x1,25 30% x1,43 43% x1,75 Поэтому решение проблемы с обрывами TLS не техническая мелочь, а прямое снижение стоимости заявки. 15.4 Правила «если… то…» Условие Действие После 100 кликов в группе нет заявок Проверить страницу, трекинг, запросы. Не повышать ставки CTR группы меньше 2–3% при позиции 1–3 Переписать заголовки, сузить ключи Цена клика выше предельной Снизить ставку, убрать дорогие широкие слова Много нецелевых запросов Добавить минус-слова, перейти с широкого на фразу и точное Заявок мало, цена клика низкая Поднять ставки или бюджет у лучших групп 15 и более конверсий за 30 дней Перейти на «максимум конверсий» Сезон спада Урезать бюджет у слабых кампаний 15.5 Сверка с реальностью Раз в неделю сравнивайте: конверсии в кабинете, события в GA4, число реальных звонков и заявок в вашей таблице. Если реальных заявок значительно меньше, чем в кабинете, часть «конверсий» это клики по телефону без звонка или тестовые. Что сделать на вашем сайте Заполните таблицу юнит-экономики своими цифрами до запуска. Без предельного CPL вы не поймёте, хорошо ли работает кампания. ", "toc": [["151-юнит-экономика", "15.1 Юнит-экономика"], ["152-калькулятор-бюджета", "15.2 Калькулятор бюджета"], ["153-влияние-недоступности-сайта-на-цену-заявки", "15.3 Влияние недоступности сайта на цену заявки"], ["154-правила-если-то", "15.4 Правила «если… то…»"], ["155-сверка-с-реальностью", "15.5 Сверка с реальностью"], ["что-сделать-на-вашем-сайте", "Что сделать на вашем сайте"]]}, {"id": "ch16", "num": "16", "title": "Особенности Беларуси", "full": "16. Особенности Беларуси", "part": "Часть V. Беларусь, локальный бизнес, Яндекс.Директ", "html": "<aside class=\"callout warn\"><p><strong>Важно.</strong> Эта глава собрана из ваших данных и открытых источников. Законы, налоги и условия оплаты меняются. Всё, что отмечено «проверить», уточняйте у бухгалтера, юриста или в справке сервиса перед действием.</p></aside>\n<h3 id=\"161-рынок-поиска-яндекс-и-google\">16.1 Рынок поиска: Яндекс и Google</h3>\n<ul><li>В <strong>вашем сайте</strong> по данным GA4 за 28 дней: около 106 пользователей пришли из Яндекса и всего 5 из Google. Но сайт молодой (индексируется с августа 2026), и положение в Google пока низкое.</li><li>По России (не по Беларуси!) Statcounter за июль 2024 показывал около 67% Яндекс и 32% Google (<a href=\"https://trashbox.ru/link/2024-08-01-dolya-yandeksa-upala-a-google-vozrosla\" target=\"_blank\" rel=\"noopener\">источник</a>). Точной цифры по Беларуси за 2025–2026 годы я не нашёл. <strong>Проверить:</strong> Statcounter с фильтром «Беларусь» или Similarweb.</li></ul>\n<p><strong>Ваши данные (GA4, 28 дней, пользователи по источнику сеанса):</strong></p>\n<div class=\"widget\" data-widget=\"sources\"></div>\n<div class=\"tablewrap\"><table><thead><tr><th>Источник</th><th>Пользователи</th></tr></thead><tbody><tr><td data-label=\"Источник\">Яндекс (yandex.by, yandex.ru, ya.ru)</td><td data-label=\"Пользователи\">106</td></tr><tr><td data-label=\"Источник\">Direct (прямые заходы)</td><td data-label=\"Пользователи\">78</td></tr><tr><td data-label=\"Источник\">Google</td><td data-label=\"Пользователи\">5</td></tr><tr><td data-label=\"Источник\">Kufar</td><td data-label=\"Пользователи\">5</td></tr><tr><td data-label=\"Источник\">Служебные (хостинг, стенд, not set)</td><td data-label=\"Пользователи\">4</td></tr></tbody></table></div>\n<ul><li>Вывод: <strong>Яндекс и Google оба нужны</strong>. Google ближе к людям с Android и без Яндекс-экосистемы, Яндекс исторически сильнее в части аудитории региона. Решение принимайте по своим данным (ваши рекламные клики и таблица звонков).</li></ul>\n<h3 id=\"162-мобильный-трафик\">16.2 Мобильный трафик</h3>\n<p>В вашем Google-трафике <strong>78% показов с мобильных</strong>. Для услуги с выездом это ключевой канал: кнопка звонка и скорость мобильной страницы решают результат.</p>\n<h3 id=\"163-язык\">16.3 Язык</h3>\n<p>Основной язык рекламы и сайта русский. Можно включить в настройках кампании белорусский язык, если ожидаете запросы на нём. Для старта достаточно русского.</p>\n<h3 id=\"164-оплата-и-валюта\">16.4 Оплата и валюта</h3>\n<ul><li><strong>Google Ads:</strong> вы сообщили, что оплата и доступность из Беларуси проверены. Фиксируйте валюту аккаунта и способ оплаты.</li><li><strong>Яндекс.Директ:</strong> по найденным материалам банковский перевод доступен разным категориям плательщиков, но условия для белорусских ИП и валют я <strong>не подтвердил</strong>. <strong>Проверить</strong> в справке Директа и у бухгалтера.</li><li>Если валюта аккаунта не белорусский рубль, учтите курсовую разницу в расходах.</li></ul>\n<h3 id=\"165-закон-и-налоги-общий-обзор-не-юридическая-консультация\">16.5 Закон и налоги (общий обзор, не юридическая консультация)</h3>\n<ul><li><strong>Закон о рекламе.</strong> В Беларуси действует закон «О рекламе»; в 2024 году вносились изменения (закон от 6 января 2024 года № 353-З, постановление Совмина от 8 июля 2024 года № 484), в основном по рекламе алкоголя и безалкогольной продукции. К вашим услугам (строительство, ЖБИ, спецтехника) эти нормы напрямую не относятся, но общие требования к рекламе (недопустимость недостоверных утверждений, обязательные сведения) применимы. <strong>Проверить</strong> по текущей редакции на pravo.by. Источники: <a href=\"https://ilex.by/news/mart-otvechaet-na-aktualnye-voprosy-o-reklame/\" target=\"_blank\" rel=\"noopener\">ilex.by</a>, <a href=\"https://pravo.by/novosti/obshchestvenno-politicheskie-i-v-oblasti-prava/2024/december/79827/\" target=\"_blank\" rel=\"noopener\">pravo.by</a>.</li><li><strong>Маркировка интернет-рекламы.</strong> В России действует обязательная маркировка через операторов рекламных данных. <strong>Подтверждения, что такое же правило действует в Беларуси, я не нашёл</strong>, поэтому российские требования применять не нужно. <strong>Проверить</strong> актуальные нормы.</li><li><strong>Сбор за размещение рекламы.</strong> По найденному разбору в Беларуси есть обложение услуг по размещению рекламы, включая интернет (источник: <a href=\"https://ilex.by/test/sbor-za-razmeshhenie-rasprostranenie-reklamy/\" target=\"_blank\" rel=\"noopener\">ilex.by</a>). Как оно применяется к размещению рекламы в зарубежных системах и к ИП, <strong>проверить у бухгалтера</strong>.</li><li><strong>Персональные данные.</strong> Закон «О защите персональных данных» (от 7 мая 2021 года № 99-З). У вас на сайте есть политика и согласие в форме. Если собираете заявки и храните телефоны (а вы так делаете), проверьте полноту: цели, сроки хранения, права. Если подключаете Метрику или передачу данных за границу, обновите политику.</li><li><strong>Недопустимые обещания.</strong> Не заявляйте «лучшие», «№1», «гарантия результата» без подтверждения. Это и требование закона, и политика Google.</li></ul>\n<h3 id=\"166-локальные-возможности-google\">16.6 Локальные возможности Google</h3>\n<ul><li><strong>Google Business Profile</strong> доступен для региональных услуг, но способы подтверждения зависят от страны. Ваш профиль на этапе подтверждения.</li><li>Рекламные форматы, привязанные к местным услугам (например, «Local Services Ads»), доступны не везде. <strong>Проверить</strong> для Беларуси.</li><li>Google ограничивает отдельные сервисы для некоторых стран (например, AdSense и AdMob для Беларуси, это отдельные сервисы, не реклама). Поэтому перед использованием любой новой функции проверяйте её доступность.</li></ul>\n<h3 id=\"167-спрос-и-конкуренция\">16.7 Спрос и конкуренция</h3>\n<ul><li>Спрос на региональные услуги <strong>небольшой по абсолютным числам</strong>. Ваши данные по Яндексу: «канализация под ключ» всего 35 запросов за 14 дней по Беларуси.</li><li>Следствие: реклама не даст сотни кликов в день. Основная цель: <strong>дешёвые, качественные заявки</strong> и постепенное расширение ключей.</li><li>Конкуренция в регионе обычно ниже столичной, цена клика ниже, но и объём меньше. Реальные цифры покажет Планировщик.</li></ul>\n<h3 id=\"168-сезонность\">16.8 Сезонность</h3>\n<p>Монтаж канализации и копка идут с весны до осени. В пик спрос и цены клика выше. Планируйте:</p>\n<ul><li><strong>за 2–4 недели до сезона</strong> запуск и обучение;</li><li><strong>в сезон</strong> масштабирование по данным;</li><li><strong>в спад</strong> сокращение бюджета, акцент на подготовку (калькулятор, отзывы, контент).</li></ul>\n<h3 id=\"что-сделать-на-вашем-сайте\">Что сделать на вашем сайте</h3>\n<ul><li>Проверьте у бухгалтера применение сбора за рекламу и учёт расходов в Google Ads.</li><li>Перечитайте политику конфиденциальности перед подключением Метрики и импортом конверсий.</li></ul>\n<hr>", "text": " Важно. Эта глава собрана из ваших данных и открытых источников. Законы, налоги и условия оплаты меняются. Всё, что отмечено «проверить», уточняйте у бухгалтера, юриста или в справке сервиса перед действием. 16.1 Рынок поиска: Яндекс и Google В вашем сайте по данным GA4 за 28 дней: около 106 пользователей пришли из Яндекса и всего 5 из Google. Но сайт молодой (индексируется с августа 2026), и положение в Google пока низкое. По России (не по Беларуси!) Statcounter за июль 2024 показывал около 67% Яндекс и 32% Google ( источник ). Точной цифры по Беларуси за 2025–2026 годы я не нашёл. Проверить: Statcounter с фильтром «Беларусь» или Similarweb. Ваши данные (GA4, 28 дней, пользователи по источнику сеанса): Источник Пользователи Яндекс (yandex.by, yandex.ru, ya.ru) 106 Direct (прямые заходы) 78 Google 5 Kufar 5 Служебные (хостинг, стенд, not set) 4 Вывод: Яндекс и Google оба нужны . Google ближе к людям с Android и без Яндекс-экосистемы, Яндекс исторически сильнее в части аудитории региона. Решение принимайте по своим данным (ваши ре  заявки и храните телефоны (а вы так делаете), проверьте полноту: цели, сроки хранения, права. Если подключаете Метрику или передачу данных за границу, обновите политику. Недопустимые обещания. Не заявляйте «лучшие», «№1», «гарантия результата» без подтверждения. Это и требование закона, и политика Google. 16.6 Локальные возможности Google Google Business Profile доступен для региональных услуг, но способы подтверждения зависят от страны. Ваш профиль на этапе подтверждения. Рекламные форматы, привязанные к местным услугам (например, «Local Services Ads»), доступны не везде. Проверить для Беларуси. Google ограничивает отдельные сервисы для некоторых стран (например, AdSense и AdMob для Беларуси, это отдельные сервисы, не реклама). Поэтому перед использованием любой новой функции проверяйте её доступность. 16.7 Спрос и конкуренция Спрос на региональные услуги небольшой по абсолютным числам . Ваши данные по Яндексу: «канализация под ключ» всего 35 запросов за 14 дней по Беларуси. Следствие: реклама не даст сотни кликов в день. Основная цель: дешёвые, качественные заявки и постепенное расширение ключей. Конкуренция в регионе обычно ниже столичной, цена клика ниже, но и объём меньше. Реальные цифры покажет Планировщик. 16.8 Сезонность Монтаж канализации и копка идут с весны до осени. В пик спрос и цены клика выше. Планируйте: за 2–4 недели до сезона запуск и обучение; в сезон масштабирование по данным; в спад сокращение бюджета, акцент на подготовку (калькулятор, отзывы, контент). Что сделать на вашем сайте Проверьте у бухгалтера применение сбора за рекламу и учёт расходов в Google Ads. Перечитайте политику конфиденциальности перед подключением Метрики и импортом конверсий. ", "toc": [["161-рынок-поиска-яндекс-и-google", "16.1 Рынок поиска: Яндекс и Google"], ["162-мобильный-трафик", "16.2 Мобильный трафик"], ["163-язык", "16.3 Язык"], ["164-оплата-и-валюта", "16.4 Оплата и валюта"], ["165-закон-и-налоги-общий-обзор-не-юридическая-консультация", "16.5 Закон и налоги (общий обзор, не юридическая консультация)"], ["166-локальные-возможности-google", "16.6 Локальные возможности Google"], ["167-спрос-и-конкуренция", "16.7 Спрос и конкуренция"], ["168-сезонность", "16.8 Сезонность"], ["что-сделать-на-вашем-сайте", "Что сделать на вашем сайте"]]}, {"id": "ch17", "num": "17", "title": "Локальный бизнес: карточки, отзывы, звонки", "full": "17. Локальный бизнес: карточки, отзывы, звонки", "part": "Часть V. Беларусь, локальный бизнес, Яндекс.Директ", "html": "<h3 id=\"171-зачем-это-рекламе\">17.1 Зачем это рекламе</h3>\n<p>Человек ищет «канализация Брест», видит рекламу и карточку на карте. <strong>Реклама работает лучше, когда рядом хорошие отзывы и адрес.</strong> А карточка с отзывами сама приводит звонки бесплатно.</p>\n<h3 id=\"172-google-business-profile\">17.2 Google Business Profile</h3>\n<ul><li><strong>Тип:</strong> организация с выездом к клиентам (область обслуживания без публичного адреса, если нет офиса).</li><li><strong>Название, телефон, часы:</strong> как на сайте (NAP). <strong>Пн–Сб круглосуточно, воскресенье выходной.</strong></li><li><strong>Услуги и категории:</strong> основная категория по главной услуге, дополнительные по остальным.</li><li><strong>Фото:</strong> 10–15 реальных (техника, объекты, бригада).</li><li><strong>Описание, сайт со ссылкой UTM</strong> из <a href=\"#/utm\">UTM-LINKS.md</a>.</li><li><strong>Отзывы:</strong> попросите довольных клиентов, отвечайте на каждый.</li><li><strong>Подтверждение:</strong> способ покажет Google. После подтверждения подключите карточку к Google Ads (ресурс «Адрес»).</li></ul>\n<h3 id=\"173-яндекс-бизнес-и-2гис\">17.3 Яндекс Бизнес и 2ГИС</h3>\n<p>Яндекс Бизнес (карточка в Яндекс Картах) приводит звонки из Яндекса. Сейчас его создание <strong>временно недоступно</strong> (сбой сервисов), повторяйте попытку. 2ГИС: проверить, покрывает ли он Брест. Везде одинаковые название, телефон, часы.</p>\n<h3 id=\"174-отзывы\">17.4 Отзывы</h3>\n<ul><li>Просите отзыв <strong>сразу после работы</strong>, пока клиент доволен: прямая ссылка на карточку и короткая просьба.</li><li>Отвечайте на все отзывы вежливо, по сути.</li><li>Никогда не покупайте и не пишите фальшивые отзывы (нарушение правил).</li></ul>\n<h3 id=\"175-звонки\">17.5 Звонки</h3>\n<ul><li>Кнопка «Позвонить» в рекламе (call asset) и на сайте.</li><li>Звонки не через кнопку не видны в кабинете, поэтому <strong>таблица «откуда узнали»</strong>.</li><li>В Беларуси номер переадресации Google для отслеживания звонков может быть недоступен. <strong>Проверить</strong> в кабинете.</li></ul>\n<h3 id=\"что-сделать-на-вашем-сайте\">Что сделать на вашем сайте</h3>\n<ul><li>После подтверждения Google Business Profile подключите его к аккаунту Google Ads.</li><li>Попросите первых 3–5 клиентов оставить отзыв.</li></ul>\n<hr>", "text": " 17.1 Зачем это рекламе Человек ищет «канализация Брест», видит рекламу и карточку на карте. Реклама работает лучше, когда рядом хорошие отзывы и адрес. А карточка с отзывами сама приводит звонки бесплатно. 17.2 Google Business Profile Тип: организация с выездом к клиентам (область обслуживания без публичного адреса, если нет офиса). Название, телефон, часы: как на сайте (NAP). Пн–Сб круглосуточно, воскресенье выходной. Услуги и категории: основная категория по главной услуге, дополнительные по остальным. Фото: 10–15 реальных (техника, объекты, бригада). Описание, сайт со ссылкой UTM из UTM-LINKS.md . Отзывы: попросите довольных клиентов, отвечайте на каждый. Подтверждение: способ покажет Google. После подтверждения подключите карточку к Google Ads (ресурс «Адрес»). 17.3 Яндекс Бизнес и 2ГИС Яндекс Бизнес (карточка в Яндекс Картах) приводит звонки из Яндекса. Сейчас его создание временно недоступно (сбой сервисов), повторяйте попытку. 2ГИС: проверить, покрывает ли он Брест. Везде одинаковые название, телефон, часы. 17.4 Отзывы Просите отзыв сразу после работы , пока клиент доволен: прямая ссылка на карточку и короткая просьба. Отвечайте на все отзывы вежливо, по сути. Никогда не покупайте и не пишите фальшивые отзывы (нарушение правил). 17.5 Звонки Кнопка «Позвонить» в рекламе (call asset) и на сайте. Звонки не через кнопку не видны в кабинете, поэтому таблица «откуда узнали» . В Беларуси номер переадресации Google для отслеживания звонков может быть недоступен. Проверить в кабинете. Что сделать на вашем сайте После подтверждения Google Business Profile подключите его к аккаунту Google Ads. Попросите первых 3–5 клиентов оставить отзыв. ", "toc": [["171-зачем-это-рекламе", "17.1 Зачем это рекламе"], ["172-google-business-profile", "17.2 Google Business Profile"], ["173-яндекс-бизнес-и-2гис", "17.3 Яндекс Бизнес и 2ГИС"], ["174-отзывы", "17.4 Отзывы"], ["175-звонки", "17.5 Звонки"], ["что-сделать-на-вашем-сайте", "Что сделать на вашем сайте"]]}, {"id": "ch18", "num": "18", "title": "Яндекс.Директ подробно", "full": "18. Яндекс.Директ подробно", "part": "Часть V. Беларусь, локальный бизнес, Яндекс.Директ", "html": "<aside class=\"callout info\"><p><strong>Статус.</strong> Часть сервисов Яндекса сейчас недоступна после сбоя; интерфейсы и названия кампаний в Директе меняются. Сверяйте названия и лимиты с актуальной справкой. Раздел описывает принципы, которые остаются, и порядок действий.</p></aside>\n<h3 id=\"181-что-это\">18.1 Что это</h3>\n<p><strong>Яндекс.Директ</strong> это система контекстной рекламы Яндекса: поиск Яндекса, <strong>Рекламная сеть Яндекса (РСЯ)</strong> на сайтах-партнёрах, Карты и другие площадки. Принцип похож на Google Ads: аукцион, ставки и качество, оплата за клик (в большинстве форматов).</p>\n<p>Для вас Директ важен потому, что <strong>около 53% пользователей сайта приходят из Яндекса</strong>.</p>\n<h3 id=\"182-что-подготовить\">18.2 Что подготовить</h3>\n<ol><li>Аккаунт Яндекса владельца и кабинет Директа.</li><li><strong>Яндекс.Метрика</strong> (счётчик на сайте и цели). Без целей оптимизировать нечего.</li><li><strong>Wordstat</strong> для частот запросов по региону.</li><li>Условия оплаты и документы (проверить, см. 16.4).</li></ol>\n<h3 id=\"183-wordstat-и-семантика\">18.3 Wordstat и семантика</h3>\n<p>В Wordstat выберите регион <strong>Беларусь</strong> (или Брестская область). Операторы:</p>\n<div class=\"tablewrap\"><table><thead><tr><th>Оператор</th><th>Что делает</th><th>Пример</th></tr></thead><tbody><tr><td data-label=\"Оператор\"><code>\"...\"</code></td><td data-label=\"Что делает\">Только запросы с этими словами (без лишних)</td><td data-label=\"Пример\"><code>\"канализация под ключ\"</code></td></tr><tr><td data-label=\"Оператор\"><code>!</code></td><td data-label=\"Что делает\">Фиксирует форму слова</td><td data-label=\"Пример\"><code>!кольца</code></td></tr><tr><td data-label=\"Оператор\"><code>+</code></td><td data-label=\"Что делает\">Фиксирует предлог или стоп-слово</td><td data-label=\"Пример\"><code>канализация +в бресте</code></td></tr><tr><td data-label=\"Оператор\"><code>[ ]</code></td><td data-label=\"Что делает\">Фиксирует порядок слов</td><td data-label=\"Пример\"><code>[\"кольца жби\"]</code></td></tr><tr><td data-label=\"Оператор\"><code>-</code></td><td data-label=\"Что делает\">Минус-слово</td><td data-label=\"Пример\"><code>кольца -пластиковые</code></td></tr></tbody></table></div>\n<p>Варианты слов группируются скобками и вертикальной чертой, например <code>(септик | канализация) брест</code>. Ключи Директа можно записывать с теми же операторами. Для малого бюджета используйте <strong>кавычки и «!»</strong>, чтобы не расходовать на лишние формы.</p>\n<h3 id=\"184-типы-кампаний-названия-уточнять-в-интерфейсе\">18.4 Типы кампаний (названия уточнять в интерфейсе)</h3>\n<div class=\"diagram\" data-svg=\"direct-map\" role=\"img\" aria-label=\"Диаграмма\"></div>\n<div class=\"tablewrap\"><table><thead><tr><th>Тип</th><th>Что это</th><th>Для вас</th></tr></thead><tbody><tr><td data-label=\"Тип\"><strong>Мастер кампаний</strong></td><td data-label=\"Что это\">Помогает собрать кампанию по сайту и целям</td><td data-label=\"Для вас\">Подходит для знакомства</td></tr><tr><td data-label=\"Тип\"><strong>Единая перфоманс-кампания (ЕПК)</strong></td><td data-label=\"Что это\">Автоматическое управление показами по целям на разных площадках Яндекса</td><td data-label=\"Для вас\">После накопления конверсий</td></tr><tr><td data-label=\"Тип\"><strong>Текстово-графические объявления</strong></td><td data-label=\"Что это\">Ручные группы, ключи и объявления</td><td data-label=\"Для вас\"><strong>Лучший контроль на старте</strong></td></tr><tr><td data-label=\"Тип\"><strong>Динамические</strong></td><td data-label=\"Что это\">Объявления по страницам сайта</td><td data-label=\"Для вас\">Позже</td></tr><tr><td data-label=\"Тип\"><strong>Товарная, мобильные приложения, медийная</strong></td><td data-label=\"Что это\">Магазин, приложения, охват</td><td data-label=\"Для вас\">Не нужно</td></tr></tbody></table></div>\n<p><strong>Рекомендация:</strong> для местной услуги начать с <strong>поисковой кампании</strong> (только поиск, без РСЯ) в формате с ручным контролем. РСЯ добавлять отдельной кампанией позже.</p>\n<h3 id=\"185-поиск-и-рся\">18.5 Поиск и РСЯ</h3>\n<ul><li><strong>Поиск:</strong> человек ввёл запрос. Намерение сильное, конверсия выше.</li><li><strong>РСЯ:</strong> показ на сайтах-партнёрах по интересам. Охват больше, конверсия ниже, много нецелевых кликов.</li><li>Разделяйте их в <strong>разные кампании</strong>, иначе бюджет утечёт в РСЯ.</li></ul>\n<h3 id=\"186-стратегии-ставок\">18.6 Стратегии ставок</h3>\n<p>В Директе стратегии работают с <strong>недельным бюджетом</strong>. Основные идеи:</p>\n<ul><li><strong>Ручное управление ставками:</strong> вы задаёте ставку по фразам.</li><li><strong>Оптимизация кликов:</strong> максимум кликов в рамках бюджета и ограничений по цене клика.</li><li><strong>Оптимизация конверсий:</strong> максимум конверсий или заданная цена конверсии (нужны цели Метрики и достаточно данных).</li></ul>\n<p>Как и в Google, автоматике нужны <strong>десятки конверсий</strong>. На старте используйте ручное управление или оптимизацию кликов.</p>\n<h3 id=\"187-автотаргетинг\">18.7 Автотаргетинг</h3>\n<p>Автотаргетинг подбирает показ по смыслу страницы и текста. Категории: <strong>целевые, узкие, широкие, альтернативные и сопутствующие</strong>. Для малого бюджета оставляйте <strong>целевые и узкие</strong>, отключайте широкие и сопутствующие. Следите за отчётом по поисковым фразам и добавляйте минус-слова.</p>\n<h3 id=\"188-минус-слова\">18.8 Минус-слова</h3>\n<p>Те же принципы, что в Google (глава 6): список общих минус-слов («своими руками», «бесплатно», «вакансии», города вне региона) и специальные по кампаниям. В Директе минус-слова задаются на уровне кампании и группы. Каждые 2–3 дня первые 2 недели смотрите отчёт поисковых запросов.</p>\n<h3 id=\"189-объявление\">18.9 Объявление</h3>\n<p>Текстовое объявление состоит из <strong>заголовков, текста и дополнений</strong>. Лимиты (проверить актуальные): заголовок 1 до 56 знаков, заголовок 2 до 30, текст до 81.</p>\n<p>Дополнения, которые повышают CTR:</p>\n<ul><li><strong>Быстрые ссылки:</strong> до 8 (рассчитать, кольца, портфолио).</li><li><strong>Уточнения:</strong> короткие преимущества («Замер бесплатно», «Свой манипулятор»).</li><li><strong>Виртуальная визитка:</strong> адрес, часы работы, телефон.</li><li><strong>Цена, изображения, отображаемая ссылка.</strong></li></ul>\n<p><strong>Пример:</strong></p>\n<div class=\"tablewrap\"><table><thead><tr><th>Элемент</th><th>Текст</th></tr></thead><tbody><tr><td data-label=\"Элемент\">Заголовок 1</td><td data-label=\"Текст\">Канализация под ключ в Бресте</td></tr><tr><td data-label=\"Элемент\">Заголовок 2</td><td data-label=\"Текст\">Замер бесплатно, за 1–3 дня</td></tr><tr><td data-label=\"Элемент\">Текст</td><td data-label=\"Текст\">Копка, кольца ЖБИ, монтаж и вывоз грунта. Свой манипулятор. Безнал, кредит на стройку</td></tr></tbody></table></div>\n<p>Правила: нельзя недостоверные утверждения, превосходные степени без подтверждения, все факты из объявления есть на странице.</p>\n<h3 id=\"1810-таргетинг-и-корректировки\">18.10 Таргетинг и корректировки</h3>\n<ul><li><strong>Регионы:</strong> Брест, Брестский район (отдельные кампании для Пинска и Барановичей).</li><li><strong>Расписание:</strong> Пн–Сб круглосуточно, воскресенье исключить.</li><li><strong>Корректировки</strong> по устройству, полу и возрасту, ретаргетингу: после накопления данных.</li><li><strong>Ретаргетинг и подбор аудиторий</strong> на основе Метрики: позже.</li></ul>\n<h3 id=\"1811-метрика-и-цели\">18.11 Метрика и цели</h3>\n<p>В Метрике создайте цели: звонок (клик по телефону), заявка (форма), Telegram. Они отправляются JavaScript-событиями (<code>ym(ID, 'reachGoal', 'phone_click')</code>), которые мы подключим в коде после восстановления сервисов (раздел 2А плана). Цели импортируются в Директ как «конверсии для оптимизации».</p>\n<h3 id=\"1812-utm-для-директа\">18.12 UTM для Директа</h3>\n<p>Метки: <code>utm_source=yandex&amp;utm_medium=cpc&amp;utm_campaign={campaign_id}&amp;utm_content={ad_id}&amp;utm_term={keyword}</code> (проверьте поддерживаемые макросы Директа в справке). Тогда данные видны и в GA4, и в Метрике.</p>\n<h3 id=\"1813-модерация\">18.13 Модерация</h3>\n<p>Все объявления проходят модерацию. Частые причины отказа: недостоверные обещания, неподходящая страница, неработающий сайт, тематики с ограничениями. Исправляйте и отправляйте повторно.</p>\n<h3 id=\"1814-сравнение-с-google-ads\">18.14 Сравнение с Google Ads</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>Критерий</th><th>Google Ads</th><th>Яндекс.Директ</th></tr></thead><tbody><tr><td data-label=\"Критерий\">Доля аудитории вашего сайта</td><td data-label=\"Google Ads\">около 3% пользователей (молодой сайт)</td><td data-label=\"Яндекс.Директ\">около 53% пользователей</td></tr><tr><td data-label=\"Критерий\">Контроль</td><td data-label=\"Google Ads\">Высокий</td><td data-label=\"Яндекс.Директ\">Высокий</td></tr><tr><td data-label=\"Критерий\">Автоматика</td><td data-label=\"Google Ads\">Сильная (нужны данные)</td><td data-label=\"Яндекс.Директ\">Сильная (нужны цели)</td></tr><tr><td data-label=\"Критерий\">Wordstat</td><td data-label=\"Google Ads\">Нет, есть Планировщик</td><td data-label=\"Яндекс.Директ\">Да, по регионам</td></tr><tr><td data-label=\"Критерий\">Доступность сейчас</td><td data-label=\"Google Ads\">Работает</td><td data-label=\"Яндекс.Директ\">Часть сервисов недоступна (сбой)</td></tr><tr><td data-label=\"Критерий\">Интеграция с вашим стеком</td><td data-label=\"Google Ads\">GA4, Search Console</td><td data-label=\"Яндекс.Директ\">Метрика, Вебмастер</td></tr><tr><td data-label=\"Критерий\">Оплата</td><td data-label=\"Google Ads\">Проверена вами</td><td data-label=\"Яндекс.Директ\">Проверить</td></tr></tbody></table></div>\n<h3 id=\"1815-как-использовать-оба-канала\">18.15 Как использовать оба канала</h3>\n<ol><li><strong>Начните с Google Ads</strong> (сервис доступен), с узким ядром и поиском.</li><li><strong>Подготовьте Яндекс:</strong> Метрика, цели, Wordstat, карточка в Яндекс Бизнесе, условия оплаты.</li><li><strong>После восстановления сервисов запустите Директ</strong> на тех же услугах: общие ключи, разные площадки.</li><li><strong>Сравнивайте по реальным заявкам</strong>, а не только по кабинету: таблица «откуда узнали», UTM.</li><li><strong>Распределяйте бюджет по цене заявки.</strong></li></ol>\n<h3 id=\"что-сделать-на-вашем-сайте\">Что сделать на вашем сайте</h3>\n<ul><li>Подготовьте Метрику и цели (задача плана Я-3), как только Яндекс заработает.</li><li>Соберите в Wordstat по региону частоты для 20–30 основных ключей.</li></ul>", "text": " Статус. Часть сервисов Яндекса сейчас недоступна после сбоя; интерфейсы и названия кампаний в Директе меняются. Сверяйте названия и лимиты с актуальной справкой. Раздел описывает принципы, которые остаются, и порядок действий. 18.1 Что это Яндекс.Директ это система контекстной рекламы Яндекса: поиск Яндекса, Рекламная сеть Яндекса (РСЯ) на сайтах-партнёрах, Карты и другие площадки. Принцип похож на Google Ads: аукцион, ставки и качество, оплата за клик (в большинстве форматов). Для вас Директ важен потому, что около 53% пользователей сайта приходят из Яндекса . 18.2 Что подготовить Аккаунт Яндекса владельца и кабинет Директа. Яндекс.Метрика (счётчик на сайте и цели). Без целей оптимизировать нечего. Wordstat для частот запросов по региону. Условия оплаты и документы (проверить, см. 16.4). 18.3 Wordstat и семантика В Wordstat выберите регион Беларусь (или Брестская область). Операторы: Оператор Что делает Пример \"...\" Только запросы с этими словами (без лишних) \"канализация под ключ\" ! Фиксирует форму слова !кольца + Фиксирует предлог или стоп-слово канализация +в бресте [ ] Фиксирует порядок слов [\"кольца жби\"] - Минус-слово кольца -пластиковые Варианты слов группируются скобками и вертикальной чертой, например (септик | канализация) брест . Ключи Директа можно записывать с теми же операторами. Для малого бюджета используйте кавычки и «!» , чтобы не расходовать на лишние формы. 18.4 Типы кампаний (названия уточнять в интерфейсе) Тип Что это Для вас Мастер кампаний Помогает собрать кампанию по сайту и целям Подходит для знакомства Единая перфоманс-кампания (ЕПК) Автоматическое управление показами по целям на разных площадках Яндекса После накопления конверсий Текстово-графические объявления Ручные группы, ключи и объявления Лучший контроль на старте Динамические Объявления по страницам сайта Позже Товарная, мобильные приложения, медийная Магазин, приложения, охват Не нужно Рекомендация: для местной услуги начать с поисковой кампании (только поиск, без РСЯ) в формате с ручным контролем. РСЯ добавлять отдельной кампанией позже. 18.5 Поиск и РСЯ Поиск: человек ввёл запрос. Намерение сильное, конверсия выше. РСЯ: показ на сайтах-партнёрах по интересам. Охват больше, конверсия ниже, много нецелевых кликов. Разделяйте их в разные кампании , иначе бюджет утечёт в РСЯ. 18.6 Стратегии ставок В Директе стратегии работают с недельным бюджетом . Основные идеи: Ручное управление ставками: вы задаёте ставку по фразам. Оптимизация кликов: максимум кликов в рамках бюджета и ограничений по цене клика. Оптимизация конверсий: максимум конверсий или заданная цена конверсии (нужны цели Метрики и достаточно данных). Как и в Google, автоматике нужны десятки конверсий . На старте используйте ручное управление или оптимизацию кликов. 18.7 Автотаргетинг Автотаргетинг подбирает показ по смыслу страницы и текста. Категории: целевые, узкие, широкие, альтернативные и сопутствующие . Для малого бюджета оставляйте целевые и узкие , отключайте широкие и сопутствующие. Следите за отчётом по поисковым фразам и добавляйте минус-слова. 18.8 Минус-слова Те же принципы, что в Google (глава 6): список общих минус-слов («своими руками», «бесплатно», «вакансии», города вне региона) и специальные по кампаниям. В Директе минус-слова задаются на уровне кампании и группы. Каждые 2–3 дня первые 2 недели смотрите отчёт поисковых запросов. 18.9 Объявление Текстовое объявление состоит из заголовков, текста и дополнений . Лимиты (проверить актуальные): заголовок 1 до 56 знаков, заголовок 2 до 30, текст до 81. Дополнения, которые повышают CTR: Быстрые ссылки: до 8 (рассчитать, кольца, портфолио). Уточнения: короткие преимущества («Замер бесплатно», «Свой манипулятор»). Виртуальная визитка: адрес, часы работы, телефон. Цена, изображения, отображаемая ссылка. Пример: Элемент Текст Заголовок 1 Канализация под ключ в Бресте Заголовок 2 Замер бесплатно, за 1–3 дня Текст Копка, кольца ЖБИ, монтаж и вывоз грунта. Свой манипулятор. Безнал, кредит на стройку Правила: нельзя недостоверные утверждения, превосходные степени без подтверждения, все факты из объявления есть на странице. 18.10 Таргетинг и корректировки Регионы: Брест, Брестский район (отдельные кампании для Пинска и Барановичей). Расписание: Пн–Сб круглосуточно, воскресенье исключить. Корректировки по устройству, полу и возрасту, ретаргетингу: после накопления данных. Ретаргетинг и подбор аудиторий на основе Метрики: позже. 18.11 Метрика и цели В Метрике создайте цели: звонок (клик по телефону), заявка (форма), Telegram. Они отправляются JavaScript-событиями ( ym(ID, 'reachGoal', 'phone_click') ), которые мы подключим в коде после восстановления сервисов (раздел 2А плана). Цели импортируются в Директ как «конверсии для оптимизации». 18.12 UTM для Директа Метки: utm_source=yandex&utm_medium=cpc&utm_campaign={campaign_id}&utm_content={ad_id}&utm_term={keyword} (проверьте поддерживаемые макросы Директа в справке). Тогда данные видны и в GA4, и в Метрике. 18.13 Модерация Все объявления проходят модерацию. Частые причины отказа: недостоверные обещания, неподходящая страница, неработающий сайт, тематики с ограничениями. Исправляйте и отправляйте повторно. 18.14 Сравнение с Google Ads Критерий Google Ads Яндекс.Директ Доля аудитории вашего сайта около 3% пользователей (молодой сайт) около 53% пользователей Контроль Высокий Высокий Автоматика Сильная (нужны данные) Сильная (нужны цели) Wordstat Нет, есть Планировщик Да, по регионам Доступность сейчас Работает Часть сервисов недоступна (сбой) Интеграция с вашим стеком GA4, Search Console Метрика, Вебмастер Оплата Проверена вами Проверить 18.15 Как использовать оба канала Начните с Google Ads (сервис доступен), с узким ядром и поиском. Подготовьте Яндекс: Метрика, цели, Wordstat, карточка в Яндекс Бизнесе, условия оплаты. После восстановления сервисов запустите Директ на тех же услугах: общие ключи, разные площадки. Сравнивайте по реальным заявкам , а не только по кабинету: таблица «откуда узнали», UTM. Распределяйте бюджет по цене заявки. Что сделать на вашем сайте Подготовьте Метрику и цели (задача плана Я-3), как только Яндекс заработает. Соберите в Wordstat по региону частоты для 20–30 основных ключей. ", "toc": [["181-что-это", "18.1 Что это"], ["182-что-подготовить", "18.2 Что подготовить"], ["183-wordstat-и-семантика", "18.3 Wordstat и семантика"], ["184-типы-кампаний-названия-уточнять-в-интерфейсе", "18.4 Типы кампаний (названия уточнять в интерфейсе)"], ["185-поиск-и-рся", "18.5 Поиск и РСЯ"], ["186-стратегии-ставок", "18.6 Стратегии ставок"], ["187-автотаргетинг", "18.7 Автотаргетинг"], ["188-минус-слова", "18.8 Минус-слова"], ["189-объявление", "18.9 Объявление"], ["1810-таргетинг-и-корректировки", "18.10 Таргетинг и корректировки"], ["1811-метрика-и-цели", "18.11 Метрика и цели"], ["1812-utm-для-директа", "18.12 UTM для Директа"], ["1813-модерация", "18.13 Модерация"], ["1814-сравнение-с-google-ads", "18.14 Сравнение с Google Ads"], ["1815-как-использовать-оба-канала", "18.15 Как использовать оба канала"], ["что-сделать-на-вашем-сайте", "Что сделать на вашем сайте"]]}, {"id": "ch19", "num": "19", "title": "Реальные ситуации: успехи и провалы с разбором", "full": "19. Реальные ситуации: успехи и провалы с разбором", "part": "Часть VI. Практика", "html": "<aside class=\"callout info\"><p><strong>Как читать.</strong> Первые девять сценариев <strong>типовые (собирательные)</strong>: ситуации, которые регулярно встречаются у малых бизнесов, а <strong>числа условные</strong> и подобраны для расчёта. Это не отчёты о конкретных компаниях. Последний разбор (19.3) основан на <strong>реальных данных вашего сайта</strong>, найденных до запуска рекламы.</p></aside>\n<h3 id=\"191-успешные-сценарии\">19.1 Успешные сценарии</h3>\n<h4 id=\"успех-1-узкое-ядро-и-страница-под-каждый-запрос\">Успех 1. Узкое ядро и страница под каждый запрос</h4>\n<p><strong>Ситуация.</strong> Бригада по монтажу, 3 услуги, небольшой бюджет, первый запуск.</p>\n<p><strong>Что сделали.</strong></p>\n<ul><li>3 кампании поиска по услугам, в каждой 2–3 группы с 6–8 ключами в <strong>фразовом и точном</strong> соответствии.</li><li>Для каждой группы своя посадочная страница с H1 под запрос.</li><li>Список минус-слов подготовили заранее, первые 2 недели проверяли «поисковые запросы» каждый день.</li><li>Конверсии (заявки, звонки) настроены до запуска, ставки ручные.</li><li>14 дней ничего не меняли, кроме минус-слов.</li></ul>\n<p><strong>Результат (условные числа).</strong> CTR 8%, конверсия клика 6%, цена заявки около 22 при предельной 40. Через 3 недели собрали 18 конверсий и перешли на «максимум конверсий».</p>\n<p><strong>Почему сработало.</strong></p>\n<div class=\"tablewrap\"><table><thead><tr><th>Причина</th><th>Механизм</th></tr></thead><tbody><tr><td data-label=\"Причина\">Узкое соответствие</td><td data-label=\"Механизм\">Мало мусорных запросов, высокий CTR</td></tr><tr><td data-label=\"Причина\">Страница под запрос</td><td data-label=\"Механизм\">Релевантность повышает качество и конверсию</td></tr><tr><td data-label=\"Причина\">Минус-слова с первого дня</td><td data-label=\"Механизм\">Экономия бюджета</td></tr><tr><td data-label=\"Причина\">Измерение до запуска</td><td data-label=\"Механизм\">Можно принимать решения по данным</td></tr><tr><td data-label=\"Причина\">Терпение</td><td data-label=\"Механизм\">Не сбивали обучение лишними правками</td></tr></tbody></table></div>\n<p><strong>Как повторить.</strong> Структура и списки в вашем <a href=\"#/plan\">плане</a>.</p>\n<h4 id=\"успех-2-оптимизация-по-реальным-заявкам-а-не-по-кликам\">Успех 2. Оптимизация по реальным заявкам, а не по кликам</h4>\n<p><strong>Ситуация.</strong> Услуга с длинным циклом: заявка, замер, смета, договор.</p>\n<p><strong>Что сделали.</strong> Сохраняли <code>gclid</code> вместе с заявкой в CRM. Когда сделка закрывалась, загружали офлайн-конверсию в Google Ads. Автоматика училась на <strong>закрытых сделках</strong>, а не на «клик по телефону».</p>\n<p><strong>Результат (условные числа).</strong> Доля «пустых» заявок упала, цена закрытой сделки снизилась примерно на треть за 2 месяца.</p>\n<p><strong>Почему сработало.</strong> Алгоритм оптимизируется под тот сигнал, который ему даёте. Дали сигнал «продажа», получили трафик, похожий на продажи.</p>\n<p><strong>Как повторить.</strong> Глава 11.6: поле <code>gclid</code> в форме, сохранение в <code>tb_lead</code>, офлайн-импорт.</p>\n<h4 id=\"успех-3-запуск-до-сезона-и-плавное-масштабирование\">Успех 3. Запуск до сезона и плавное масштабирование</h4>\n<p><strong>Ситуация.</strong> Сезонная услуга. Рекламу запустили за 3 недели до пика с небольшим бюджетом.</p>\n<p><strong>Что сделали.</strong> Обучение прошло до пика, лишние запросы вычистили. Перед пиком бюджет поднимали на 20% раз в 3–4 дня, следя за ценой заявки.</p>\n<p><strong>Результат.</strong> К пику аккаунт был «прогрет»: известны лучшие группы и цена заявки, бюджет масштабировали уверенно.</p>\n<p><strong>Почему сработало.</strong> Автоматике и людям нужны недели данных. Запуск в самый пик означает платить за обучение по пиковой цене.</p>\n<p><strong>Как повторить.</strong> Вы запускаете перед сезоном: не откладывайте, но сначала закройте технические условия (хостинг, трекинг).</p>\n<h3 id=\"192-провальные-сценарии\">19.2 Провальные сценарии</h3>\n<h4 id=\"провал-1-широкое-соответствие-и-автоматика-на-малом-бюджете\">Провал 1. Широкое соответствие и автоматика на малом бюджете</h4>\n<p><strong>Ситуация.</strong> Одна кампания, 30 слов в <strong>широком</strong> соответствии, «умная» стратегия ставок, нет минус-слов.</p>\n<p><strong>Что произошло (условные числа).</strong> За 2 недели 70% бюджета ушло на запросы типа «как сделать кессон своими руками», «чертёж септика», «вакансии».</p>\n<div class=\"widget\" data-widget=\"case-spend\"></div>\n<div class=\"tablewrap\"><table><thead><tr><th>Категория запросов</th><th>Доля расхода</th></tr></thead><tbody><tr><td data-label=\"Категория запросов\">Информационные («своими руками», «как»)</td><td data-label=\"Доля расхода\">46%</td></tr><tr><td data-label=\"Категория запросов\">Чужие города</td><td data-label=\"Доля расхода\">14%</td></tr><tr><td data-label=\"Категория запросов\">Покупка техники, вакансии</td><td data-label=\"Доля расхода\">10%</td></tr><tr><td data-label=\"Категория запросов\">Целевые коммерческие</td><td data-label=\"Доля расхода\">30%</td></tr></tbody></table></div>\n<p><strong>Почему провал.</strong> Широкое соответствие даёт много нерелевантного, а автоматика не может отличить «хорошие» клики без данных о конверсиях.</p>\n<p><strong>Как заметить.</strong> Отчёт «Поисковые запросы»: доля расхода на нецелевые.</p>\n<p><strong>Как избежать.</strong> Фраза и точное соответствие, минус-слова, ручные ставки на старте.</p>\n<h4 id=\"провал-2-нет-измерения-конверсий\">Провал 2. Нет измерения конверсий</h4>\n<p><strong>Ситуация.</strong> Реклама запущена, но события не настроены. Решения по CTR и «ощущению».</p>\n<p><strong>Что произошло.</strong> Через 6 недель непонятно, какие ключи приносят заявки. Бюджет расходился равномерно, включая бесполезные группы.</p>\n<p><strong>Почему провал.</strong> Невозможно отличить хорошую рекламу от плохой.</p>\n<p><strong>Как избежать.</strong> Настроить 3 конверсии до запуска, проверить в DebugView, вести таблицу звонков.</p>\n<h4 id=\"провал-3-реклама-ведёт-на-главную-и-показывает-не-тем\">Провал 3. Реклама ведёт на главную и показывает не тем</h4>\n<p><strong>Ситуация.</strong> Все объявления ведут на главную. Гео «присутствие или интерес».</p>\n<p><strong>Что произошло.</strong> Звонки и заявки из других городов и стран, низкая конверсия, высокая цена заявки.</p>\n<p><strong>Почему провал.</strong> Нет совпадения между запросом и страницей, нет фильтра по месту.</p>\n<p><strong>Как избежать.</strong> Страница под группу, режим «присутствие».</p>\n<h4 id=\"провал-4-сайт-недоступен-или-заблокирован-для-робота\">Провал 4. Сайт недоступен или заблокирован для робота</h4>\n<p><strong>Ситуация.</strong> Хостинг показывает JS-заставку незнакомым роботам или периодически обрывает TLS-соединения.</p>\n<p><strong>Что произошло.</strong> Часть объявлений получила статус «Целевая страница недоступна». Клики оплачены, но часть людей не дождалась страницы.</p>\n<p><strong>Почему провал.</strong> Деньги тратятся на клик, а страница не открывается. Автоматика Google получает искажённые данные.</p>\n<p><strong>Как заметить.</strong> Статусы объявлений, расхождение «клики и визиты», скрипт проверки страниц (глава 14.3).</p>\n<p><strong>Как избежать.</strong> Хостинг: допуск AdsBot, стабильность TLS. <strong>Это ваш реальный риск</strong>, разбор в 19.3.</p>\n<h4 id=\"провал-5-постоянные-правки-и-сброс-обучения\">Провал 5. Постоянные правки и сброс обучения</h4>\n<p><strong>Ситуация.</strong> Владелец каждый день меняет ставки, бюджет и цели.</p>\n<p><strong>Что произошло.</strong> Автоматика всё время «переобучается», результаты скачут, ничего не понятно.</p>\n<p><strong>Как избежать.</strong> Журнал изменений, один параметр за раз, ожидание 1–2 недель.</p>\n<h4 id=\"провал-6-performance-max-без-данных\">Провал 6. Performance Max без данных</h4>\n<p><strong>Ситуация.</strong> Для услуги с 10 конверсиями в месяц включили Performance Max.</p>\n<p><strong>Что произошло.</strong> Показы ушли на медийные площадки и видео, заявки низкого качества, отчётность малополезна.</p>\n<p><strong>Как избежать.</strong> Поиск на старте, автоматические форматы после накопления 50 и более конверсий и ясной оценки качества.</p>\n<h3 id=\"193-реальный-разбор-что-нашли-на-вашем-сайте-до-запуска\">19.3 Реальный разбор: что нашли на вашем сайте до запуска</h3>\n<p>Эти находки получены на данных вашего сайта в октябре 2026 года. Они показывают, как легко потратить бюджет на проблемы, которые рекламой не лечатся.</p>\n<div class=\"tablewrap\"><table><thead><tr><th>#</th><th>Находка</th><th>Доказательство</th><th>Что бы потеряла реклама</th><th>Статус</th></tr></thead><tbody><tr><td data-label=\"#\">1</td><td data-label=\"Находка\">Обрывы TLS-рукопожатия</td><td data-label=\"Доказательство\">20–43% новых соединений в тестах</td><td data-label=\"Что бы потеряла реклама\">Цена заявки выше в 1,25–1,75 раза (глава 15.3)</td><td data-label=\"Статус\">Обращение в hoster.by отправлено</td></tr><tr><td data-label=\"#\">2</td><td data-label=\"Находка\">Защита хостинга могла показывать заставку роботам</td><td data-label=\"Доказательство\">Яндекс проиндексировал главную как «One moment, please...»</td><td data-label=\"Что бы потеряла реклама\">Отклонение объявлений AdsBot</td><td data-label=\"Статус\">Исключения для роботов добавлены, нужен допуск AdsBot</td></tr><tr><td data-label=\"#\">3</td><td data-label=\"Находка\">Кнопки Telegram вели на <code>https://t.me/</code></td><td data-label=\"Доказательство\">HTML 7 страниц</td><td data-label=\"Что бы потеряла реклама\">Нерабочий клик считался конверсией</td><td data-label=\"Статус\">Исправлено локально, ждёт деплоя</td></tr><tr><td data-label=\"#\">4</td><td data-label=\"Находка\">Все 7 событий GA4 были ключевыми</td><td data-label=\"Доказательство\">Скриншот GA4</td><td data-label=\"Что бы потеряла реклама\">Завышение «конверсий», обучение автоматики на мусоре</td><td data-label=\"Статус\">Исправлено владельцем</td></tr><tr><td data-label=\"#\">5</td><td data-label=\"Находка\">Нет <code>gclid</code> в заявке</td><td data-label=\"Доказательство\">Код формы</td><td data-label=\"Что бы потеряла реклама\">Нельзя импортировать продажи</td><td data-label=\"Статус\">В планах</td></tr><tr><td data-label=\"#\">6</td><td data-label=\"Находка\">Нет отзывов</td><td data-label=\"Доказательство\">Страница <code>/otzyvy/</code></td><td data-label=\"Что бы потеряла реклама\">Низкое доверие</td><td data-label=\"Статус\">Просить первых клиентов</td></tr><tr><td data-label=\"#\">7</td><td data-label=\"Находка\">17 страниц товаров в sitemap отдавали 404</td><td data-label=\"Доказательство\">Проверка 93 URL</td><td data-label=\"Что бы потеряла реклама\">SEO-шум (не реклама)</td><td data-label=\"Статус\">Исправлено локально</td></tr></tbody></table></div>\n<p><strong>Главный вывод.</strong> Три из семи находок (1, 2, 3) <strong>напрямую превратились бы в потерю бюджета</strong>. Поэтому в <a href=\"#/plan\">плане запуска</a> условия стоят перед запуском рекламы.</p>\n<h3 id=\"194-паттерны-успеха-и-провала\">19.4 Паттерны успеха и провала</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>Успех</th><th>Провал</th></tr></thead><tbody><tr><td data-label=\"Успех\">Измерение до запуска</td><td data-label=\"Провал\">Решения «по ощущениям»</td></tr><tr><td data-label=\"Успех\">Узкая семантика</td><td data-label=\"Провал\">Широкое соответствие без данных</td></tr><tr><td data-label=\"Успех\">Страница под запрос</td><td data-label=\"Провал\">Всё ведёт на главную</td></tr><tr><td data-label=\"Успех\">Терпение и журнал изменений</td><td data-label=\"Провал\">Ежедневные правки</td></tr><tr><td data-label=\"Успех\">Реальные заявки как истина</td><td data-label=\"Провал\">Только цифры кабинета</td></tr><tr><td data-label=\"Успех\">Технически здоровый сайт</td><td data-label=\"Провал\">Сайт недоступен или медленный</td></tr></tbody></table></div>\n<hr>", "text": " Как читать. Первые девять сценариев типовые (собирательные) : ситуации, которые регулярно встречаются у малых бизнесов, а числа условные и подобраны для расчёта. Это не отчёты о конкретных компаниях. Последний разбор (19.3) основан на реальных данных вашего сайта , найденных до запуска рекламы. 19.1 Успешные сценарии Успех 1. Узкое ядро и страница под каждый запрос Ситуация. Бригада по монтажу, 3 услуги, небольшой бюджет, первый запуск. Что сделали. 3 кампании поиска по услугам, в каждой 2–3 группы с 6–8 ключами в фразовом и точном соответствии. Для каждой группы своя посадочная страница с H1 под запрос. Список минус-слов подготовили заранее, первые 2 недели проверяли «поисковые запросы» каждый день. Конверсии (заявки, звонки) настроены до запуска, ставки ручные. 14 дней ничего не меняли, кроме минус-слов. Результат (условные числа). CTR 8%, конверсия клика 6%, цена заявки около 22 при предельной 40. Через 3 недели собрали 18 конверсий и перешли на «максимум конверсий». Почему сработало. Причина Механизм Узкое соответствие Мало мусорных запросов, высокий CTR Страница под запрос Релевантность повышает качество и конверсию Минус-слова с первого дня Экономия бюджета Измерение до запуска Можно принимать решения по данным Терпение Не сбивали обучение лишними правками Как повторить. Структура и списки в вашем плане . Успех 2. Оптимизация по реальным заявкам, а не по кликам Ситуация. Услуга с длинным циклом: заявка, замер, смета, договор. Что сделали. Сохраняли gclid вместе с заявкой в CRM. Когда сделка закрывалась, загружали офлайн-конверсию в Google Ads. Автоматика училась на закрытых сделках , а не на «клик по телефону». Результат (условные числа). Доля «пустых» заявок упала, цена закрытой сделки снизилась примерно на треть за 2 месяца. Почему сработало. Алгоритм оптимизируется под тот сигнал, который ему даёте. Дали сигнал «продажа», получили трафик, похожий на продажи. Как повторить. Глава 11.6: поле gclid в форме, сохранение в tb_lead , офлайн-импорт. Успех 3. Запуск до сезона и плавное масштабирование Ситуация. Сезонная услуга. Рекламу запустили за 3 недели до пика с небольшим бюджетом. Что сделали. Обучение прошло до пика, лишние запросы вычистили. Перед пиком бюджет поднимали на 20% раз в 3–4 дня, следя за ценой заявки. Результат. К пику аккаунт был «прогрет»: известны лучшие группы и цена заявки, бюджет масштабировали уверенно. Почему сработало. Автоматике и людям нужны недели данных. Запуск в самый пик означает платить за обучение по пиковой цене. Как повторить. Вы запускаете перед сезоном: не откладывайте, но сначала закройте технические условия (хостинг, трекинг). 19.2 Провальные сценарии Провал 1. Широкое соответствие и автоматика на малом бюджете Ситуация. Одна кампания, 30 слов в широком соответствии, «умная» стратегия ставок, нет минус-слов. Что произошло (условные числа). За 2 недели 70% бюджета ушло на запросы типа «как сделать кессон своими руками», «чертёж септика», «вакансии». Категория запросов Доля расхода Информационные («своими руками», «как») 46% Чужие города 14% Покупка техники, вакансии 10% Целевые коммерческие 30% Почему провал. Широкое соответствие даёт много нерелевантного, а автоматика не может отличить «хорошие» клики без данных о конверсиях. Как заметить. Отчёт «Поисковые запросы»: доля расхода на нецелевые. Как избежать. Фраза и точное соответствие, минус-слова, ручные ставки на старте. Провал 2. Нет измерения конверсий Ситуация. Реклама запущена, но события не настроены. Решения по CTR и «ощущению». Что произошло. Через 6 недель непонятно, какие ключи приносят заявки. Бюджет расходился равномерно, включая бесполезные группы. Почему провал. Невозможно отличить хорошую рекламу от плохой. Как избежать. Настроить 3 конверсии до запуска, проверить в DebugView, вести таблицу звонков. Провал 3. Реклама ведёт на главную и показывает не тем Ситуация. Все объявления ведут на главную. Гео «присутствие или интерес». Что произошло. Звонки и заявки из других городов и стран, низкая конверсия, высокая цена заявки. Почему провал. Нет совпадения между запросом и страницей, нет фильтра по месту. Как избежать. Страница под группу, режим «присутствие». Провал 4. Сайт недоступен или заблокирован для робота Ситуация. Хостинг показывает JS-заставку незнакомым роботам или периодически обрывает TLS-соединения. Что произошло. Часть объявлений получила статус «Целевая страница недоступна». Клики оплачены, но часть людей не дождалась страницы. Почему провал. Деньги тратятся на клик, а страница не открывается. Автоматика Google получает искажённые данные. Как заметить. Статусы объявлений, расхождение «клики и визиты», скрипт проверки страниц (глава 14.3). Как избежать. Хостинг: допуск AdsBot, стабильность TLS. Это ваш реальный риск , разбор в 19.3. Провал 5. Постоянные правки и сброс обучения Ситуация. Владелец каждый день меняет ставки, бюджет и цели. Что произошло. Автоматика всё время «переобучается», результаты скачут, ничего не понятно. Как избежать. Журнал изменений, один параметр за раз, ожидание 1–2 недель. Провал 6. Performance Max без данных Ситуация. Для услуги с 10 конверсиями в месяц включили Performance Max. Что произошло. Показы ушли на медийные площадки и видео, заявки низкого качества, отчётность малополезна. Как избежать. Поиск на старте, автоматические форматы после накопления 50 и более конверсий и ясной оценки качества. 19.3 Реальный разбор: что нашли на вашем сайте до запуска Эти находки получены на данных вашего сайта в октябре 2026 года. Они показывают, как легко потратить бюджет на проблемы, которые рекламой не лечатся. # Находка Доказательство Что бы потеряла реклама Статус 1 Обрывы TLS-рукопожатия 20–43% новых соединений в тестах Цена заявки выше в 1,25–1,75 раза (глава 15.3) Обращение в hoster.by отправлено 2 Защита хостинга могла показывать заставку роботам Яндекс проиндексировал главную как «One moment, please...» Отклонение объявлений AdsBot Исключения для роботов добавлены, нужен допуск AdsBot 3 Кнопки Telegram вели на https://t.me/ HTML 7 страниц Нерабочий клик считался конверсией Исправлено локально, ждёт деплоя 4 Все 7 событий GA4 были ключевыми Скриншот GA4 Завышение «конверсий», обучение автоматики на мусоре Исправлено владельцем 5 Нет gclid в заявке Код формы Нельзя импортировать продажи В планах 6 Нет отзывов Страница /otzyvy/ Низкое доверие Просить первых клиентов 7 17 страниц товаров в sitemap отдавали 404 Проверка 93 URL SEO-шум (не реклама) Исправлено локально Главный вывод. Три из семи находок (1, 2, 3) напрямую превратились бы в потерю бюджета . Поэтому в плане запуска условия стоят перед запуском рекламы. 19.4 Паттерны успеха и провала Успех Провал Измерение до запуска Решения «по ощущениям» Узкая семантика Широкое соответствие без данных Страница под запрос Всё ведёт на главную Терпение и журнал изменений Ежедневные правки Реальные заявки как истина Только цифры кабинета Технически здоровый сайт Сайт недоступен или медленный ", "toc": [["191-успешные-сценарии", "19.1 Успешные сценарии"], ["192-провальные-сценарии", "19.2 Провальные сценарии"], ["193-реальный-разбор-что-нашли-на-вашем-сайте-до-запуска", "19.3 Реальный разбор: что нашли на вашем сайте до запуска"], ["194-паттерны-успеха-и-провала", "19.4 Паттерны успеха и провала"]]}, {"id": "ch20", "num": "20", "title": "Типичные ошибки новичков", "full": "20. Типичные ошибки новичков", "part": "Часть VI. Практика", "html": "<div class=\"tablewrap\"><table><thead><tr><th>#</th><th>Ошибка</th><th>Симптом</th><th>Как исправить</th></tr></thead><tbody><tr><td data-label=\"#\">1</td><td data-label=\"Ошибка\">Широкое соответствие на старте</td><td data-label=\"Симптом\">Много нецелевых запросов</td><td data-label=\"Как исправить\">Фраза и точное, минус-слова</td></tr><tr><td data-label=\"#\">2</td><td data-label=\"Ошибка\">Нет минус-слов</td><td data-label=\"Симптом\">«Своими руками», «бесплатно» в запросах</td><td data-label=\"Как исправить\">Общий список и ежедневный отчёт</td></tr><tr><td data-label=\"#\">3</td><td data-label=\"Ошибка\">Гео «присутствие или интерес»</td><td data-label=\"Симптом\">Показы людям из других регионов</td><td data-label=\"Как исправить\">Режим «присутствие»</td></tr><tr><td data-label=\"#\">4</td><td data-label=\"Ошибка\">Одна страница для всего</td><td data-label=\"Симптом\">Низкая релевантность, высокая цена</td><td data-label=\"Как исправить\">Страница на группу</td></tr><tr><td data-label=\"#\">5</td><td data-label=\"Ошибка\">Нет измерения</td><td data-label=\"Симптом\">Нечем оценивать</td><td data-label=\"Как исправить\">3 конверсии до запуска</td></tr><tr><td data-label=\"#\">6</td><td data-label=\"Ошибка\">Слишком много конверсий (все события)</td><td data-label=\"Симптом\">«Конверсии» растут, заявок нет</td><td data-label=\"Как исправить\">Только заявка, звонок, Telegram</td></tr><tr><td data-label=\"#\">7</td><td data-label=\"Ошибка\">Автоматика без данных</td><td data-label=\"Симптом\">Нестабильность и расход</td><td data-label=\"Как исправить\">Ручные ставки до 15–30 конверсий</td></tr><tr><td data-label=\"#\">8</td><td data-label=\"Ошибка\">Частые правки</td><td data-label=\"Симптом\">Сброс обучения</td><td data-label=\"Как исправить\">Журнал и правило «одна правка за раз»</td></tr><tr><td data-label=\"#\">9</td><td data-label=\"Ошибка\">Слепое доверие рекомендациям Google</td><td data-label=\"Симптом\">Рост расходов без пользы</td><td data-label=\"Как исправить\">Оценивайте каждую рекомендацию</td></tr><tr><td data-label=\"#\">10</td><td data-label=\"Ошибка\">Игнорирование отчёта «поисковые запросы»</td><td data-label=\"Симптом\">Утечка бюджета</td><td data-label=\"Как исправить\">Ежедневно первые 2 недели</td></tr><tr><td data-label=\"#\">11</td><td data-label=\"Ошибка\">Слабые объявления</td><td data-label=\"Симптом\">Низкий CTR</td><td data-label=\"Как исправить\">12–15 заголовков, ключи и факты</td></tr><tr><td data-label=\"#\">12</td><td data-label=\"Ошибка\">Телефон и ЗАГЛАВНЫЕ в тексте</td><td data-label=\"Симптом\">Отклонение</td><td data-label=\"Как исправить\">Правила политики (глава 22)</td></tr><tr><td data-label=\"#\">13</td><td data-label=\"Ошибка\">Не проверен сайт</td><td data-label=\"Симптом\">Недоступность, обрывы</td><td data-label=\"Как исправить\">Скрипт проверки страниц, хостинг</td></tr><tr><td data-label=\"#\">14</td><td data-label=\"Ошибка\">Нет учёта звонков</td><td data-label=\"Симптом\">Невозможно сверить</td><td data-label=\"Как исправить\">Таблица «откуда узнали»</td></tr><tr><td data-label=\"#\">15</td><td data-label=\"Ошибка\">Ожидание быстрых результатов</td><td data-label=\"Симптом\">Паника на 3-й день</td><td data-label=\"Как исправить\">Решения по 2–4 неделям данных</td></tr></tbody></table></div>\n<hr>", "text": " # Ошибка Симптом Как исправить 1 Широкое соответствие на старте Много нецелевых запросов Фраза и точное, минус-слова 2 Нет минус-слов «Своими руками», «бесплатно» в запросах Общий список и ежедневный отчёт 3 Гео «присутствие или интерес» Показы людям из других регионов Режим «присутствие» 4 Одна страница для всего Низкая релевантность, высокая цена Страница на группу 5 Нет измерения Нечем оценивать 3 конверсии до запуска 6 Слишком много конверсий (все события) «Конверсии» растут, заявок нет Только заявка, звонок, Telegram 7 Автоматика без данных Нестабильность и расход Ручные ставки до 15–30 конверсий 8 Частые правки Сброс обучения Журнал и правило «одна правка за раз» 9 Слепое доверие рекомендациям Google Рост расходов без пользы Оценивайте каждую рекомендацию 10 Игнорирование отчёта «поисковые запросы» Утечка бюджета Ежедневно первые 2 недели 11 Слабые объявления Низкий CTR 12–15 заголовков, ключи и факты 12 Телефон и ЗАГЛАВНЫЕ в тексте Отклонение Правила политики (глава 22) 13 Не проверен сайт Недоступность, обрывы Скрипт проверки страниц, хостинг 14 Нет учёта звонков Невозможно сверить Таблица «откуда узнали» 15 Ожидание быстрых результатов Паника на 3-й день Решения по 2–4 неделям данных ", "toc": []}, {"id": "ch21", "num": "21", "title": "Расширенные стратегии после первых результатов", "full": "21. Расширенные стратегии после первых результатов", "part": "Часть VI. Практика", "html": "<p>Применяйте, когда у вас есть <strong>стабильные конверсии (15–30 и более в месяц)</strong> и понятная цена заявки.</p>\n<div class=\"tablewrap\"><table><thead><tr><th>Стратегия</th><th>Что даёт</th><th>Условия</th></tr></thead><tbody><tr><td data-label=\"Стратегия\"><strong>Ремаркетинг</strong></td><td data-label=\"Что даёт\">Возврат посетителей, не оставивших заявку</td><td data-label=\"Условия\">Список из 100+ посетителей, аккуратные тексты</td></tr><tr><td data-label=\"Стратегия\"><strong>Брендовые кампании</strong></td><td data-label=\"Что даёт\">Защита названия компании</td><td data-label=\"Условия\">Есть узнаваемость</td></tr><tr><td data-label=\"Стратегия\"><strong>Расширение гео</strong> (Пинск, Барановичи, Кобрин)</td><td data-label=\"Что даёт\">Новые клиенты</td><td data-label=\"Условия\">Кампании D и E из плана</td></tr><tr><td data-label=\"Стратегия\"><strong>Автоматические ставки</strong></td><td data-label=\"Что даёт\">Масштаб</td><td data-label=\"Условия\">15–30 конверсий</td></tr><tr><td data-label=\"Стратегия\"><strong>Офлайн-конверсии</strong></td><td data-label=\"Что даёт\">Обучение на продажах</td><td data-label=\"Условия\"><code>gclid</code> в заявках</td></tr><tr><td data-label=\"Стратегия\"><strong>Performance Max</strong></td><td data-label=\"Что даёт\">Охват на всех площадках Google</td><td data-label=\"Условия\">Много конверсий и качественные материалы</td></tr><tr><td data-label=\"Стратегия\"><strong>Расширения на основе ИИ</strong> (например, расширение соответствия в поиске)</td><td data-label=\"Что даёт\">Автоматический охват запросов</td><td data-label=\"Условия\">Только на тестовой кампании под контролем, проверить доступность</td></tr><tr><td data-label=\"Стратегия\"><strong>Эксперименты</strong></td><td data-label=\"Что даёт\">Безопасные A/B-тесты</td><td data-label=\"Условия\">Глава 10</td></tr><tr><td data-label=\"Стратегия\"><strong>Автоматизация</strong> (скрипты, BigQuery, Looker Studio)</td><td data-label=\"Что даёт\">Время и контроль</td><td data-label=\"Условия\">Глава 14</td></tr><tr><td data-label=\"Стратегия\"><strong>Яндекс.Директ</strong></td><td data-label=\"Что даёт\">Второй основной канал</td><td data-label=\"Условия\">Глава 18</td></tr></tbody></table></div>\n<p><strong>Порядок расширения:</strong> сначала исправляйте самую слабую часть воронки (запросы, страница, конверсия), и только потом масштабируйте бюджет.</p>\n<hr>", "text": " Применяйте, когда у вас есть стабильные конверсии (15–30 и более в месяц) и понятная цена заявки. Стратегия Что даёт Условия Ремаркетинг Возврат посетителей, не оставивших заявку Список из 100+ посетителей, аккуратные тексты Брендовые кампании Защита названия компании Есть узнаваемость Расширение гео (Пинск, Барановичи, Кобрин) Новые клиенты Кампании D и E из плана Автоматические ставки Масштаб 15–30 конверсий Офлайн-конверсии Обучение на продажах gclid в заявках Performance Max Охват на всех площадках Google Много конверсий и качественные материалы Расширения на основе ИИ (например, расширение соответствия в поиске) Автоматический охват запросов Только на тестовой кампании под контролем, проверить доступность Эксперименты Безопасные A/B-тесты Глава 10 Автоматизация (скрипты, BigQuery, Looker Studio) Время и контроль Глава 14 Яндекс.Директ Второй основной канал Глава 18 Порядок расширения: сначала исправляйте самую слабую часть воронки (запросы, страница, конверсия), и только потом масштабируйте бюджет. ", "toc": []}, {"id": "ch22", "num": "22", "title": "Политика Google и безопасность аккаунта", "full": "22. Политика Google и безопасность аккаунта", "part": "Часть VI. Практика", "html": "<h3 id=\"221-основные-требования\">22.1 Основные требования</h3>\n<ul><li><strong>Достоверность.</strong> Нельзя вводить в заблуждение: ложные цены, скидки, «гарантии» без условий.</li><li><strong>Оформление.</strong> Без избыточной пунктуации, без ЗАГЛАВНЫХ слов, без телефона и ссылок в тексте.</li><li><strong>Целевая страница.</strong> Должна <strong>открываться</strong>, соответствовать объявлению, не содержать навязчивых окон, иметь контактную информацию.</li><li><strong>Тематики с ограничениями.</strong> Алкоголь, азартные игры, лекарства и др. Ваша тематика (строительство и ЖБИ) обычных ограничений не имеет.</li><li><strong>Подтверждение рекламодателя.</strong> Google может потребовать документы о бизнесе. Подготовьте реквизиты ИП.</li></ul>\n<h3 id=\"222-что-чаще-всего-приводит-к-блокировке\">22.2 Что чаще всего приводит к блокировке</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>Причина</th><th>Как избежать</th></tr></thead><tbody><tr><td data-label=\"Причина\">Недостоверные обещания</td><td data-label=\"Как избежать\">Только проверяемое</td></tr><tr><td data-label=\"Причина\">Обход систем (подмена страниц, клоакинг)</td><td data-label=\"Как избежать\">Показывайте роботу и человеку одно и то же</td></tr><tr><td data-label=\"Причина\">Недоступный сайт</td><td data-label=\"Как избежать\">Допуск AdsBot, стабильный TLS</td></tr><tr><td data-label=\"Причина\">Проблемы с платежом</td><td data-label=\"Как избежать\">Проверенная карта, уведомления</td></tr><tr><td data-label=\"Причина\">Подозрительная активность</td><td data-label=\"Как избежать\">Не делится аккаунтами, не покупать «бустеры»</td></tr></tbody></table></div>\n<h3 id=\"223-недействительные-клики\">22.3 Недействительные клики</h3>\n<p>Google фильтрует часть недействительных кликов автоматически. Но конкуренты и боты возможны. Мониторьте:</p>\n<ul><li>резкие всплески кликов без конверсий,</li><li>клики из необычных мест или в странное время,</li><li>несовпадение «клики и визиты».</li></ul>\n<p>Что можно сделать: исключения по IP (ограниченное число), корректировки расписания, жалобы, а также внимательность к минус-словам.</p>\n<h3 id=\"224-безопасность-аккаунта\">22.4 Безопасность аккаунта</h3>\n<ul><li>Двухэтапная аутентификация на почте и в Google Ads.</li><li>Доступ подрядчикам только с минимальными правами, лучше через менеджерский аккаунт.</li><li>Защитите платёжный профиль, настройте уведомления о платежах и бюджете.</li><li>Никогда не отправляйте пароли и токены в чатах.</li></ul>\n<h3 id=\"что-сделать-на-вашем-сайте\">Что сделать на вашем сайте</h3>\n<ul><li>Проверьте, что все факты в объявлениях подтверждены на страницах.</li><li>Включите двухэтапную аутентификацию.</li></ul>\n<hr>", "text": " 22.1 Основные требования Достоверность. Нельзя вводить в заблуждение: ложные цены, скидки, «гарантии» без условий. Оформление. Без избыточной пунктуации, без ЗАГЛАВНЫХ слов, без телефона и ссылок в тексте. Целевая страница. Должна открываться , соответствовать объявлению, не содержать навязчивых окон, иметь контактную информацию. Тематики с ограничениями. Алкоголь, азартные игры, лекарства и др. Ваша тематика (строительство и ЖБИ) обычных ограничений не имеет. Подтверждение рекламодателя. Google может потребовать документы о бизнесе. Подготовьте реквизиты ИП. 22.2 Что чаще всего приводит к блокировке Причина Как избежать Недостоверные обещания Только проверяемое Обход систем (подмена страниц, клоакинг) Показывайте роботу и человеку одно и то же Недоступный сайт Допуск AdsBot, стабильный TLS Проблемы с платежом Проверенная карта, уведомления Подозрительная активность Не делится аккаунтами, не покупать «бустеры» 22.3 Недействительные клики Google фильтрует часть недействительных кликов автоматически. Но конкуренты и боты возможны. Мониторьте: резкие всплески кликов без конверсий, клики из необычных мест или в странное время, несовпадение «клики и визиты». Что можно сделать: исключения по IP (ограниченное число), корректировки расписания, жалобы, а также внимательность к минус-словам. 22.4 Безопасность аккаунта Двухэтапная аутентификация на почте и в Google Ads. Доступ подрядчикам только с минимальными правами, лучше через менеджерский аккаунт. Защитите платёжный профиль, настройте уведомления о платежах и бюджете. Никогда не отправляйте пароли и токены в чатах. Что сделать на вашем сайте Проверьте, что все факты в объявлениях подтверждены на страницах. Включите двухэтапную аутентификацию. ", "toc": [["221-основные-требования", "22.1 Основные требования"], ["222-что-чаще-всего-приводит-к-блокировке", "22.2 Что чаще всего приводит к блокировке"], ["223-недействительные-клики", "22.3 Недействительные клики"], ["224-безопасность-аккаунта", "22.4 Безопасность аккаунта"], ["что-сделать-на-вашем-сайте", "Что сделать на вашем сайте"]]}, {"id": "ch23", "num": "23", "title": "План запуска для вашего сайта", "full": "23. План запуска для вашего сайта", "part": "Часть VI. Практика", "html": "<p>Подробные списки и CSV: <a href=\"#/plan\">GOOGLE-ADS-CAMPAIGN-PLAN.md</a>, <a href=\"#/kw\">google-ads-keywords.csv</a>, <a href=\"#/ads\">google-ads-ads.csv</a>.</p>\n<h3 id=\"231-условия-до-запуска\">23.1 Условия до запуска</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>#</th><th>Условие</th><th>Статус (26.10.2026)</th></tr></thead><tbody><tr><td data-label=\"#\">1</td><td data-label=\"Условие\">Оплата и доступность Google Ads из Беларуси</td><td data-label=\"Статус (26.10.2026)\">Проверено владельцем</td></tr><tr><td data-label=\"#\">2</td><td data-label=\"Условие\">Обрывы TLS на хостинге устранены</td><td data-label=\"Статус (26.10.2026)\">Не устранены: 12 обрывов из 30 запросов (40%) 26.10</td></tr><tr><td data-label=\"#\">3</td><td data-label=\"Условие\">AdsBot допущен хостингом</td><td data-label=\"Статус (26.10.2026)\">Обращение отправлено</td></tr><tr><td data-label=\"#\">4</td><td data-label=\"Условие\">Правки сайта на проде</td><td data-label=\"Статус (26.10.2026)\">Ждёт деплоя</td></tr><tr><td data-label=\"#\">5</td><td data-label=\"Условие\">GA4 связан с Google Ads, 3 конверсии импортированы</td><td data-label=\"Статус (26.10.2026)\">Сделать</td></tr><tr><td data-label=\"#\">6</td><td data-label=\"Условие\">Таблица «откуда узнали»</td><td data-label=\"Статус (26.10.2026)\">Сделать</td></tr><tr><td data-label=\"#\">8</td><td data-label=\"Условие\">Секреты на проде закрыты (файл с паролем WP и токеном бота, список пользователей REST)</td><td data-label=\"Статус (26.10.2026)\">Открыты: срочно</td></tr><tr><td data-label=\"#\">9</td><td data-label=\"Условие\">Цены на сайте подтверждены (в прайсе стоит статус demo)</td><td data-label=\"Статус (26.10.2026)\">Владелец</td></tr><tr><td data-label=\"#\">7</td><td data-label=\"Условие\">Юнит-экономика (предельная цена заявки)</td><td data-label=\"Статус (26.10.2026)\">Заполнить</td></tr></tbody></table></div>\n<h3 id=\"232-график\">23.2 График</h3>\n<div class=\"diagram\" data-svg=\"gantt\" role=\"img\" aria-label=\"Диаграмма\"></div>\n<h3 id=\"233-первый-месяц\">23.3 Первый месяц</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>Период</th><th>Действие</th></tr></thead><tbody><tr><td data-label=\"Период\">Дни 1–3</td><td data-label=\"Действие\">Проверить одобрение объявлений, метки в GA4, минус-слова</td></tr><tr><td data-label=\"Период\">Дни 4–14</td><td data-label=\"Действие\">Только минус-слова и мелкие правки текста; сбор 30–50 кликов на группу</td></tr><tr><td data-labe
