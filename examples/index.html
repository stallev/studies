l=\"Период\">Дни 15–21</td><td data-label=\"Действие\">Анализ CTR и конверсий, замена слабых заголовков</td></tr><tr><td data-label=\"Период\">Дни 22–30</td><td data-label=\"Действие\">Решение: масштаб лучших групп, этап 2 (D, E), переход на «максимум конверсий» при 15+ конверсиях</td></tr></tbody></table></div>\n<h3 id=\"234-решающие-критерии\">23.4 Решающие критерии</h3>\n<ul><li><strong>Успех:</strong> цена заявки ниже предельной, есть стабильные звонки и заявки, которые подтверждаются таблицей «откуда узнали».</li><li><strong>Корректировка:</strong> цена заявки выше предельной, но конверсия растёт. Улучшайте страницу и запросы.</li><li><strong>Остановка:</strong> 100+ кликов на группу без заявок после исправления страницы и запросов. Пересмотрите оффер.</li></ul>\n<h3 id=\"235-бюджет\">23.5 Бюджет</h3>\n<p>Заложено $100 на 3–4 недели, то есть около $3,3 в сутки на две кампании (монтаж 65%, кольца 35%). Это разумный тест, если сначала закрыть блокеры: обрывы TLS, открытые секреты, цены «demo». Ограничением станет объём запросов в Бресте, а не деньги. Оценка со сценариями и правилами решений: <a href=\"#/research/8-оценка-решения-100-на-34-недели\">раздел 8 исследования</a>. Бюджет не поднимайте, пока не понятна цена заявки.</p>", "text": "Подробные списки и CSV: GOOGLE-ADS-CAMPAIGN-PLAN.md , google-ads-keywords.csv , google-ads-ads.csv . 23.1 Условия до запуска # Условие Статус (26.10.2026) 1 Оплата и доступность Google Ads из Беларуси Проверено владельцем 2 Обрывы TLS на хостинге устранены Не устранены: 12 обрывов из 30 запросов (40%) 26.10 3 AdsBot допущен хостингом Обращение отправлено 4 Правки сайта на проде Ждёт деплоя 5 GA4 связан с Google Ads, 3 конверсии импортированы Сделать 6 Таблица «откуда узнали» Сделать 8 Секреты на проде закрыты (файл с паролем WP и токеном бота, список пользователей REST) Открыты: срочно 9 Цены на сайте подтверждены (в прайсе стоит статус demo) Владелец 7 Юнит-экономика (предельная цена заявки) Заполнить 23.2 График 23.3 Первый месяц Период Действие Дни 1–3 Проверить одобрение объявлений, метки в GA4, минус-слова Дни 4–14 Только минус-слова и мелкие правки текста; сбор 30–50 кликов на группу Дни 15–21 Анализ CTR и конверсий, замена слабых заголовков Дни 22–30 Решение: масштаб лучших групп, этап 2 (D, E), переход на «максимум конверсий» при 15+ конверсиях 23.4 Решающие критерии Успех: цена заявки ниже предельной, есть стабильные звонки и заявки, которые подтверждаются таблицей «откуда узнали». Корректировка: цена заявки выше предельной, но конверсия растёт. Улучшайте страницу и запросы. Остановка: 100+ кликов на группу без заявок после исправления страницы и запросов. Пересмотрите оффер. 23.5 Бюджет Заложено $100 на 3–4 недели, то есть около $3,3 в сутки на две кампании (монтаж 65%, кольца 35%). Это разумный тест, если сначала закрыть блокеры: обрывы TLS, открытые секреты, цены «demo». Ограничением станет объём запросов в Бресте, а не деньги. Оценка со сценариями и правилами решений: раздел 8 исследования . Бюджет не поднимайте, пока не понятна цена заявки.", "toc": [["231-условия-до-запуска", "23.1 Условия до запуска"], ["232-график", "23.2 График"], ["233-первый-месяц", "23.3 Первый месяц"], ["234-решающие-критерии", "23.4 Решающие критерии"], ["235-бюджет", "23.5 Бюджет"]]}, {"id": "research", "num": "24", "title": "Исследование 26.10.2026: стратегия, страницы сайта, бюджет $100", "full": "24. Исследование 26.10.2026: стратегия, страницы сайта, бюджет $100", "part": "Часть VII. Ваш проект: стратегия и план (обновлено 26.10.2026)", "html": "<p><strong>Дата:</strong> 26.10.2026 · <strong>Сайт:</strong> <code>https://kanalizacia-brest.by</code> · <strong>Период данных:</strong> GSC 13.08–24.10.2026 (73 дня), GA4 28.07–25.10.2026 (90 дней), GA4 за 19–25.10, Яндекс Вебмастер 06.09–06.10 (прошлая выгрузка), код темы и seed-файлы в репозитории, живой прод (проверки 26.10.2026).</p>\n<hr>\n<h3 id=\"1-короткий-вывод\">1. Короткий вывод</h3>\n<ol><li><strong>Запускать Google Ads на $100 имеет смысл, но не сегодня.</strong> Три вещи сжигают бюджет до первого клика: обрывы TLS (сегодня 12 из 30 запросов, 40%), публично доступные пароли и токен на проде, и не подтверждённые цены (в прайсе на проде стоит <code>priceStatus: demo</code>). Пока это не исправлено, из $100 примерно $40 уйдёт на клики, которые не откроют сайт.</li><li><strong>Стратегия: одна узкая кампания вместо трёх.</strong> Первый этап: A (монтаж под ключ, 65% бюджета) и B (кольца ЖБИ, 35%). Манипулятор (C) переносится на второй этап: на $3,5 в день три кампании дадут по 1–2 клика в сутки, и вывод из них сделать будет нельзя.</li><li><strong>$100 на 4 недели достаточно, чтобы проверить гипотезу, но не чтобы оптимизировать.</strong> Это «плата за данные»: цена клика, CTR, качество поисковых запросов, первые 3–10 заявок. Узким местом будет не бюджет, а объём запросов в Бресте.</li><li><strong>Новые страницы не блокируют запуск.</strong> Рекламу можно запустить на существующих страницах, а новые (цена, септик, доборы) делать параллельно. Порядок и готовые ТЗ для AI-агентов в разделе 5.</li><li><strong>Paid Search 22.10 — это не реклама.</strong> Кампании нет, расхода нет. Самое вероятное объяснение: технические заходы по ссылкам с <code>utm_medium=cpc</code> или <code>gclid</code> (проверка рендера Google, тест ссылок). Как проверить за 2 минуты: раздел 7.</li><li><strong>Ссылки в HTML-руководстве:</strong> 15 относительных ссылок на <code>.md</code> и <code>.csv</code> не открываются из одного файла. Внешние 11 ссылок живые. Ссылка <code>adwords-handb.vercel.app/GOOGLE-ADS-CAMPAIGN-PLAN.md</code> сейчас отдаёт 404. Исправлено: план, ключи, объявления и UTM встроены в HTML (раздел 6).</li></ol>\n<hr>\n<h3 id=\"2-что-показывают-данные\">2. Что показывают данные</h3>\n<h4 id=\"21-google-search-console-73-дня\">2.1. Google Search Console (73 дня)</h4>\n<div class=\"tablewrap\"><table><thead><tr><th>Показатель</th><th>Значение</th></tr></thead><tbody><tr><td data-label=\"Показатель\">Показы / клики / CTR</td><td data-label=\"Значение\">467 / 17 / 3,6% (по таблице страниц: 533 / 18)</td></tr><tr><td data-label=\"Показатель\">Средняя позиция</td><td data-label=\"Значение\">9,45</td></tr><tr><td data-label=\"Показатель\">Беларусь</td><td data-label=\"Значение\">414 показов, 17 кликов, 4,1%. Россия 29 показов, 0 кликов</td></tr><tr><td data-label=\"Показатель\">Устройства</td><td data-label=\"Значение\">Мобильные 76% показов (356), ПК 23%, планшеты 1%</td></tr><tr><td data-label=\"Показатель\">Динамика показов</td><td data-label=\"Значение\">13.08–09.09: 130; 10.09–07.10: 133; 08.10–24.10 (17 дней): 204</td></tr><tr><td data-label=\"Показатель\">Последние 14 дней против предыдущих 14</td><td data-label=\"Значение\">179 против 97 показов (почти ×2)</td></tr></tbody></table></div>\n<p>Что это значит:</p>\n<ul><li><strong>Спрос растёт к осени.</strong> Показы выросли почти вдвое за октябрь. Это сезон «пока земля не промёрзла». Окно для рекламы открыто сейчас, но не бесконечно.</li><li><strong>Две трети показов приходится на информационные страницы</strong> (блог и FAQ: 368 из 533 показов), но дают они всего 5 из 18 кликов. Коммерческие страницы: 165 показов и 13 кликов (CTR около 8%). Для рекламы это важно: органика по информационным темам трафик даёт, по коммерческим слабо.</li><li><strong>Главные коммерческие запросы стоят на 2–4 странице:</strong> «канализация под ключ» (15 показов, позиция 12,7), «канализация под ключ брест» (позиция 32), «монтаж канализации под ключ» (позиция 50). Органика по ядру в ближайшие месяцы не заработает, поэтому реклама по этим словам обоснована.</li><li><strong>Статья про уклон трубы</strong> (<code>/blog/uklon-kanalizacionnoj-truby/</code>): 174 показа, 0 кликов, позиция 9,4. Это самая большая «потерянная» точка: сниппет не цепляет. Но трафик информационный, заявок из него ждать не стоит.</li><li><strong>Запросы, которых у нас нет как товара:</strong> «кольца для септика пластиковые», «кольца для колодца пластиковые». Люди ищут пластик, мы продаём бетон. Это минус-слова для рекламы, а не повод для страницы.</li><li><strong>Запросы вне услуг:</strong> «откачка канализации брест» (позиция 64). Услуги нет, в рекламе минусовать.</li></ul>\n<h4 id=\"22-ga4-90-дней-очищаем-от-шума\">2.2. GA4 (90 дней): очищаем от шума</h4>\n<div class=\"tablewrap\"><table><thead><tr><th>Показатель</th><th>Значение</th></tr></thead><tbody><tr><td data-label=\"Показатель\">Пользователей всего (по каналам)</td><td data-label=\"Значение\">518</td></tr><tr><td data-label=\"Показатель\">Direct</td><td data-label=\"Значение\">316, из них 146 из дата-центров (Council Bluffs, Ashburn, Boardman, Moers)</td></tr><tr><td data-label=\"Показатель\">Реальные люди (без дата-центров)</td><td data-label=\"Значение\">около 370 за 90 дней, то есть 4 в день</td></tr><tr><td data-label=\"Показатель\">Organic Search</td><td data-label=\"Значение\">173 (Яндекс и Google вместе), 140 из Беларуси, из них Брест 69</td></tr><tr><td data-label=\"Показатель\">Referral</td><td data-label=\"Значение\">26</td></tr><tr><td data-label=\"Показатель\">Paid Search</td><td data-label=\"Значение\">3 (все 22.10, город <code>(not set)</code>, вовлечённость 0)</td></tr><tr><td data-label=\"Показатель\">Ключевые события</td><td data-label=\"Значение\"><strong>0 на всех страницах за весь период</strong></td></tr></tbody></table></div>\n<p>Выводы:</p>\n<ul><li><strong>Конверсии за 90 дней не измерены.</strong> Ноль в колонке «Ключевые события» не значит «заявок не было», а значит «события не были отмечены ключевыми до 22.10». Базовой конверсии сайта у нас нет, поэтому прогноз результата рекламы ниже сделан по отраслевым ориентирам и помечен как оценка.</li><li><strong>Воронка сайта узкая.</strong> Главная: 509 просмотров, 370 пользователей. В платные услуги дошли: монтаж под ключ 40 пользователей, каталог 54, контакты 15. То есть <strong>около 11% посетителей главной видят основную услугу</strong>. Это точка роста: сильнее связать главную с флагманом (баннер, якорная ссылка, меню).</li><li><strong>Лучшее время взаимодействия</strong> у страницы «Монтаж под ключ»: 200 секунд на пользователя. Контент работает, до него просто мало кто доходит.</li><li><strong>Блог про кессон «своими руками»:</strong> 47 пользователей, 90 секунд, 0 событий. Аудитория в основном из России и «самоделкины» (по Яндексу из 919 показов статьи лишь 22 белорусские). Для рекламы не использовать, на странице добавить блок «заказать под ключ».</li><li><strong>Служебные адреса видны в GA4:</strong> <code>/wp-content/themes/taranenkotheme/creds/project_creds.json</code> (3 просмотра) и <code>/creds/</code>. Это та же проблема, что в разделе 3.1.</li></ul>\n<h4 id=\"23-яндекс-вебмастер-выгрузка-06090610-из-прошлого-анализа\">2.3. Яндекс Вебмастер (выгрузка 06.09–06.10, из прошлого анализа)</h4>\n<p>Яндекс остаётся главным источником людей (около 53% пользователей по GA4 за тот период). Самые «денежные» запросы там: «кольца канализационные купить в бресте» (11 кликов на 142 показа в 14 дней), «канализация брест» (5 кликов на 7 показов, позиция 1,3), «доборные кольца под люк», «манипулятор в бресте услуги». Яндекс.Директ сейчас недоступен из-за сбоя сервисов; вернуться к нему нужно сразу после восстановления. Метрика на проде уже подключена (счётчик 113740349, проверено 26.10).</p>\n<hr>\n<h3 id=\"3-что-мешает-запуску-прямо-сейчас-блокеры\">3. Что мешает запуску прямо сейчас (блокеры)</h3>\n<h4 id=\"31-секреты-на-проде-не-закрыты-проверено-26102026\">3.1. 🔴 Секреты на проде не закрыты (проверено 26.10.2026)</h4>\n<p>В <code>AUDIT-REPORT.md</code> пункты A3 и A4 помечены «выполнено со слов владельца». Фактическая проверка сегодня:</p>\n<div class=\"tablewrap\"><table><thead><tr><th>Адрес</th><th>Ответ прода</th></tr></thead><tbody><tr><td data-label=\"Адрес\"><code>/wp-content/themes/taranenkotheme/creds/project_creds.json</code></td><td data-label=\"Ответ прода\"><strong>200</strong>, JSON с ключами: логин и пароль WordPress, токен и chat_id Telegram-бота, GA4_ID</td></tr><tr><td data-label=\"Адрес\"><code>/wp-json/wp/v2/users</code></td><td data-label=\"Ответ прода\">200, публично отдаёт список пользователей (в паре с логином из файла выше это готовый вход в админку)</td></tr><tr><td data-label=\"Адрес\"><code>/wp-content/themes/taranenkotheme/README.md</code>, <code>package.json</code>, <code>seed/company.json</code>, <code>docs/general/03-seo-strategiya.md</code>, <code>prototype/kontakty.html</code></td><td data-label=\"Ответ прода\">200 (внутренняя документация, SEO-стратегия, реквизиты ИП)</td></tr></tbody></table></div>\n<p>Файл <code>creds/</code> в git не отслеживается (в истории коммитов его нет), то есть он лежит только на хостинге. Что сделать <strong>сегодня</strong>, до любых платных кликов:</p>\n<ol><li>Удалить <code>creds/project_creds.json</code> с хостинга (по FTP или файловому менеджеру). Убрать запасное чтение этого файла из <code>mu-plugins/tb-core/forms.php</code> (около строки 282).</li><li><strong>Сменить пароль администратора WordPress и перевыпустить токен Telegram-бота</strong> (через @BotFather: <code>/revoke</code>). Считать их скомпрометированными: файл был в открытом доступе с августа 2026 (дата файла 06.08), а GA4 фиксирует заходы на этот адрес.</li><li>Закрыть директории темы от прямого доступа (<code>creds/</code>, <code>docs/</code>, <code>seed/</code>, <code>prototype/</code>, <code>tools/</code>, <code>tests/</code>, <code>scripts/</code>, <code>psi-reports/</code>, <code>test-results/</code>, <code>node_modules/</code>, <code>README.md</code>, <code>package*.json</code>): правило в <code>.htaccess</code> или в конфиге nginx (зависит от хостинга, уточнить у hoster.by). Не просить это у AI-агента «на глаз», а проверить после <code>curl -I</code> на каждый адрес: ожидаем 403 или 404.</li><li>Закрыть <code>/wp-json/wp/v2/users</code> для анонимов (плагин безопасности или фильтр <code>rest_endpoints</code>) и убедиться, что логин администратора не равен автору записей.</li></ol>\n<p>Реклама привлекает внимание, в том числе ботов-сканеров. Запускать её на сайте с открытым паролем администратора нельзя.</p>\n<h4 id=\"32-обрывы-tls\">3.2. 🔴 Обрывы TLS</h4>\n<p>Повторный замер сегодня: 30 запросов к <code>/robots.txt</code>, <strong>18 успешно, 12 обрывов (40%)</strong>. Те же цифры, что 22.10 (20–43%). Ответа хостинга по тикету из <code>SUPPORT-REQUEST-hoster-adsbot-tls.md</code> нет в материалах. Google Ads списывает деньги за клик до загрузки вашей страницы, поэтому оборванное соединение — это оплаченный и потерянный клик. На $100 это около $40 потерь. Критерий допуска к запуску: не более 1–2% обрывов на серии из 100 запросов и письменное подтверждение допуска AdsBot. Если хостинг не решает вопрос за 3–5 дней, перенос сайта на другой хостинг дешевле, чем реклама поверх него.</p>\n<h4 id=\"33-цены-на-сайте-со-статусом-demo\">3.3. 🟠 Цены на сайте со статусом «demo»</h4>\n<p>В прайсе на проде (<code>tb-pricebook</code>) у всех позиций <code>priceStatus: demo</code>, при этом цифры выводятся пользователю (например, кольцо 1 м, монтаж «от 280», доставка 200 руб до 30 км). В объявлениях мы пишем «200 руб до 30 км». Если это не реальные цены, реклама нарушает политику Google о недостоверной информации, а клиенты придут за ценой, которой нет. До запуска владелец подтверждает каждую цифру из объявлений и переводит статус из <code>demo</code> в рабочий.</p>\n<h4 id=\"34-измерение-сквозная-проверка\">3.4. 🟠 Измерение: сквозная проверка</h4>\n<p>Метрика подключена, события GA4 помечены ключевыми 22.10. Не проверено, что: (а) клик по телефону и Telegram реально приходит как событие в Google Ads после импорта; (б) <code>gtag</code> грузится через 2,5 секунды после загрузки или при взаимодействии, поэтому быстрый уход с сайта в GA4 не виден; (в) звонки набором вручную не учитываются. До запуска: тестовый заход по ссылке <code>?gclid=TEST</code> не от имени администратора, затем DebugView, затем запись в таблицу «откуда узнали».</p>\n<hr>\n<h3 id=\"4-стратегия-и-план-рекламной-кампании-что-изменилось-в-v2\">4. Стратегия и план рекламной кампании (что изменилось в v2)</h3>\n<p>Полный текст — в <code>handbooks/adwords/GOOGLE-ADS-CAMPAIGN-PLAN.md</code> (в HTML: Часть VII, «План кампании v2»). Ключевые решения:</p>\n<div class=\"tablewrap\"><table><thead><tr><th>Вопрос</th><th>Было (22.10)</th><th>Стало (26.10)</th><th>Почему</th></tr></thead><tbody><tr><td data-label=\"Вопрос\">Кампании на старте</td><td data-label=\"Было (22.10)\">A 50%, B 30%, C 20%</td><td data-label=\"Стало (26.10)\"><strong>A 65%, B 35%.</strong> C (манипулятор), D, E — этап 2</td><td data-label=\"Почему\">На $3,5 в сутки три кампании не набирают статистику</td></tr><tr><td data-label=\"Вопрос\">Дневной бюджет</td><td data-label=\"Было (22.10)\">задаёт владелец</td><td data-label=\"Стало (26.10)\"><strong>$3,5 в сутки суммарно</strong> (A $2,3, B $1,2). Google может потратить до 2× за день, но не больше суточный × 30,4 в месяц</td><td data-label=\"Почему\">Потолок $100 за месяц</td></tr><tr><td data-label=\"Вопрос\">Посадочная для группы «Септик»</td><td data-label=\"Было (22.10)\">та же, что у «Канализации под ключ»</td><td data-label=\"Стало (26.10)\"><code>/montazh-kanalizacii-pod-klyuch/#systems</code> сразу; отдельная страница <code>/septik-pod-klyuch-brest/</code> после этапа P2</td><td data-label=\"Почему\">Нулевая стоимость разработки, лучше релевантность объявления</td></tr><tr><td data-label=\"Вопрос\">Ставки</td><td data-label=\"Было (22.10)\">ручные или максимум кликов</td><td data-label=\"Стало (26.10)\"><strong>Максимум кликов с лимитом CPC $0,80</strong> (или ручные), автостратегии не включать</td><td data-label=\"Почему\">Менее 30 конверсий</td></tr><tr><td data-label=\"Вопрос\">Соответствие</td><td data-label=\"Было (22.10)\">фраза и точное</td><td data-label=\"Стало (26.10)\">то же, <strong>плюс ежедневный просмотр поисковых запросов первые 7 дней</strong></td><td data-label=\"Почему\">Малый объём, любой мусорный запрос заметен</td></tr><tr><td data-label=\"Вопрос\">Условия запуска</td><td data-label=\"Было (22.10)\">6 пунктов</td><td data-label=\"Стало (26.10)\"><strong>9 пунктов</strong>, добавлены безопасность, цены <code>demo</code> и тест конверсий</td><td data-label=\"Почему\">Раздел 3</td></tr><tr><td data-label=\"Вопрос\">Критерий остановки</td><td data-label=\"Было (22.10)\">100+ кликов на группу</td><td data-label=\"Стало (26.10)\"><strong>~125 кликов на кампанию без единой заявки = сломан трекинг, страница или оффер</strong> (при реальной конверсии ≥3% шанс нуля ≈2%)</td><td data-label=\"Почему\">Статистика (раздел 8)</td></tr></tbody></table></div>\n<p>Дополнительно: расписание Пн–Сб оставить (как решил владелец), на ночь 23:00–07:00 поставить −30% к ставке: ночью звонок не примут, а форма и Telegram работают. Гео: «Присутствие», радиус 35 км от Бреста. Пинск и Барановичи только на этапе 2 и только для манипулятора.</p>\n<hr>\n<h3 id=\"5-страницы-сайта-что-добавить-и-изменить\">5. Страницы сайта: что добавить и изменить</h3>\n<h4 id=\"51-принципы-чтобы-не-навредить-в-google-и-яндексе\">5.1. Принципы (чтобы не навредить в Google и Яндексе)</h4>\n<ul><li><strong>Один URL — одно намерение.</strong> Нельзя делать два URL под один запрос (каннибализация). Главная и флагман уже частично пересекаются по запросам «канализация под ключ»: главную не трогаем (в Яндексе она в топе по «канализация брест», позиция 1,3), а на флагман ведём внутренними ссылками с анкором «канализация в частном доме под ключ».</li><li><strong>Никаких «город × услуга» без реальных данных.</strong> Google относит такие шаблонные страницы к дорвеям (doorway abuse), Яндекс понижает за переоптимизацию. Страница под город допустима только если на ней есть реальные объекты из этого города, отзыв и цены маршрута. Сейчас таких данных достаточно только для Пинска и Барановичей по манипулятору (и то как раздел на существующей странице).</li><li><strong>Контент для человека:</strong> цены и вилки, фото объектов, имена, что входит и что нет, понятная цена и порядок работ. Искусственные списки ключевых слов не писать. Это же главное для качества посадочной в Google Ads (релевантность, опыт на странице, скорость).</li><li><strong>Разметка по видимому содержимому.</strong> <code>LocalBusiness</code>, <code>Service</code>, <code>Product</code> и <code>Offer</code> уже есть. <code>FAQPage</code> оставить, но не ждать расширенных сниппетов: Google с 2023 показывает FAQ-сниппеты почти только государственным и медицинским сайтам. Ценность FAQ — в тексте и в поведении посетителей.</li><li><strong>Яндекс:</strong> регион сайта в Вебмастере (Брест), карточка в Яндекс Бизнесе (ждёт восстановления сервиса), контакты и цены на каждой коммерческой странице, поведенческие факторы через Метрику.</li><li><strong>Тонкий контент не плодить.</strong> 36 страниц <code>/faq/*</code> уже индексируются (и две из них приносят клики). Не удалять, но не добавлять новые без нужды; усиливать те, у кого есть показы.</li></ul>\n<h4 id=\"52-приоритеты\">5.2. Приоритеты</h4>\n<div class=\"tablewrap\"><table><thead><tr><th>P</th><th>Что</th><th>Тип</th><th>Зачем (данные)</th><th>Когда</th></tr></thead><tbody><tr><td data-label=\"P\">P0</td><td data-label=\"Что\">Закрыть секреты, исправить TLS, подтвердить цены</td><td data-label=\"Тип\">Безопасность</td><td data-label=\"Зачем (данные)\">Блокеры (раздел 3)</td><td data-label=\"Когда\"><strong>до запуска</strong></td></tr><tr><td data-label=\"P\">P0</td><td data-label=\"Что\">Тест событий <code>click_phone</code>, <code>click_telegram</code>, <code>generate_lead</code></td><td data-label=\"Тип\">Аналитика</td><td data-label=\"Зачем (данные)\">0 ключевых событий за 90 дней</td><td data-label=\"Когда\">до запуска</td></tr><tr><td data-label=\"P\">P1</td><td data-label=\"Что\"><strong>Главная: явный блок-переход на флагман и каталог</strong> (первый экран и после «Четыре причины»)</td><td data-label=\"Тип\">Правка</td><td data-label=\"Зачем (данные)\">До флагмана доходит 11% посетителей главной (40 из 370)</td><td data-label=\"Когда\">1–2 дня</td></tr><tr><td data-label=\"P\">P1</td><td data-label=\"Что\"><strong>Флагман и каталог колец: sticky-кнопка «Позвонить» на мобильных</strong> и «Telegram»</td><td data-label=\"Тип\">Правка</td><td data-label=\"Зачем (данные)\">76% показов с мобильных; на странице контактов только 15 человек</td><td data-label=\"Когда\">1 день</td></tr><tr><td data-label=\"P\">P1</td><td data-label=\"Что\"><strong>Блог (7 статей): блок «Заказать под ключ» вверху и внизу</strong>, перелинковка на флагман</td><td data-label=\"Тип\">Правка</td><td data-label=\"Зачем (данные)\">368 информационных показов не доходят до услуг</td><td data-label=\"Когда\">1–2 дня</td></tr><tr><td data-label=\"P\">P1</td><td data-label=\"Что\"><strong><code>/blog/uklon-kanalizacionnoj-truby/</code>: новый title и сниппет, таблица уклона по диаметру</strong></td><td data-label=\"Тип\">Правка</td><td data-label=\"Зачем (данные)\">174 показа, 0 кликов. Потенциально +8–10 кликов</td><td data-label=\"Когда\">2 часа</td></tr><tr><td data-label=\"P\">P2</td><td data-label=\"Что\"><strong>Новая: <code>/cena-kanalizacii-pod-klyuch/</code></strong> («Сколько стоит канализация в частном доме под ключ в Бресте»)</td><td data-label=\"Тип\">Новая страница</td><td data-label=\"Зачем (данные)\">Запросы «стоимость», «цена», «сколько стоит» с позициями 1–9, но единичными показами; главный коммерческий кластер, нет отдельной цены</td><td data-label=\"Когда\">после подтверждения цен</td></tr><tr><td data-label=\"P\">P2</td><td data-label=\"Что\"><strong>Новая: <code>/septik-pod-klyuch-brest/</code></strong></td><td data-label=\"Тип\">Новая страница</td><td data-label=\"Зачем (данные)\">Запросы про септики в Яндексе («септики для частного дома в бресте», «ориентировочная стоимость переливного септика»), группа Google Ads «Септик»</td><td data-label=\"Когда\">1–2 недели</td></tr><tr><td data-label=\"P\">P3</td><td data-label=\"Что\"><strong>Секция «Доборы и люки» на <code>/katalog/</code></strong> с якорем <code>#dobory</code>: размеры 10–60 см, как подобрать высоту, цены, фото. Отдельный URL <code>/katalog/dobory/</code> только если за 4 недели будет более 30 показов по доборам</td><td data-label=\"Тип\">Правка, затем возможно страница</td><td data-label=\"Зачем (данные)\">Яндекс: 6 разных запросов про доборы за 14 дней; в seed решено не делать тонкие страницы, это правильно, но проверяем данными</td><td data-label=\"Когда\">через 4 недели</td></tr><tr><td data-label=\"P\">P3</td><td data-label=\"Что\"><strong>Раздел «Пинск и Барановичи» на <code>/dostavka-manipulyatorom/</code></strong>: тарифы по маршруту, фото, 1–2 отзыва</td><td data-label=\"Тип\">Правка</td><td data-label=\"Зачем (данные)\">«манипулятор пинск» 3 показа, GA4: 15 органических пользователей из Барановичей, 6 из Пинска</td><td data-label=\"Когда\">этап 2 рекламы</td></tr><tr><td data-label=\"P\">P3</td><td data-label=\"Что\">Секция «Копка траншеи под канализацию, цена за метр» на странице грейфера</td><td data-label=\"Тип\">Правка</td><td data-label=\"Зачем (данные)\">«копка канализации» (позиция 7), «сколько стоит выкопать канализацию» (позиция 4)</td><td data-label=\"Когда\">по возможности</td></tr><tr><td data-label=\"P\">✗</td><td data-label=\"Что\">Страницы «канализация Кобрин / Пружаны / Малорита…»</td><td data-label=\"Тип\">Не делать</td><td data-label=\"Зачем (данные)\">Дорвей-риск; в портфолио по 1 объекту на город</td><td data-label=\"Когда\">—</td></tr><tr><td data-label=\"P\">✗</td><td data-label=\"Что\">Страница «откачка канализации», «пластиковые кольца»</td><td data-label=\"Тип\">Не делать</td><td data-label=\"Зачем (данные)\">Не наша услуга и не наш товар; в минус-слова</td><td data-label=\"Когда\">—</td></tr></tbody></table></div>\n<h4 id=\"53-тз-для-ai-агентов-как-создавать-код\">5.3. ТЗ для AI-агентов (как создавать код)</h4>\n<p>Общая рамка: в этом репозитории контент хранится в seed-файлах (<code>themes/taranenkotheme/seed/*.json</code>), SEO-тексты — в <code>seed/yoast-meta.json</code>, структура страниц — в <code>seed/pages-map.json</code>, шаблоны — <code>page-&lt;slug&gt;.php</code>, страницы создаёт <code>inc/setup-pages.php</code> (<code>tb_theme_bootstrap_page_titles()</code>), импорт — <code>wp tb seed</code>. Новая страница = пять изменений: запись в <code>pages-map.json</code>, <code>yoast-meta.json</code>, заголовок в <code>setup-pages.php</code>, шаблон <code>page-&lt;slug&gt;.php</code>, FAQ в <code>faq.json</code> с <code>placement</code> = slug. Проверка: <code>node themes/taranenkotheme/seed/scripts/validate-seeds.mjs</code>.</p>\n<p><strong>Новая страница №1. <code>/cena-kanalizacii-pod-klyuch/</code></strong> (P2, после подтверждения цен)</p>\n<ul><li>Намерение: «сколько стоит канализация под ключ в Бресте». Коммерческое исследование.</li><li>Title (до 60): <code>Сколько стоит канализация в частном доме под ключ в Бресте</code>. Description (до 155): <code>Цены 2026: накопительная, переливная система и септик из колец. Что входит в цену, от чего зависит сумма. Расчёт онлайн, замер бесплатно. Тел. +375 29 527-00-00.</code></li><li>H1: <code>Сколько стоит канализация в частном доме под ключ — Брест и область</code>.</li><li>Блоки: вилка по трём системам (взять из <code>pricebook.json</code> после подтверждения, с подписью «на дату»); таблица «от чего зависит цена» (глубина, грунт, уровень грунтовых вод, длина трассы, число жильцов); 2–3 реальных объекта из <code>projects.json</code> с разбивкой «материалы + работы + вывоз грунта»; встроенный калькулятор (компонент уже есть на флагмане); блок «что НЕ входит в цену»; FAQ из 4 вопросов; форма заявки.</li><li>Связи: ссылки на флагман (анкор «монтаж канализации под ключ»), каталог колец, портфолио. С флагмана и главной ссылка на эту страницу. Флагман не дублировать: на нём остаётся «как проходит монтаж», на новой странице «сколько и почему».</li><li>Приёмка: нет <code>demo</code> в ценах; Lighthouse мобильный ≥85; в sitemap; canonical на себя; события GA4 срабатывают; <code>validate-seeds.mjs</code> зелёный; в Google Ads использовать как посадочную для групп с «цена/стоимость».</li></ul>\n<p><strong>Новая страница №2. <code>/septik-pod-klyuch-brest/</code></strong> (P2)</p>\n<ul><li>Намерение: «септик под ключ для частного дома». Отличие от флагмана: флагман — выбор из трёх систем, эта — только септик (3 камеры, из колец).</li><li>Title: <code>Септик для частного дома под ключ в Бресте — установка из колец ЖБИ</code>. H1: <code>Септик из колец ЖБИ под ключ — Брест и область</code>.</li><li>Блоки: подбор объёма по числу жильцов (таблица: 2, 4, 6 человек: диаметр колец и число камер, расчёт из <code>cenoobrazovanie-i-formuly-rascheta</code>); устройство (камеры, перелив, фильтрующий колодец, вентиляция); когда септик не подходит (высокий УГВ, глина) и что делать; цена «от» из pricebook; фото объекта «Септик Кобрин 2026-05» из портфолио; FAQ из 4 вопросов.</li><li>Не копировать абзацы со страницы монтажа и статьи «Виды септиков»; на статью ссылаться.</li><li>Приёмка как выше + проверка Search Console через 2 недели: страница не должна отбирать позиции у флагмана (если отбирает — склеить 301).</li></ul>\n<p><strong>Правка страницы №3. <code>/katalog/</code> — секция «Доборные кольца под люк»</strong> (P3)</p>\n<ul><li>Якорь <code>#dobory</code> (уже есть в хабе). Добавить: таблица высот 10–60 см с ценой и весом (<code>pricebook.json</code>, <code>types.dobory</code>), «как посчитать высоту добора» (3 шага), фото, 2 вопроса в FAQ. Отдельный URL — только по порогу 30 показов.</li></ul>\n<p><strong>Правка страницы №4. Статья «уклон» и блоки в блоге</strong> (P1)</p>\n<ul><li>Title: <code>Уклон канализационной трубы в частном доме: 2 см на метр (таблица)</code>. Description (до 155): <code>Какой уклон делать наружной канализации: таблица по диаметру трубы 110 и 160 мм, ошибки с «чем круче, тем лучше» и связь с глубиной колодца.</code> (Числа сверить с текстом статьи и нормативом; в статье цифры должны совпасть с title.)</li><li>Во все статьи: блок <code>post-cta</code> («Нужен монтаж? Замер бесплатно») после первого экрана и перед FAQ; ссылка на флагман с анкором по теме статьи.</li></ul>\n<h4 id=\"54-график-с-учётом-что-код-делается-ai-агентами-за-несколько-дней\">5.4. График (с учётом, что код делается AI-агентами за несколько дней)</h4>\n<div class=\"tablewrap\"><table><thead><tr><th>Срок</th><th>Что</th></tr></thead><tbody><tr><td data-label=\"Срок\">26–27.10</td><td data-label=\"Что\">P0: секреты, пароль, токен, htaccess/nginx, запрос в hoster.by повторно, подтверждение цен</td></tr><tr><td data-label=\"Срок\">28–30.10</td><td data-label=\"Что\">P1: главная, sticky-кнопки, блоки в блоге, title «уклона». Тест событий</td></tr><tr><td data-label=\"Срок\">30.10–02.11</td><td data-label=\"Что\">Повторный замер TLS (100 запросов). Если ≤2% и допуск AdsBot: <strong>старт Google Ads</strong> (кампании A и B)</td></tr><tr><td data-label=\"Срок\">02–15.11</td><td data-label=\"Что\">P2: страница цены, страница септика. Подключить к группам рекламы после индексации</td></tr><tr><td data-label=\"Срок\">15–30.11</td><td data-label=\"Что\">Решение по бюджету, этапу 2 (манипулятор Пинск/Барановичи, кессон), доборы P3</td></tr></tbody></table></div>\n<hr>\n<h3 id=\"6-проверка-ссылок-в-html-руководстве-analytics-datahtmlindexhtml\">6. Проверка ссылок в HTML-руководстве (<code>analytics_data/html/index.html</code>)</h3>\n<p>Файл — одностраничник: весь текст зашит в объект <code>PAYLOAD</code>, страницы показываются по <code>#/id</code>. Проверены все <code>href</code> во всех 28 главах.</p>\n<div class=\"tablewrap\"><table><thead><tr><th>Тип</th><th>Количество</th><th>Результат</th></tr></thead><tbody><tr><td data-label=\"Тип\">Внутренние <code>#/…</code> (на главы и разделы)</td><td data-label=\"Количество\">все</td><td data-label=\"Результат\">Ошибок нет</td></tr><tr><td data-label=\"Тип\">Внешние <code>https://…</code></td><td data-label=\"Количество\">11</td><td data-label=\"Результат\">Все отвечают 200 (devby.io, ilex.by ×2, pravo.by, skillshop.withgoogle.com, support.google.com ×2, trashbox.ru, vc.ru, yandex.ru ×2)</td></tr><tr><td data-label=\"Тип\"><strong>Относительные файлы</strong> (<code>GOOGLE-ADS-CAMPAIGN-PLAN.md</code>, <code>google-ads-keywords.csv</code>, <code>google-ads-ads.csv</code>, <code>UTM-LINKS.md</code>)</td><td data-label=\"Количество\"><strong>15 ссылок в 11 главах</strong></td><td data-label=\"Результат\"><strong>Битые:</strong> из одного HTML-файла они не открываются, а на <code>adwords-handb.vercel.app</code> файла нет</td></tr><tr><td data-label=\"Тип\"><code>https://adwords-handb.vercel.app/GOOGLE-ADS-CAMPAIGN-PLAN.md</code></td><td data-label=\"Количество\">—</td><td data-label=\"Результат\"><strong>404</strong> (корень сайта работает, файла <code>.md</code> нет). Браузер не показывает <code>.md</code> как страницу даже если файл есть: он его скачивает</td></tr></tbody></table></div>\n<p>Исправлено в обновлённом файле: все 15 ссылок ведут на встроенные главы Части VII (<code>#/plan</code>, <code>#/kw</code>, <code>#/ads</code>, <code>#/utm</code>). Плюс в главу <code>plan</code> добавлены полные таблицы ключей и объявлений с кнопками «Скачать CSV», так что отдельные файлы больше не нужны.</p>\n<hr>\n<h3 id=\"7-откуда-paid-search-22102026\">7. Откуда Paid Search 22.10.2026</h3>\n<p><strong>Факты:</strong></p>\n<ul><li>В GA4 за 19–25.10: Paid Search только 22.10, 3 новых пользователя, город <code>(not set)</code>, вовлечённость 0, по 3 события на пользователя (это <code>first_visit</code>, <code>session_start</code>, <code>page_view</code>). Ни скролла, ни кликов.</li><li>В выгрузке за 06.09–06.10 канала Paid Search нет совсем.</li><li>Кампания в Google Ads не создана, расхода нет. Яндекс.Директ не запускался (сервисы недоступны).</li><li>22.10 — день, когда создали UTM-ссылки (<code>UTM-LINKS.md</code>, шаблоны с <code>utm_medium=cpc</code>, <code>utm_source=google</code> и <code>yandex</code>), руководство и план Google Ads, а в плане описан тест <code>?gclid=TEST</code>. Также 22.10 в 12:58 запускалась «Проверка URL» в Search Console.</li></ul>\n<p><strong>Как GA4 присваивает Paid Search:</strong> канал «Paid Search» ставится, когда <code>utm_medium</code> похож на <code>cpc</code>, <code>ppc</code> или <code>paid*</code> и источник — поисковая система (<code>google</code>, <code>yandex</code>), либо когда в адресе есть <code>gclid</code> при привязке Google Ads. Достаточно ссылки с <code>?utm_source=google&amp;utm_medium=cpc</code>, открытой хоть кем-то, чтобы получить такую запись.</p>\n<p><strong>Вероятные причины, от более к менее правдоподобной:</strong></p>\n<ol><li><strong>Технические заходы по тестовым ссылкам</strong> (проверка меток, рендер страницы агентом или инструментом, ваш тест <code>?gclid=TEST</code> с VPN или приватным режимом). Признак: <code>(not set)</code> в городе, нулевое взаимодействие, по 3 события.</li><li><strong>Проверка Google</strong> (Inspection Tool рендерит страницу и исполняет JS; роботы Google Ads проверяют целевые страницы при создании объявлений). Признаки те же. В списках Google такие запросы приходят из дата-центров, там геолокации нет.</li><li><strong>Кто-то нажал на ссылку с cpc-метками</strong>, опубликованную в карточке или объявлении (по документу UTM ссылки в Kufar и карточки ещё не размещались, так что маловероятно).</li></ol>\n<p>Реальных кликов по рекламе не было: расхода нет.</p>\n<p><strong>Проверка за 2 минуты (GA4):</strong> Отчёты → Привлечение → Привлечение трафика → фильтр «Группа каналов по умолчанию = Paid Search», дата 22.10, вторичное измерение «Целевая страница + строка запроса» и «Источник/канал сеанса». Если в строке запроса <code>gclid=TEST</code> или <code>utm_campaign=ads_montazh</code> / <code>direct_montazh</code> — это ваши тестовые ссылки. Если источник <code>google / cpc</code> без меток — это инспекция Google. В Google Ads → Кампании должно быть пусто, в «Оплате» нет списаний.</p>\n<p><strong>Что сделать, чтобы это не портило отчёты после запуска:</strong> отдельная фильтрация тестов (по <code>utm_campaign=test</code>), включить в GA4 «Внутренний трафик» для вашего IP, в Google Ads всё размечать автотеггингом и суффиксом из плана, а в отчётах отбирать Paid Search по <code>campaign_id</code> реальных кампаний.</p>\n<hr>\n<h3 id=\"8-оценка-решения-100-на-34-недели\">8. Оценка решения «$100 на 3–4 недели»</h3>\n<p><strong>Вердикт: разумно как тест гипотезы, при трёх условиях.</strong> Это не бюджет на получение клиентов, а плата за информацию: понять цену клика, качество запросов, долю заявок и работоспособность связки «реклама → сайт → событие».</p>\n<h4 id=\"81-арифметика\">8.1. Арифметика</h4>\n<ul><li>$100 / 28 дней = <strong>$3,57 в сутки</strong>. Google тратит не больше суточного бюджета × 30,4 в месяц. Поставить $3,3 в сутки суммарно (A $2,2, B $1,1). Включить предоплату и не пополнять свыше $100.</li><li><strong>Цена клика:</strong> предполагаем $0,25–0,80 (это допущение: проверить в Планировщике ключевых слов, я его не вижу).</li><li><strong>Спрос — главное ограничение, не бюджет.</strong> Сайт получил 467 органических показов за 73 дня; реальный поисковый спрос выше (нас видят не все), но Брест и 35 км вокруг — малый рынок. Оценка: на ядро A+B уместится <strong>60–200 кликов в месяц</strong>. $100 будет потрачен полностью только при высоких ставках.</li><li><strong>Конверсия клика в заявку или звонок:</strong> ориентир для местных услуг 3–8% (если страница и оффер нормальные). У нас базы нет (раздел 2.2).</li></ul>\n<div class=\"tablewrap\"><table><thead><tr><th>Сценарий</th><th>Клики</th><th>Конверсия</th><th>Заявки</th><th>Цена заявки</th></tr></thead><tbody><tr><td data-label=\"Сценарий\">Пессимистичный (дорогой клик $1, страница слабая)</td><td data-label=\"Клики\">~100</td><td data-label=\"Конверсия\">1,5%</td><td data-label=\"Заявки\">~1–2</td><td data-label=\"Цена заявки\">~$50–65</td></tr><tr><td data-label=\"Сценарий\">Базовый (клик $0,50, спрос ограничивает)</td><td data-label=\"Клики\">~125</td><td data-label=\"Конверсия\">4%</td><td data-label=\"Заявки\">~5</td><td data-label=\"Цена заявки\">~$12–15 (при $60–65 фактического расхода)</td></tr><tr><td data-label=\"Сценарий\">Оптимистичный (клик $0,35)</td><td data-label=\"Клики\">~180</td><td data-label=\"Конверсия\">7%</td><td data-label=\"Заявки\">~12</td><td data-label=\"Цена заявки\">~$5–8</td></tr></tbody></table></div>\n<p>Это иллюстрация на допущениях, а не прогноз. Фактические значения даст первая неделя.</p>\n<h4 id=\"82-достаточно-ли-выборки\">8.2. Достаточно ли выборки</h4>\n<p>Около 125 кликов: если реальная конверсия страницы ≥3%, шанс получить ноль заявок равен <code>0,97^125 ≈ 2%</code>. Поэтому правило: <strong>125 кликов без единой заявки означает, что сломано что-то одно из трёх — трекинг, страница или оффер</strong>, а не «реклама не работает». На 125 кликах нельзя сравнивать две формулировки заголовков (нужны сотни кликов) и нельзя включать автостратегии.</p>\n<h4 id=\"83-окупаемость-проверить-владельцу\">8.3. Окупаемость (проверить владельцу)</h4>\n<p>Допустимая цена заявки = маржа с заказа × доля заявок, которые превращаются в сделку. Пример с условными числами: маржа с монтажа 600 BYN (около $185), в сделку идёт каждая третья заявка: допустимая цена заявки ≈ $60. Даже пессимистичный сценарий окупается при удачной сделке. Ваши реальные цифры возьмите из главы 15 руководства (юнит-экономика) и подставьте.</p>\n<h4 id=\"84-три-условия\">8.4. Три условия</h4>\n<ol><li><strong>До старта закрыть блокеры из раздела 3.</strong> Иначе до 40% бюджета теряется на обрывах, а оставшиеся клики приходят на сайт с открытым паролем и демо-ценами.</li><li><strong>Только A+B, без размазывания.</strong> Манипулятор, кессон и Пинск — после первых данных.</li><li><strong>Заранее зафиксировать правила решений</strong> (чтобы не гадать в конце): на 7-й день чистим минус-слова; на 14-й смотрим CTR и поисковые запросы; на 21-й, если заявки есть при цене ≤ допустимой, добавляем бюджет ($5–7 в сутки) и этап 2; если 100+ кликов и ноль заявок, останавливаем и чиним страницу и трекинг, а не поднимаем бюджет.</li></ol>\n<h4 id=\"85-альтернативы-за-те-же-деньги\">8.5. Альтернативы за те же деньги</h4>\n<ul><li><strong>Бесплатно или почти даром, но быстрее и надёжнее:</strong> подтвердить карточку Google Business Profile, запросить отзывы у 5–10 прежних клиентов в Google, создать карточку Яндекс Бизнеса (как заработает сервис). Это рычаги локального поиска с низким CPA, и они работают на рекламу тоже (рейтинг, звёзды).</li><li><strong>Яндекс.Директ</strong> — когда сервис восстановится: у сайта там основная доля трафика, а клики по запросам «кольца канализационные купить в бресте» уже конвертируются.</li><li><strong>Не стоит:</strong> менять бюджет после трёх дней, подключать Медийную сеть и Performance Max «на пробу» — на $100 они не обучатся.</li></ul>\n<hr>\n<h3 id=\"9-что-я-не-смог-проверить-честно\">9. Что я не смог проверить (честно)</h3>\n<ul><li>Реальные цены клика и объём запросов в Google Ads (нужен Планировщик ключевых слов).</li><li>Поведение событий GA4 в реальном времени (нужен DebugView и ваш аккаунт).</li><li>Содержимое тикета в hoster.by и ответ хостинга.</li><li>Фактическую причину Paid Search 22.10: выводы по косвенным признакам, окончательный ответ даст отчёт «Целевая страница + строка запроса» за эту дату (раздел 7).</li><li>Конкуренцию в аукционе по Бресту: без доступа к кабинету только предположения.</li></ul>", "text": "Дата: 26.10.2026 · Сайт: https://kanalizacia-brest.by · Период данных: GSC 13.08–24.10.2026 (73 дня), GA4 28.07–25.10.2026 (90 дней), GA4 за 19–25.10, Яндекс Вебмастер 06.09–06.10 (прошлая выгрузка), код темы и seed-файлы в репозитории, живой прод (проверки 26.10.2026). 1. Короткий вывод Запускать Google Ads на $100 имеет смысл, но не сегодня. Три вещи сжигают бюджет до первого клика: обрывы TLS (сегодня 12 из 30 запросов, 40%), публично доступные пароли и токен на проде, и не подтверждённые цены (в прайсе на проде стоит priceStatus: demo ). Пока это не исправлено, из $100 примерно $40 уйдёт на клики, которые не откроют сайт. Стратегия: одна узкая кампания вместо трёх. Первый этап: A (монтаж под ключ, 65% бюджета) и B (кольца ЖБИ, 35%). Манипулятор (C) переносится на второй этап: на $3,5 в день три кампании дадут по 1–2 клика в сутки, и вывод из них сделать будет нельзя. $100 на 4 недели достаточно, чтобы проверить гипотезу, но не чтобы оптимизировать. Это «плата за данные»: цена клика, CTR, качество поисковых запросов, первые 3–10 заявок. Узким местом будет не бюджет, а объём запросов в Бресте. Новые страницы не блокируют запуск. Рекламу можно запустить на существующих страницах, а новые (цена, септик, доборы) делать параллельно. Порядок и готовые ТЗ для AI-агентов в разделе 5. Paid Search 22.10 — это не реклама. Кампании нет, расхода нет. Самое вероятное объяснение: технические заходы по ссылкам с utm_medium=cpc или gclid (проверка рендера Google, тест ссылок). Как проверить за 2 минуты: раздел 7. Ссылки в HTML-руководстве: 15 относительных ссылок на .md и .csv не открываются из одного файла. Внешние 11 ссылок живые. Ссылка adwords-handb.vercel.app/GOOGLE-ADS-CAMPAIGN-PLAN.md сейчас отдаёт 404. Исправлено: план, ключи, объявления и UTM встроены в HTML (раздел 6). 2. Что показывают данные 2.1. Google Search Console (73 дня) Показатель Значение Показы / клики / CTR 467 / 17 / 3,6% (по таблице страниц: 533 / 18) Средняя позиция 9,45 Беларусь 414 показов, 17 кликов, 4,1%. Россия 29 показов, 0 кликов Устройства Мобильные 76% показов (356), ПК 23%, планшеты 1% Динамика показов 13.08–09.09: 130; 10.09–07.10: 133; 08.10–24.10 (17 дней): 204 Последние 14 дней против предыдущих 14 179 против 97 показов (почти ×2) Что это значит: Спрос растёт к осени. Показы выросли почти вдвое за октябрь. Это сезон «пока земля не промёрзла». Окно для рекламы открыто сейчас, но не бесконечно. Две трети показов приходится на информационные страницы (блог и FAQ: 368 из 533 показов), но дают они всего 5 из 18 кликов. Коммерческие страницы: 165 показов и 13 кликов (CTR около 8%). Для рекламы это важно: органика по информационным темам трафик даёт, по коммерческим слабо. Главные коммерческие запросы стоят на 2–4 странице: «канализация под ключ» (15 показов, позиция 12,7), «канализация под ключ брест» (позиция 32), «монтаж канализации под ключ» (позиция 50). Органика по ядру в ближайшие месяцы не заработает, поэтому реклама по этим словам обоснована. Статья про уклон трубы ( /blog/uklon-kanalizacionnoj-truby/ ): 174 показа, 0 кликов, позиция 9,4. Это самая большая «потерянная» точка: сниппет не цепляет. Но трафик информационный, заявок из него ждать не стоит. Запросы, которых у нас нет как товара: «кольца для септика пластиковые», «кольца для колодца пластиковые». Люди ищут пластик, мы продаём бетон. Это минус-слова для рекламы, а не повод для страницы. Запросы вне услуг: «откачка канализации брест» (позиция 64). Услуги нет, в рекламе минусовать. 2.2. GA4 (90 дней): очищаем от шума Показатель Значение Пользователей всего (по каналам) 518 Direct 316, из них 146 из дата-центров (Council Bluffs, Ashburn, Boardman, Moers) Реальные люди (без дата-центров) около 370 за 90 дней, то есть 4 в день Organic Search 173 (Яндекс и Google вместе), 140 из Беларуси, из них Брест 69 Referral 26 Paid Search 3 (все 22.10, город (not set) , вовлечённость 0) Ключевые события 0 на всех страницах за весь период Выводы: Конверсии за 90 дней не измерены. Ноль в колонке «Ключевые события» не значит «заявок не было», а значит «события не были отмечены ключевыми до 22.10». Базовой конверсии сайта у нас нет, поэтому прогноз результата рекламы ниже сделан по отраслевым ориентирам и помечен как оценка. Воронка сайта узкая. Главная: 509 просмотров, 370 пользователей. В платные услуги дошли: монтаж под ключ 40 пользователей, каталог 54, контакты 15. То есть около 11% посетителей главной видят основную услугу . Это точка роста: сильнее связать главную с флагманом (баннер, якорная ссылка, меню). Лучшее время взаимодействия у страницы «Монтаж под ключ»: 200 секунд на пользователя. Контент работает, до него просто мало кто доходит. Блог про кессон «своими руками»: 47 пользователей, 90 секунд, 0 событий. Аудитория в основном из России и «самоделкины» (по Яндексу из 919 показов статьи лишь 22 белорусские). Для рекламы не использовать, на странице добавить блок «заказать под ключ». Служебные адреса видны в GA4: /wp-content/themes/taranenkotheme/creds/project_creds.json (3 просмотра) и /creds/ . Это та же проблема, что в разделе 3.1. 2.3. Яндекс Вебмастер (выгрузка 06.09–06.10, из прошлого анализа) Яндекс остаётся главным источником людей (около 53% пользователей по GA4 за тот период). Самые «денежные» запросы там: «кольца канализационные купить в бресте» (11 кликов на 142 показа в 14 дней), «канализация брест» (5 кликов на 7 показов, позиция 1,3), «доборные кольца под люк», «манипулятор в бресте услуги». Яндекс.Директ сейчас недоступен из-за сбоя сервисов; вернуться к нему нужно сразу после восстановления. Метрика на проде уже подключена (счётчик 113740349, проверено 26.10). 3. Что мешает запуску прямо сейчас (блокеры) 3.1. 🔴 Секреты на проде не закрыты (проверено 26.10.2026) В AUDIT-REPORT.md пункты A3 и A4 помечены «выполнено со слов владельца». Фактическая проверка сегодня: Адрес Ответ прода /wp-content/themes/taranenkotheme/creds/project_creds.json 200 , JSON с ключами: логин и пароль WordPress, токен и chat_id Telegram-бота, GA4_ID /wp-json/wp/v2/users 200, публично отдаёт список пользователей (в паре с логином из файла выше это готовый вход в админку) /wp-content/themes/taranenkotheme/README.md , package.json , seed/company.json , docs/general/03-seo-strategiya.md , prototype/kontakty.html 200 (внутренняя документация, SEO-стратегия, реквизиты ИП) Файл creds/ в git не отслеживается (в истории коммитов его нет), то есть он лежит только на хостинге. Что сделать сегодня , до любых платных кликов: Удалить creds/project_creds.json с хостинга (по FTP или файловому менеджеру). Убрать запасное чтение этого файла из mu-plugins/tb-core/forms.php (около строки 282). Сменить пароль администратора WordPress и перевыпустить токен Telegram-бота (через @BotFather: /revoke ). Считать их скомпрометированными: файл был в открытом доступе с августа 2026 (дата файла 06.08), а GA4 фиксирует заходы на этот адрес. Закрыть директории темы от прямого доступа ( creds/ , docs/ , seed/ , prototype/ , tools/ , tests/ , scripts/ , psi-reports/ , test-results/ , node_modules/ , README.md , package*.json ): правило в .htaccess или в конфиге nginx (зависит от хостинга, уточнить у hoster.by). Не просить это у AI-агента «на глаз», а проверить после curl -I на каждый адрес: ожидаем 403 или 404. Закрыть /wp-json/wp/v2/users для анонимов (плагин безопасности или фильтр rest_endpoints ) и убедиться, что логин администратора не равен автору записей. Реклама привлекает внимание, в том числе ботов-сканеров. Запускать её на сайте с открытым паролем администратора нельзя. 3.2. 🔴 Обрывы TLS Повторный замер сегодня: 30 запросов к /robots.txt , 18 успешно, 12 обрывов (40%) . Те же цифры, что 22.10 (20–43%). Ответа хостинга по тикету из SUPPORT-REQUEST-hoster-adsbot-tls.md нет в материалах. Google Ads списывает деньги за клик до загрузки вашей страницы, поэтому оборванное соединение — это оплаченный и потерянный клик. На $100 это около $40 потерь. Критерий допуска к запуску: не более 1–2% обрывов на серии из 100 запросов и письменное подтверждение допуска AdsBot. Если хостинг не решает вопрос за 3–5 дней, перенос сайта на другой хостинг дешевле, чем реклама поверх него. 3.3. 🟠 Цены на сайте со статусом «demo» В прайсе на проде ( tb-pricebook ) у всех позиций priceStatus: demo , при этом цифры выводятся пользователю (например, кольцо 1 м, монтаж «от 280», доставка 200 руб до 30 км). В объявлениях мы пишем «200 руб до 30 км». Если это не реальные цены, реклама нарушает политику Google о недостоверной информации, а клиенты придут за ценой, которой нет. До запуска владелец подтверждает каждую цифру из объявлений и переводит статус из demo в рабочий. 3.4. 🟠 Измерение: сквозная проверка Метрика подключена, события GA4 помечены ключевыми 22.10. Не проверено, что: (а) клик по телефону и Telegram реально приходит как событие в Google Ads после импорта; (б) gtag грузится через 2,5 секунды после загрузки или при взаимодействии, поэтому быстрый уход с сайта в GA4 не виден; (в) звонки набором вручную не учитываются. До запуска: тестовый заход по ссылке ?gclid=TEST не от имени администратора, затем DebugView, затем запись в таблицу «откуда узнали». 4. Стратегия и план рекламной кампании (что изменилось в v2) Полный текст — в handbooks/adwords/GOOGLE-ADS-CAMPAIGN-PLAN.md (в HTML: Часть VII, «План кампании v2»). Ключевые решения: Вопрос Было (22.10) Стало (26.10) Почему Кампании на старте A 50%, B 30%, C 20% A 65%, B 35%. C (манипулятор), D, E — этап 2 На $3,5 в сутки три кампании не набирают статистику Дневной бюджет задаёт владелец $3,5 в сутки суммарно (A $2,3, B $1,2). Google может потратить до 2× за день, но не больше суточный × 30,4 в месяц Потолок $100 за месяц Посадочная для группы «Септик» та же, что у «Канализации под ключ» /montazh-kanalizacii-pod-klyuch/#systems сразу; отдельная страница /septik-pod-klyuch-brest/ после этапа P2 Нулевая стоимость разработки, лучше релевантность объявления Ставки ручные или максимум кликов Максимум кликов с лимитом CPC $0,80 (или ручные), автостратегии не включать Менее 30 конверсий Соответствие фраза и точное то же, плюс ежедневный просмотр поисковых запросов первые 7 дней Малый объём, любой мусорный запрос заметен Условия запуска 6 пунктов 9 пунктов , добавлены безопасность, цены demo и тест конверсий Раздел 3 Критерий остановки 100+ кликов на группу ~125 кликов на кампанию без единой заявки = сломан трекинг, страница или оффер (при реальной конверсии ≥3% шанс нуля ≈2%) Статистика (раздел 8) Дополнительно: расписание Пн–Сб оставить (как решил владелец), на ночь 23:00–07:00 пост  пароль, токен, htaccess/nginx, запрос в hoster.by повторно, подтверждение цен 28–30.10 P1: главная, sticky-кнопки, блоки в блоге, title «уклона». Тест событий 30.10–02.11 Повторный замер TLS (100 запросов). Если ≤2% и допуск AdsBot: старт Google Ads (кампании A и B) 02–15.11 P2: страница цены, страница септика. Подключить к группам рекламы после индексации 15–30.11 Решение по бюджету, этапу 2 (манипулятор Пинск/Барановичи, кессон), доборы P3 6. Проверка ссылок в HTML-руководстве ( analytics_data/html/index.html ) Файл — одностраничник: весь текст зашит в объект PAYLOAD , страницы показываются по #/id . Проверены все href во всех 28 главах. Тип Количество Результат Внутренние #/… (на главы и разделы) все Ошибок нет Внешние https://… 11 Все отвечают 200 (devby.io, ilex.by ×2, pravo.by, skillshop.withgoogle.com, support.google.com ×2, trashbox.ru, vc.ru, yandex.ru ×2) Относительные файлы ( GOOGLE-ADS-CAMPAIGN-PLAN.md , google-ads-keywords.csv , google-ads-ads.csv , UTM-LINKS.md ) 15 ссылок в 11 главах Битые: из одного HTML-файла они не открываются, а на adwords-handb.vercel.app файла нет https://adwords-handb.vercel.app/GOOGLE-ADS-CAMPAIGN-PLAN.md — 404 (корень сайта работает, файла .md нет). Браузер не показывает .md как страницу даже если файл есть: он его скачивает Исправлено в обновлённом файле: все 15 ссылок ведут на встроенные главы Части VII ( #/plan , #/kw , #/ads , #/utm ). Плюс в главу plan добавлены полные таблицы ключей и объявлений с кнопками «Скачать CSV», так что отдельные файлы больше не нужны. 7. Откуда Paid Search 22.10.2026 Факты: В GA4 за 19–25.10: Paid Search только 22.10, 3 новых пользователя, город (not set) , вовлечённость 0, по 3 события на пользователя (это first_visit , session_start , page_view ). Ни скролла, ни кликов. В выгрузке за 06.09–06.10 канала Paid Search нет совсем. Кампания в Google Ads не создана, расхода нет. Яндекс.Директ не запускался (сервисы недоступны). 22.10 — день, когда создали UTM-ссылки ( UTM-LINKS.md , шаблоны с utm_medium=cpc , utm_source=google и yandex ), руководство и план Google Ads, а в плане описан тест ?gclid=TEST . Также 22.10 в 12:58 запускалась «Проверка URL» в Search Console. Как GA4 присваивает Paid Search: канал «Paid Search» ставится, когда utm_medium похож на cpc , ppc или paid* и источник — поисковая система ( google , yandex ), либо когда в адресе есть gclid при привязке Google Ads. Достаточно ссылки с ?utm_source=google&utm_medium=cpc , открытой хоть кем-то, чтобы получить такую запись. Вероятные причины, от более к менее правдоподобной: Технические заходы по тестовым ссылкам (проверка меток, рендер страницы агентом или инструментом, ваш тест ?gclid=TEST с VPN или приватным режимом). Признак: (not set) в городе, нулевое взаимодействие, по 3 события. Проверка Google (Inspection Tool рендерит страницу и исполняет JS; роботы Google Ads проверяют целевые страницы при создании объявлений). Признаки те же. В списках Google такие запросы приходят из дата-центров, там геолокации нет. Кто-то нажал на ссылку с cpc-метками , опубликованную в карточке или объявлении (по документу UTM ссылки в Kufar и карточки ещё не размещались, так что маловероятно). Реальных кликов по рекламе не было: расхода нет. Проверка за 2 минуты (GA4): Отчёты → Привлечение → Привлечение трафика → фильтр «Группа каналов по умолчанию = Paid Search», дата 22.10, вторичное измерение «Целевая страница + строка запроса» и «Источник/канал сеанса». Если в строке запроса gclid=TEST или utm_campaign=ads_montazh / direct_montazh — это ваши тестовые ссылки. Если источник google / cpc без меток — это инспекция Google. В Google Ads → Кампании должно быть пусто, в «Оплате» нет списаний. Что сделать, чтобы это не портило отчёты после запуска: отдельная фильтрация тестов (по utm_campaign=test ), включить в GA4 «Внутренний трафик» для вашего IP, в Google Ads всё размечать автотеггингом и суффиксом из плана, а в отчётах отбирать Paid Search по campaign_id реальных кампаний. 8. Оценка решения «$100 на 3–4 недели» Вердикт: разумно как тест гипотезы, при трёх условиях. Это не бюджет на получение клиентов, а плата за информацию: понять цену клика, качество запросов, долю заявок и работоспособность связки «реклама → сайт → событие». 8.1. Арифметика $100 / 28 дней = $3,57 в сутки . Google тратит не больше суточного бюджета × 30,4 в месяц. Поставить $3,3 в сутки суммарно (A $2,2, B $1,1). Включить предоплату и не пополнять свыше $100. Цена клика: предполагаем $0,25–0,80 (это допущение: проверить в Планировщике ключевых слов, я его не вижу). Спрос — главное ограничение, не бюджет. Сайт получил 467 органических показов за 73 дня; реальный поисковый спрос выше (нас видят не все), но Брест и 35 км вокруг — малый рынок. Оценка: на ядро A+B уместится 60–200 кликов в месяц . $100 будет потрачен полностью только при высоких ставках. Конверсия клика в заявку или звонок: ориентир для местных услуг 3–8% (если страница и оффер нормальные). У нас базы нет (раздел 2.2). Сценарий Клики Конверсия Заявки Цена заявки Пессимистичный (дорогой клик $1, страница слабая) ~100 1,5% ~1–2 ~$50–65 Базовый (клик $0,50, спрос ограничивает) ~125 4% ~5 ~$12–15 (при $60–65 фактического расхода) Оптимистичный (клик $0,35) ~180 7% ~12 ~$5–8 Это иллюстрация на допущениях, а не прогноз. Фактические значения даст первая неделя. 8.2. Достаточно ли выборки Около 125 кликов: если реальная конверсия страницы ≥3%, шанс получить ноль заявок равен 0,97^125 ≈ 2% . Поэтому правило: 125 кликов без единой заявки означает, что сломано что-то одно из трёх — трекинг, страница или оффер , а не «реклама не работает». На 125 кликах нельзя сравнивать две формулировки заголовков (нужны сотни кликов) и нельзя включать автостратегии. 8.3. Окупаемость (проверить владельцу) Допустимая цена заявки = маржа с заказа × доля заявок, которые превращаются в сделку. Пример с условными числами: маржа с монтажа 600 BYN (около $185), в сделку идёт каждая третья заявка: допустимая цена заявки ≈ $60. Даже пессимистичный сценарий окупается при удачной сделке. Ваши реальные цифры возьмите из главы 15 руководства (юнит-экономика) и подставьте. 8.4. Три условия До старта закрыть блокеры из раздела 3. Иначе до 40% бюджета теряется на обрывах, а оставшиеся клики приходят на сайт с открытым паролем и демо-ценами. Только A+B, без размазывания. Манипулятор, кессон и Пинск — после первых данных. Заранее зафиксировать правила решений (чтобы не гадать в конце): на 7-й день чистим минус-слова; на 14-й смотрим CTR и поисковые запросы; на 21-й, если заявки есть при цене ≤ допустимой, добавляем бюджет ($5–7 в сутки) и этап 2; если 100+ кликов и ноль заявок, останавливаем и чиним страницу и трекинг, а не поднимаем бюджет. 8.5. Альтернативы за те же деньги Бесплатно или почти даром, но быстрее и надёжнее: подтвердить карточку Google Business Profile, запросить отзывы у 5–10 прежних клиентов в Google, создать карточку Яндекс Бизнеса (как заработает сервис). Это рычаги локального поиска с низким CPA, и они работают на рекламу тоже (рейтинг, звёзды). Яндекс.Директ — когда сервис восстановится: у сайта там основная доля трафика, а клики по запросам «кольца канализационные купить в бресте» уже конвертируются. Не стоит: менять бюджет после трёх дней, подключать Медийную сеть и Performance Max «на пробу» — на $100 они не обучатся. 9. Что я не смог проверить (честно) Реальные цены клика и объём запросов в Google Ads (нужен Планировщик ключевых слов). Поведение событий GA4 в реальном времени (нужен DebugView и ваш аккаунт). Содержимое тикета в hoster.by и ответ хостинга. Фактическую причину Paid Search 22.10: выводы по косвенным признакам, окончательный ответ даст отчёт «Целевая страница + строка запроса» за эту дату (раздел 7). Конкуренцию в аукционе по Бресту: без доступа к кабинету только предположения.", "toc": [["1-короткий-вывод", "1. Короткий вывод"], ["2-что-показывают-данные", "2. Что показывают данные"], ["3-что-мешает-запуску-прямо-сейчас-блокеры", "3. Что мешает запуску прямо сейчас (блокеры)"], ["4-стратегия-и-план-рекламной-кампании-что-изменилось-в-v2", "4. Стратегия и план рекламной кампании (что изменилось в v2)"], ["5-страницы-сайта-что-добавить-и-изменить", "5. Страницы сайта: что добавить и изменить"], ["6-проверка-ссылок-в-html-руководстве-analytics-datahtmlindexhtml", "6. Проверка ссылок в HTML-руководстве (analytics_data/html/index.html)"], ["7-откуда-paid-search-22102026", "7. Откуда Paid Search 22.10.2026"], ["8-оценка-решения-100-на-34-недели", "8. Оценка решения «$100 на 3–4 недели»"], ["9-что-я-не-смог-проверить-честно", "9. Что я не смог проверить (честно)"]]}, {"id": "plan", "num": "25", "title": "План кампании Google Ads для вашего сайта (версия 2)", "full": "25. План кампании Google Ads для вашего сайта (версия 2)", "part": "Часть VII. Ваш проект: стратегия и план (обновлено 26.10.2026)", "html": "<p><strong>Версия 2 от 26.10.2026</strong> (первая версия 22.10.2026) · <strong>Сайт:</strong> <code>https://kanalizacia-brest.by</code> · <strong>Сервис:</strong> Google Ads (рекламная сеть Google, бывший AdWords). AdSense не используется. <strong>Файлы для копирования:</strong> <a href=\"#/kw\">google-ads-keywords.csv</a> (ключевые слова с типами соответствия и посадочными), <a href=\"#/ads\">google-ads-ads.csv</a> (адаптивные объявления: заголовки и описания).</p>\n<blockquote><p><strong>Что изменилось в версии 2 (26.10.2026), по итогам анализа GSC за 73 дня, GA4 за 90 дней и проверки прода:</strong></p>\n<ol><li><strong>Этап 1 сужен до двух кампаний: A (монтаж, 65%) и B (кольца, 35%).</strong> Манипулятор (C) переносится на этап 2: на $3,5 в сутки три кампании не набирают статистику.</li><li><strong>Бюджет $100 на 4 недели ≈ $3,3 в сутки суммарно</strong> (A $2,2, B $1,1), предоплата без автопополнения. Подробная оценка: <code>RESEARCH-2026-10-26.md</code>, раздел 8.</li><li><strong>Три новых условия запуска:</strong> закрыть публичные секреты на проде, подтвердить цены (в прайсе стоит <code>demo</code>), пройти сквозной тест конверсий.</li><li><strong>Группа «Септик» ведёт на <code>/montazh-kanalizacii-pod-klyuch/#systems</code></strong>, пока нет отдельной страницы <code>/septik-pod-klyuch-brest/</code>.</li><li><strong>Критерий остановки пересчитан:</strong> ~125 кликов на кампанию без единой заявки = сломан трекинг, страница или оффер.</li><li>Повторный замер TLS 26.10: <strong>12 обрывов из 30 запросов (40%)</strong>: запуск по-прежнему заблокирован.</li></ol></blockquote>\n<hr>\n<h3 id=\"1-статус-что-должно-быть-сделано-до-запуска\">1. Статус: что должно быть сделано до запуска</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>#</th><th>Условие</th><th>Статус</th></tr></thead><tbody><tr><td data-label=\"#\">1</td><td data-label=\"Условие\">Оплата и доступность Google Ads из Беларуси</td><td data-label=\"Статус\">✅ проверено владельцем</td></tr><tr><td data-label=\"#\">2</td><td data-label=\"Условие\">Обрывы TLS на хостинге (26.10: 12 из 30 запросов, 40%)</td><td data-label=\"Статус\">❌ обращение отправлено 22.10, ответа нет</td></tr><tr><td data-label=\"#\">3</td><td data-label=\"Условие\"><code>AdsBot-Google</code> и <code>AdsBot-Google-Mobile</code> допущены хостингом</td><td data-label=\"Статус\">⏳ в том же обращении</td></tr><tr><td data-label=\"#\">4</td><td data-label=\"Условие\">Исправления сайта на проде (Telegram-кнопки, тексты, график, блок про Пинск)</td><td data-label=\"Статус\">⏳ деплой</td></tr><tr><td data-label=\"#\">5</td><td data-label=\"Условие\">Конверсии: GA4 связан с Google Ads, импортированы 3 события</td><td data-label=\"Статус\">⏳ после создания аккаунта</td></tr><tr><td data-label=\"#\">6</td><td data-label=\"Условие\">Таблица «откуда узнали» для звонков</td><td data-label=\"Статус\">⏳ владелец</td></tr><tr><td data-label=\"#\">7</td><td data-label=\"Условие\"><strong>Секреты на проде закрыты</strong> (файл <code>creds/project_creds.json</code> отдаёт 200 с паролем WP и токеном бота; пароль сменить, токен перевыпустить)</td><td data-label=\"Статус\">❌ проверено 26.10: открыт</td></tr><tr><td data-label=\"#\">8</td><td data-label=\"Условие\"><strong>Цены подтверждены</strong> (в прайсе на проде <code>priceStatus: demo</code>; в объявлениях «200 руб до 30 км»)</td><td data-label=\"Статус\">❌ владелец</td></tr><tr><td data-label=\"#\">9</td><td data-label=\"Условие\"><strong>Сквозной тест конверсий</strong> (<code>click_phone</code>, <code>click_telegram</code>, <code>generate_lead</code> в GA4 DebugView, затем в Google Ads)</td><td data-label=\"Статус\">⏳ до запуска</td></tr></tbody></table></div>\n<p><strong>Не запускать платный трафик, пока не выполнены 2–4 и 7–9</strong>: каждый оборванный клик оплачен и потерян.</p>\n<hr>\n<h3 id=\"2-цели-и-ожидания\">2. Цели и ожидания</h3>\n<ul><li><strong>Главная цель:</strong> заявки и звонки с сайта (событие <code>generate_lead</code>, клик по телефону <code>click_phone</code>, клик по Telegram <code>click_telegram</code>).</li><li><strong>Объём небольшой.</strong> В Беларуси спрос по Яндексу на «канализация под ключ» всего 35 запросов за 14 дней, в Google, вероятно, меньше. Ожидайте десятки кликов в неделю на ядро, а не сотни.</li><li><strong>Первые 2–3 недели — тест:</strong> собрать данные о ключевых словах, CTR и конверсиях, затем решать о бюджете. Автоматические стратегии (максимум конверсий) включать только после 15–30 конверсий.</li><li><strong>Бюджет владельца: $100 на 3–4 недели</strong> (≈ $3,3–3,5 в сутки). Это тест гипотезы, а не план получения N клиентов: ограничением будет объём запросов в Бресте, а не деньги. Оценка и сценарии: <code>RESEARCH-2026-10-26.md</code>, раздел 8. Для оценки конверсии нужно 30–50 кликов на каждую услугу; реальные цены клика покажет «Планировщик ключевых слов» в кабинете (я их не вижу).</li></ul>\n<hr>\n<h3 id=\"3-структура-кампаний\">3. Структура кампаний</h3>\n<p>Тип: <strong>Поисковая сеть</strong> (Search), без Медийной сети и без партнёров по поиску (отключить обе галочки). Языки: русский (и белорусский, если хотите охватить). Распределение бюджета по вашему приоритету услуг.</p>\n<div class=\"tablewrap\"><table><thead><tr><th>Кампания</th><th>Что рекламируем</th><th>Доля бюджета</th><th>Гео</th><th>Этап</th></tr></thead><tbody><tr><td data-label=\"Кампания\">A. Монтаж под ключ</td><td data-label=\"Что рекламируем\">Монтаж канализации и септика под ключ (услуга №1)</td><td data-label=\"Доля бюджета\">65% (≈ $2,2 в сутки)</td><td data-label=\"Гео\">Брест и окрестности (для старта радиус около 35 км, уточните по зоне выезда)</td><td data-label=\"Этап\">запуск</td></tr><tr><td data-label=\"Кампания\">B. Кольца ЖБИ</td><td data-label=\"Что рекламируем\">Кольца ЖБИ и комплектующие (услуга №2)</td><td data-label=\"Доля бюджета\">35% (≈ $1,1 в сутки)</td><td data-label=\"Гео\">Брест и окрестности (для старта радиус около 35 км, уточните по зоне выезда)</td><td data-label=\"Этап\">запуск</td></tr><tr><td data-label=\"Кампания\">C. Манипулятор Брест</td><td data-label=\"Что рекламируем\">Манипулятор в Бресте (услуга №3)</td><td data-label=\"Доля бюджета\">после результатов A–B</td><td data-label=\"Гео\">Брест и окрестности (радиус около 35 км)</td><td data-label=\"Этап\"><strong>этап 2</strong> (перенесён: на $3,5 в сутки статистики не будет)</td></tr><tr><td data-label=\"Кампания\">D. Манипулятор Пинск и Барановичи</td><td data-label=\"Что рекламируем\">Манипулятор в Пинске и Барановичах</td><td data-label=\"Доля бюджета\">после результатов A–C</td><td data-label=\"Гео\">Пинск, Барановичи</td><td data-label=\"Этап\">позже</td></tr><tr><td data-label=\"Кампания\">E. Кессоны</td><td data-label=\"Что рекламируем\">Кессоны (услуга №4)</td><td data-label=\"Доля бюджета\">после результатов A–C</td><td data-label=\"Гео\">Брест + Брестский район</td><td data-label=\"Этап\">позже</td></tr></tbody></table></div>\n<p>Этап 1: кампании A и B. Этап 2: C, D и E после первых результатов (D требует отдельного гео, поэтому это отдельная кампания).</p>\n<h4 id=\"посадочные-страницы\">Посадочные страницы</h4>\n<div class=\"tablewrap\"><table><thead><tr><th>Группа объявлений</th><th>Страница</th></tr></thead><tbody><tr><td data-label=\"Группа объявлений\">A / Канализация под ключ</td><td data-label=\"Страница\"><code>https://kanalizacia-brest.by/montazh-kanalizacii-pod-klyuch/</code></td></tr><tr><td data-label=\"Группа объявлений\">A / Септик</td><td data-label=\"Страница\"><code>https://kanalizacia-brest.by/montazh-kanalizacii-pod-klyuch/#systems</code> (позже <code>/septik-pod-klyuch-brest/</code>, когда появится)</td></tr><tr><td data-label=\"Группа объявлений\">B / Кольца ЖБИ купить</td><td data-label=\"Страница\"><code>https://kanalizacia-brest.by/katalog/koltsa-zhbi/</code></td></tr><tr><td data-label=\"Группа объявлений\">B / Доборы и комплектующие</td><td data-label=\"Страница\"><code>https://kanalizacia-brest.by/katalog/</code></td></tr><tr><td data-label=\"Группа объявлений\">C / Манипулятор Брест</td><td data-label=\"Страница\"><code>https://kanalizacia-brest.by/dostavka-manipulyatorom/</code></td></tr><tr><td data-label=\"Группа объявлений\">D / Манипулятор Пинск Барановичи</td><td data-label=\"Страница\"><code>https://kanalizacia-brest.by/dostavka-manipulyatorom/#baranovichi-pinsk</code></td></tr><tr><td data-label=\"Группа объявлений\">E / Кессон для скважины</td><td data-label=\"Страница\"><code>https://kanalizacia-brest.by/kesson-dlya-skvazhiny/</code></td></tr></tbody></table></div>\n<p>Конкретные страницы выбраны потому, что их H1 и title совпадают с запросами (проверено аудитом). Не отправляйте рекламу на главную: у неё нет совпадения с «кольца» или «манипулятор».</p>\n<hr>\n<h3 id=\"4-настройки-кампаний\">4. Настройки кампаний</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>Параметр</th><th>Значение</th><th>Почему</th></tr></thead><tbody><tr><td data-label=\"Параметр\">Цель кампании</td><td data-label=\"Значение\">«Потенциальные клиенты» (Leads), тип кампании «Поиск», без рекомендованного Google шаблона</td><td data-label=\"Почему\">Подходит для заявок и звонков</td></tr><tr><td data-label=\"Параметр\">Сети</td><td data-label=\"Значение\">Только Поиск Google. <strong>Отключить</strong> «Поисковые партнёры» и Медийную сеть</td><td data-label=\"Почему\">Меньше мусорных кликов</td></tr><tr><td data-label=\"Параметр\">Гео</td><td data-label=\"Значение\">Параметр «<strong>Присутствие</strong>» (люди, находящиеся в регионе), а не «присутствие или интерес»</td><td data-label=\"Почему\">Иначе показ людям из России (в GA4 были Москва и Петербург)</td></tr><tr><td data-label=\"Параметр\">Расписание</td><td data-label=\"Значение\"><strong>Пн–Сб круглосуточно</strong>, воскресенье отключить (или -100% к ставке); ночью 23:00–07:00 ставка −30%</td><td data-label=\"Почему\">Воскресенье выходной; ночью звонок не примут, форма и Telegram работают</td></tr><tr><td data-label=\"Параметр\">Устройства</td><td data-label=\"Значение\">Все; на мобильных обязательно кнопка «Позвонить»</td><td data-label=\"Почему\">78% показов в Google с мобильных</td></tr><tr><td data-label=\"Параметр\">Ставки (старт)</td><td data-label=\"Значение\">«Ручное назначение ставок» или «Максимум кликов» с <strong>ограничением макс. CPC $0,80</strong> (поправить после Планировщика)</td><td data-label=\"Почему\">Конверсий мало, автоматика не обучится</td></tr><tr><td data-label=\"Параметр\">Ставки (позже)</td><td data-label=\"Значение\">«Максимум конверсий» после 15–30 конверсий за 30 дней</td><td data-label=\"Почему\">Автоматика требует данных</td></tr><tr><td data-label=\"Параметр\">Соответствие</td><td data-label=\"Значение\">Только <strong>фраза</strong> и <strong>точное</strong>; широкое не использовать на старте</td><td data-label=\"Почему\">Контроль запросов при малом бюджете</td></tr><tr><td data-label=\"Параметр\">Автотеггинг</td><td data-label=\"Значение\"><strong>Включён</strong> (gclid), GA4 связан с Google Ads</td><td data-label=\"Почему\">Нужен для импорта конверсий и атрибуции</td></tr><tr><td data-label=\"Параметр\">Суффикс конечного URL</td><td data-label=\"Значение\"><code>utm_source=google&amp;utm_medium=cpc&amp;utm_campaign={campaignid}&amp;utm_content={adgroupid}&amp;utm_term={keyword}</code></td><td data-label=\"Почему\">Метки читаются GA4 и Яндекс.Метрикой, совпадают с <a href=\"#/utm\">UTM-LINKS.md</a> (<code>medium=cpc</code>)</td></tr><tr><td data-label=\"Параметр\">Динамические вставки, DSA, Performance Max</td><td data-label=\"Значение\">Не использовать на старте</td><td data-label=\"Почему\">Нужны данные и бюджет</td></tr></tbody></table></div>\n<hr>\n<h3 id=\"5-конверсии\">5. Конверсии</h3>\n<ol><li>В Google Ads: Цели → Конверсии → «Создать» → «Импорт» → <strong>Google Analytics 4</strong>.</li><li>Импортировать только 3 события: <strong><code>generate_lead</code></strong> (основная, заявка с формы), <strong><code>click_phone</code></strong> (основная, звонок), <strong><code>click_telegram</code></strong> (вторичная). Остальные события (<code>lightbox_open</code>, <code>calculator_interact</code>, <code>calc_open</code>, <code>click_cta_form</code>) не импортировать.</li><li>Значения конверсии: если не знаете ценность заявки, оставьте без значений (стратегия «максимум конверсий» будет работать по числу).</li><li>Проверка: открыть сайт по тестовой ссылке рекламы (<code>?gclid=TEST</code>) в обычном окне (не от имени администратора), кликнуть по телефону и по Telegram, убедиться в DebugView GA4, затем через сутки в Google Ads.</li><li><strong>Звонки не через кнопку</strong> (набрали номер вручную) в Google Ads не попадут. Ведите таблицу «откуда узнали» и сверяйте её со статистикой раз в неделю.</li><li>Расширение «Номер телефона» (call asset): <code>+375 29 527-00-00</code>. Отчёт по звонкам из рекламы с номером Google в Беларуси может быть недоступен: проверить в кабинете.</li></ol>\n<hr>\n<h3 id=\"6-ключевые-слова-и-объявления-по-группам\">6. Ключевые слова и объявления по группам</h3>\n<p>Типы соответствия: каждое слово добавляется <strong>в кавычках (фраза)</strong> и <strong>в квадратных скобках (точное)</strong>. Полный список с посадочными: <a href=\"#/kw\">google-ads-keywords.csv</a>. Ключевые слова взяты из реальных запросов Яндекса по Беларуси (файлы <code>yandex_requests_belarus_*.csv</code>) и спроса по услугам.</p>\n<h4 id=\"a-монтаж-под-ключ-канализация-под-ключ\">A. Монтаж под ключ / Канализация под ключ</h4>\n<p><strong>Страница:</strong> <code>https://kanalizacia-brest.by/montazh-kanalizacii-pod-klyuch/</code></p>\n<p><strong>Ключевые слова:</strong> канализация под ключ брест; канализация в частном доме под ключ; монтаж канализации брест; канализация для частного дома брест; канализация в частном доме под ключ цена; устройство канализации в частном доме; автономная канализация для частного дома брест</p>\n<p><strong>Заголовки (до 30 знаков, нужно 8–15):</strong></p>\n<ol><li>Канализация под ключ в Бресте (29)</li><li>Монтаж канализации и септика (28)</li><li>Канализация в частном доме (26)</li><li>Копка, кольца, вывоз грунта (27)</li><li>Выезд на замер бесплатно (24)</li><li>Свой манипулятор и кольца ЖБИ (29)</li><li>Монтаж за 1–3 дня (17)</li><li>Безнал и кредитные средства (27)</li><li>Брест и Брестская область (25)</li><li>Работаем Пн–Сб круглосуточно (28)</li><li>Рассчитайте цену онлайн (23)</li><li>Заказать монтаж канализации (27)</li></ol>\n<p><strong>Описания (до 90 знаков):</strong></p>\n<ol><li>Копка, кольца ЖБИ, монтаж и вывоз грунта одним подрядчиком. Замер бесплатно. (76)</li><li>Свой манипулятор и кольца собственного производства. Монтаж под ключ за 1–3 дня. (80)</li><li>Оплата безналом, подходят кредитные средства на строительство. Брест и область. (79)</li><li>Посчитайте стоимость в калькуляторе или позвоните — назовём вилку сразу. (72)</li></ol>\n<h4 id=\"a-монтаж-под-ключ-септик\">A. Монтаж под ключ / Септик</h4>\n<p><strong>Страница:</strong> <code>https://kanalizacia-brest.by/montazh-kanalizacii-pod-klyuch/</code></p>\n<p><strong>Ключевые слова:</strong> септик для частного дома брест; установка септика брест; септик под ключ брест; септик из бетонных колец брест; установка септика под ключ в бресте; септик в частный дом цена брест</p>\n<p><strong>Заголовки (до 30 знаков, нужно 8–15):</strong></p>\n<ol><li>Септик для частного дома (24)</li><li>Установка септика под ключ (26)</li><li>Септик из колец ЖБИ (19)</li><li>Септик в Бресте и области (25)</li><li>Копка и монтаж за 1–3 дня (25)</li><li>Замер бесплатно (15)</li><li>Свой манипулятор (16)</li><li>Безнал и кредитные средства (27)</li><li>Вывоз грунта включён в смету (28)</li><li>Рассчитайте цену онлайн (23)</li><li>Работаем Пн–Сб круглосуточно (28)</li><li>Заказать септик под ключ (24)</li></ol>\n<p><strong>Описания (до 90 знаков):</strong></p>\n<ol><li>Септик из колец собственного производства: копка, монтаж, вывоз грунта. (71)</li><li>Свой манипулятор и бригада. Монтаж септика под ключ, замер бесплатно. (69)</li><li>Безнал, подходят кредитные средства на строительство. Брест и область. (70)</li><li>Посчитайте стоимость в калькуляторе или позвоните — назовём вилку сразу. (72)</li></ol>\n<h4 id=\"b-кольца-жби-кольца-жби-купить\">B. Кольца ЖБИ / Кольца ЖБИ купить</h4>\n<p><strong>Страница:</strong> <code>https://kanalizacia-brest.by/katalog/koltsa-zhbi/</code></p>\n<p><strong>Ключевые слова:</strong> кольца жби брест; купить канализационные кольца брест; кольца канализационные купить в бресте; кольца для канализации брест цена; бетонные кольца для колодца брест; кольца жби 1.5 м цена; кольцо бетонное 2 м купить брест; кольца для септика брест</p>\n<p><strong>Заголовки (до 30 знаков, нужно 8–15):</strong></p>\n<ol><li>Кольца ЖБИ в Бресте (19)</li><li>Купить канализационные кольца (29)</li><li>Кольца 1, 1,5 и 2 м (19)</li><li>Собственное производство (24)</li><li>Цена без наценки посредника (27)</li><li>Доставка своим манипулятором (28)</li><li>Плиты, дно, люки в комплекте (28)</li><li>Склад в Брестском районе (24)</li><li>Доставка по Бресту и области (28)</li><li>Узнайте наличие и цену (22)</li><li>Работаем Пн–Сб круглосуточно (28)</li><li>Заказать кольца с доставкой (27)</li></ol>\n<p><strong>Описания (до 90 знаков):</strong></p>\n<ol><li>Кольца ЖБИ 1, 1,5 и 2 м собственного производства. Доставка своим манипулятором. (80)</li><li>Цена без наценки посредника. Плиты, дно, опорные кольца и люки к кольцам. (73)</li><li>Склад в Брестском районе. Узнайте наличие и стоимость с доставкой по звонку. (76)</li><li>Можно взять комплектом колодец: кольца, дно, плита перекрытия, люк. (67)</li></ol>\n<h4 id=\"b-кольца-жби-доборы-и-комплектующие\">B. Кольца ЖБИ / Доборы и комплектующие</h4>\n<p><strong>Страница:</strong> <code>https://kanalizacia-brest.by/katalog/</code></p>\n<p><strong>Ключевые слова:</strong> доборные кольца для канализации; доборные кольца под люк брест; добор под канализационный люк; плита перекрытия для колодца брест; опорное кольцо под люк брест; люк полимерный для колодца брест</p>\n<p><strong>Заголовки (до 30 знаков, нужно 8–15):</strong></p>\n<ol><li>Доборные кольца под люк (23)</li><li>Доборы 10–60 см (15)</li><li>Плиты перекрытия для колодца (28)</li><li>Опорные кольца под люк (22)</li><li>Полимерные люки (15)</li><li>Собственное производство (24)</li><li>Доставка по Бресту и области (28)</li><li>Склад в Брестском районе (24)</li><li>Каталог ЖБИ для канализации (27)</li><li>Узнайте наличие и цену (22)</li><li>Работаем Пн–Сб круглосуточно (28)</li><li>Заказать доборы с доставкой (27)</li></ol>\n<p><strong>Описания (до 90 знаков):</strong></p>\n<ol><li>Доборы 10–60 см, опорные кольца, плиты перекрытия и полимерные люки для колодца. (80)</li><li>Кольца и плиты собственного производства. Доставка своим манипулятором. (71)</li><li>Склад в Брестском районе. Наличие и цену скажем по звонку. (58)</li><li>Подберём комплект под диаметр колодца: 1, 1,5 или 2 м. (54)</li></ol>\n<h4 id=\"c-манипулятор-брест-манипулятор-брест\">C. Манипулятор Брест / Манипулятор Брест</h4>\n<p><strong>Страница:</strong> <code>https://kanalizacia-brest.by/dostavka-manipulyatorom/</code></p>\n<p><strong>Ключевые слова:</strong> манипулятор брест; услуги мани
