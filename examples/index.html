dy><tr><td data-label=\"\">Заголовок</td><td data-label=\"Слабое\">«Лучшая канализация в городе!»</td><td data-label=\"Сильное\">«Канализация под ключ в Бресте»</td></tr><tr><td data-label=\"\">Описание</td><td data-label=\"Слабое\">«Мы работаем много лет. Звоните!»</td><td data-label=\"Сильное\">«Копка, кольца ЖБИ, монтаж и вывоз грунта одним подрядчиком. Замер бесплатно.»</td></tr><tr><td data-label=\"\">Проблема</td><td data-label=\"Слабое\">Нет ключа, нет фактов, превосходная степень не подтверждена</td><td data-label=\"Сильное\">Ключ, регион, факты, проверяемо на сайте</td></tr></tbody></table></div>\n<h3 id=\"85-ресурсы-расширения\">8.5 Ресурсы (расширения)</h3>\n<p>Ресурсы увеличивают объявление и CTR:</p>\n<ul><li><strong>Дополнительные ссылки (sitelinks):</strong> «Рассчитать стоимость», «Кольца ЖБИ», «Портфолио».</li><li><strong>Уточнения (callouts):</strong> «Замер бесплатно», «Пн–Сб круглосуточно».</li><li><strong>Структурированные описания:</strong> услуги списком.</li><li><strong>Номер телефона (call asset):</strong> телефон в объявлении. <strong>В тексте объявления телефон писать нельзя.</strong></li><li><strong>Адрес (location):</strong> после подключения Google Business Profile.</li><li><strong>Изображения, цена, бизнес-имя и логотип</strong> по возможности.</li></ul>\n<h3 id=\"86-сила-объявления-ad-strength\">8.6 Сила объявления (Ad Strength)</h3>\n<p>Google оценивает набор от «Плохая» до «Отличная». Это подсказка, а не цель: объявление «Отличное», но с пустыми фразами работает хуже простого и точного. Целевой минимум: «Хорошая». Не закрепляйте (pin) много заголовков: это снижает автоматическую оптимизацию.</p>\n<h3 id=\"87-что-запрещено-политикой\">8.7 Что запрещено политикой</h3>\n<ul><li>Телефон, адрес сайта в тексте.</li><li>Лишняя пунктуация (<code>!!!</code>), слова ЗАГЛАВНЫМИ.</li><li>Недоказуемые превосходные утверждения («лучшие», «№1», «самые дешёвые»).</li><li>Вводящие в заблуждение цены, ложные скидки и условия.</li><li>Тексты, не соответствующие странице.</li></ul>\n<p>Подробнее в главе 22.</p>\n<h3 id=\"88-чек-лист-объявления\">8.8 Чек-лист объявления</h3>\n<ol><li>Ключ из запроса есть минимум в 2 заголовках.</li><li>Регион есть минимум в 1 заголовке.</li><li>Все факты из объявления подтверждены на странице.</li><li>Нет телефона и лишних знаков в тексте.</li><li>Есть призыв к действию.</li><li>Выбрана подходящая страница, а не главная.</li><li>Подключены дополнительные ссылки, уточнения, звонок.</li></ol>\n<h3 id=\"что-сделать-на-вашем-сайте\">Что сделать на вашем сайте</h3>\n<ul><li>Загрузите готовые объявления из <a href=\"#/ads\">google-ads-ads.csv</a>. Их длины уже проверены.</li><li>Перед запуском проверьте каждое утверждение: «200 руб до 30 км», «1–3 дня», «замер бесплатно», «Пн–Сб круглосуточно» (совпадает с сайтом).</li></ul>\n<hr>", "text": " 8.1 Адаптивное поисковое объявление (RSA) Сегодня основной формат это адаптивное поисковое объявление (Responsive Search Ad, RSA) . Вы даёте набор заголовков (до 15, по 30 знаков) и описаний (до 4, по 90 знаков), а Google собирает из них комбинации и учится, какие работают лучше. Поле Лимит Заметки Заголовки от 3 до 15, до 30 знаков Показываются по 2–3 в одной строке Описания от 2 до 4, до 90 знаков Показываются по 1–2 Путь (path) 2 поля по 15 знаков kanalizacia-brest.by/montazh/brest Конечный URL страница сайта Своя для каждой группы Аналогия для программиста. RSA это мультивариантный тест (multi-armed bandit): система сама перебирает комбинации и показывает те, что дают больше кликов и конверсий. 8.2 Формула сильного заголовка Хорошее объявление отвечает на пять вопросов человека: Что это? (ключ из запроса: «канализация под ключ», «кольца ЖБИ», «манипулятор»). Где? (Брест, область). Чем вы лучше / в чём выгода? (замер бесплатно, свой манипулятор, цена без наценки). Что делать дальше? (рассчитать, позвонить, заказать). Как это проверить? (конкретика: «200 руб до 30 км», «за 1–3 дня»). Набор заголовков для одной группы (минимум 10–12): Тип Пример Зачем Ключ Канализация под ключ в Бресте Релевантность запросу Выгода Выезд на замер бесплатно Снимает риск Доказательство Монтаж за 1–3 дня Конкретика Цена/условия Доставка: 200 руб до 30 км Фильтрует нецелевых Доверие Свой манипулятор и кольца ЖБИ Ответ «почему вы» Действие Рассчитайте цену онлайн Призыв Регион Брест и Брестская область Локальность 8.3 Правила хороших описаний Первое предложение повторяет главную выгоду и ключ . Второе предложение даёт конкретику (условия, факты). Последнее: призыв к действию («Позвоните», «Рассчитайте»). Каждое описание самодостаточно : оно может показываться отдельно. 8.4 Разбор: слабое и сильное Слабое Сильное Заголовок «Лучшая канализация в городе!» «Канализация под ключ в Бресте» Описание «Мы работаем много лет. Звоните!» «Копка, кольца ЖБИ, монтаж и вывоз грунта одним подрядчиком. Замер бесплатно.» Проблема Нет ключа, нет фактов, превосходная степень не подтверждена Ключ, регион, факты, проверяемо на сайте 8.5 Ресурсы (расширения) Ресурсы увеличивают объявление и CTR: Дополнительные ссылки (sitelinks): «Рассчитать стоимость», «Кольца ЖБИ», «Портфолио». Уточнения (callouts): «Замер бесплатно», «Пн–Сб круглосуточно». Структурированные описания: услуги списком. Номер телефона (call asset): телефон в объявлении. В тексте объявления телефон писать нельзя. Адрес (location): после подключения Google Business Profile. Изображения, цена, бизнес-имя и логотип по возможности. 8.6 Сила объявления (Ad Strength) Google оценивает набор от «Плохая» до «Отличная». Это подсказка, а не цель: объявление «Отличное», но с пустыми фразами работает хуже простого и точного. Целевой минимум: «Хорошая». Не закрепляйте (pin) много заголовков: это снижает автоматическую оптимизацию. 8.7 Что запрещено политикой Телефон, адрес сайта в тексте. Лишняя пунктуация ( !!! ), слова ЗАГЛАВНЫМИ. Недоказуемые превосходные утверждения («лучшие», «№1», «самые дешёвые»). Вводящие в заблуждение цены, ложные скидки и условия. Тексты, не соответствующие странице. Подробнее в главе 22. 8.8 Чек-лист объявления Ключ из запроса есть минимум в 2 заголовках. Регион есть минимум в 1 заголовке. Все факты из объявления подтверждены на странице. Нет телефона и лишних знаков в тексте. Есть призыв к действию. Выбрана подходящая страница, а не главная. Подключены дополнительные ссылки, уточнения, звонок. Что сделать на вашем сайте Загрузите готовые объявления из google-ads-ads.csv . Их длины уже проверены. Перед запуском проверьте каждое утверждение: «200 руб до 30 км», «1–3 дня», «замер бесплатно», «Пн–Сб круглосуточно» (совпадает с сайтом). ", "toc": [["81-адаптивное-поисковое-объявление-rsa", "8.1 Адаптивное поисковое объявление (RSA)"], ["82-формула-сильного-заголовка", "8.2 Формула сильного заголовка"], ["83-правила-хороших-описаний", "8.3 Правила хороших описаний"], ["84-разбор-слабое-и-сильное", "8.4 Разбор: слабое и сильное"], ["85-ресурсы-расширения", "8.5 Ресурсы (расширения)"], ["86-сила-объявления-ad-strength", "8.6 Сила объявления (Ad Strength)"], ["87-что-запрещено-политикой", "8.7 Что запрещено политикой"], ["88-чек-лист-объявления", "8.8 Чек-лист объявления"], ["что-сделать-на-вашем-сайте", "Что сделать на вашем сайте"]]}, {"id": "ch9", "num": "9", "title": "Посадочная страница, которая конвертирует", "full": "9. Посадочная страница, которая конвертирует", "part": "Часть III. Объявления и страницы", "html": "<p>Объявление приводит человека, а <strong>заявку получает страница</strong>. Поэтому это половина результата.</p>\n<h3 id=\"91-соответствие-запросу-message-match\">9.1 Соответствие запросу (message match)</h3>\n<p>Заголовок страницы повторяет обещание объявления. Человек искал «манипулятор брест», видит «Услуги манипулятора в Бресте», а не общую главную.</p>\n<h3 id=\"92-скорость-и-доступность\">9.2 Скорость и доступность</h3>\n<ul><li>Каждая лишняя секунда загрузки снижает долю дождавшихся, особенно на мобильных.</li><li><strong>Недоступная страница</strong> тратит клик впустую (оплачивается!). Именно поэтому вопрос обрывов TLS на вашем хостинге критичен (глава 19).</li><li>Ваши страницы в лабораторных замерах (Lighthouse PSI, 4G): <strong>99–100 баллов на мобильных, LCP 1,6–2,3 с, CLS 0</strong>. Это сильная основа, но реальные пользователи видят и доступность сервера.</li></ul>\n<h3 id=\"93-мобильность\">9.3 Мобильность</h3>\n<p>78% показов вашего сайта в Google с мобильных. Значит:</p>\n<ul><li>кнопка звонка видна без прокрутки (у вас в шапке и нижняя панель действий);</li><li>кнопки крупные, нет мелкого текста;</li><li>форма короткая: имя и телефон.</li></ul>\n<h3 id=\"94-доверие\">9.4 Доверие</h3>\n<ul><li>реальные фото и портфолио, отзывы (когда появятся), реквизиты ИП и адрес, ясные условия;</li><li>политика конфиденциальности (у вас есть) и согласие в форме.</li></ul>\n<h3 id=\"95-что-делает-человек-на-странице\">9.5 Что делает человек на странице</h3>\n<p>Идеальный путь: <strong>понял предложение → увидел цену или вилку → позвонил или оставил заявку</strong> за 1–2 экрана. Для услуг с высокой ценностью (монтаж) есть ещё калькулятор, он повышает доверие.</p>\n<h3 id=\"96-слабые-места-которые-стоит-проверить-на-вашем-сайте\">9.6 Слабые места, которые стоит проверить на вашем сайте</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>Что</th><th>Почему важно</th><th>Статус</th></tr></thead><tbody><tr><td data-label=\"Что\">Кнопка «Telegram» вела на <code>https://t.me/</code></td><td data-label=\"Почему важно\">Нерабочий клик считался конверсией</td><td data-label=\"Статус\">Исправлено локально, нужен деплой</td></tr><tr><td data-label=\"Что\">Страница услуги и главная получали мало просмотров</td><td data-label=\"Почему важно\">Не всех ведёт дальше</td><td data-label=\"Статус\">Реклама приведёт трафик напрямую</td></tr><tr><td data-label=\"Что\">Нет отзывов на странице <code>/otzyvy/</code></td><td data-label=\"Почему важно\">Низкое доверие</td><td data-label=\"Статус\">Попросить 3–5 клиентов оставить отзыв</td></tr><tr><td data-label=\"Что\">Обрывы TLS на хостинге</td><td data-label=\"Почему важно\">Потеря клика</td><td data-label=\"Статус\">Обращение в hoster.by отправлено</td></tr></tbody></table></div>\n<h3 id=\"97-чек-лист-посадочной-страницы\">9.7 Чек-лист посадочной страницы</h3>\n<ol><li>H1 повторяет ключ группы объявлений.</li><li>Телефон и кнопка Telegram работают, видны на мобильном без прокрутки.</li><li>Есть цена или вилка и условия.</li><li>Есть доказательства: портфолио, отзывы, реквизиты.</li><li>Форма короткая, есть согласие.</li><li>Страница открывается быстро и стабильно.</li><li>События GA4 приходят: <code>click_phone</code>, <code>click_telegram</code>, <code>generate_lead</code> (проверка в DebugView).</li></ol>\n<h3 id=\"что-сделать-на-вашем-сайте\">Что сделать на вашем сайте</h3>\n<ul><li>Задеплойте исправленные Telegram-ссылки и тексты до запуска рекламы.</li><li>Попросите 3–5 клиентов оставить отзыв и добавьте их на страницу.</li></ul>\n<hr>", "text": " Объявление приводит человека, а заявку получает страница . Поэтому это половина результата. 9.1 Соответствие запросу (message match) Заголовок страницы повторяет обещание объявления. Человек искал «манипулятор брест», видит «Услуги манипулятора в Бресте», а не общую главную. 9.2 Скорость и доступность Каждая лишняя секунда загрузки снижает долю дождавшихся, особенно на мобильных. Недоступная страница тратит клик впустую (оплачивается!). Именно поэтому вопрос обрывов TLS на вашем хостинге критичен (глава 19). Ваши страницы в лабораторных замерах (Lighthouse PSI, 4G): 99–100 баллов на мобильных, LCP 1,6–2,3 с, CLS 0 . Это сильная основа, но реальные пользователи видят и доступность сервера. 9.3 Мобильность 78% показов вашего сайта в Google с мобильных. Значит: кнопка звонка видна без прокрутки (у вас в шапке и нижняя панель действий); кнопки крупные, нет мелкого текста; форма короткая: имя и телефон. 9.4 Доверие реальные фото и портфолио, отзывы (когда появятся), реквизиты ИП и адрес, ясные условия; политика конфиденциальности (у вас есть) и согласие в форме. 9.5 Что делает человек на странице Идеальный путь: понял предложение → увидел цену или вилку → позвонил или оставил заявку за 1–2 экрана. Для услуг с высокой ценностью (монтаж) есть ещё калькулятор, он повышает доверие. 9.6 Слабые места, которые стоит проверить на вашем сайте Что Почему важно Статус Кнопка «Telegram» вела на https://t.me/ Нерабочий клик считался конверсией Исправлено локально, нужен деплой Страница услуги и главная получали мало просмотров Не всех ведёт дальше Реклама приведёт трафик напрямую Нет отзывов на странице /otzyvy/ Низкое доверие Попросить 3–5 клиентов оставить отзыв Обрывы TLS на хостинге Потеря клика Обращение в hoster.by отправлено 9.7 Чек-лист посадочной страницы H1 повторяет ключ группы объявлений. Телефон и кнопка Telegram работают, видны на мобильном без прокрутки. Есть цена или вилка и условия. Есть доказательства: портфолио, отзывы, реквизиты. Форма короткая, есть согласие. Страница открывается быстро и стабильно. События GA4 приходят: click_phone , click_telegram , generate_lead (проверка в DebugView). Что сделать на вашем сайте Задеплойте исправленные Telegram-ссылки и тексты до запуска рекламы. Попросите 3–5 клиентов оставить отзыв и добавьте их на страницу. ", "toc": [["91-соответствие-запросу-message-match", "9.1 Соответствие запросу (message match)"], ["92-скорость-и-доступность", "9.2 Скорость и доступность"], ["93-мобильность", "9.3 Мобильность"], ["94-доверие", "9.4 Доверие"], ["95-что-делает-человек-на-странице", "9.5 Что делает человек на странице"], ["96-слабые-места-которые-стоит-проверить-на-вашем-сайте", "9.6 Слабые места, которые стоит проверить на вашем сайте"], ["97-чек-лист-посадочной-страницы", "9.7 Чек-лист посадочной страницы"], ["что-сделать-на-вашем-сайте", "Что сделать на вашем сайте"]]}, {"id": "ch10", "num": "10", "title": "Тестирование и эксперименты", "full": "10. Тестирование и эксперименты", "part": "Часть III. Объявления и страницы", "html": "<h3 id=\"101-что-тестировать-и-в-каком-порядке\">10.1 Что тестировать и в каком порядке</h3>\n<ol><li><strong>Ключевые слова и минус-слова</strong> (самый большой эффект на деньги).</li><li><strong>Посадочная страница</strong> (самый большой эффект на конверсию).</li><li><strong>Заголовки и описания</strong> (CTR).</li><li><strong>Ставки и аудитории</strong> (в самом конце).</li></ol>\n<p>Тестируйте <strong>одну переменную</strong> и записывайте дату и гипотезу.</p>\n<h3 id=\"102-проблема-малой-выборки\">10.2 Проблема малой выборки</h3>\n<p>При 30–100 кликах в неделю разница в 1–2 конверсии это шум. Правила:</p>\n<ul><li>Сравнивайте <strong>не меньше 100 кликов на вариант</strong> (лучше 300).</li><li>Для CTR различия в 20% относительных на малых числах чаще всего случайны.</li><li>Решайте по накопленным данным за 2–4 недели, а не по дням.</li></ul>\n<p><strong>Проверка на случайность (для программиста).</strong> Точный тест Фишера для 2x2: 5 конверсий из 100 кликов против 8 из 100 даёт p = 0,57, то есть разница вполне может быть случайной. Для 10 из 300 против 24 из 300 p = 0,02, то есть различие уже значимо. Вывод: на 100 кликов разница в 3 конверсии ничего не доказывает, а на 300 кликов разница в 14 конверсий уже убедительна.</p>\n<h3 id=\"103-инструменты\">10.3 Инструменты</h3>\n<ul><li><strong>Эксперименты в Google Ads</strong> (Drafts and experiments, A/B для ставок, объявлений, страниц).</li><li><strong>Ротация объявлений</strong> (RSA тестирует сам).</li><li><strong>A/B страницы:</strong> отдельные страницы и разделение трафика по группам.</li></ul>\n<h3 id=\"104-когда-остановить-тест\">10.4 Когда остановить тест</h3>\n<ul><li>набрано заранее заданное число кликов;</li><li>прошло 2–4 недели (учтите сезонность и день недели);</li><li>нет технических сбоев (обрывы TLS портят любой тест).</li></ul>\n<h3 id=\"105-журнал-изменений\">10.5 Журнал изменений</h3>\n<p>Ведите таблицу: дата, что изменили, зачем, ожидаемый эффект, результат. Кабинет хранит «История изменений», но свои причины там не записываются.</p>\n<div class=\"tablewrap\"><table><thead><tr><th>Дата</th><th>Изменение</th><th>Гипотеза</th><th>Метрика</th><th>Результат</th></tr></thead><tbody><tr><td data-label=\"Дата\">2026-11-01</td><td data-label=\"Изменение\">Заголовок 3: «Монтаж за 1–3 дня»</td><td data-label=\"Гипотеза\">Повысит CTR</td><td data-label=\"Метрика\">CTR группы A1</td><td data-label=\"Результат\">(заполнить)</td></tr></tbody></table></div>\n<h3 id=\"что-сделать-на-вашем-сайте\">Что сделать на вашем сайте</h3>\n<ul><li>Заведите журнал изменений до запуска.</li><li>Первые 2 недели менять <strong>только минус-слова</strong>, остальное оставить стабильным.</li></ul>", "text": " 10.1 Что тестировать и в каком порядке Ключевые слова и минус-слова (самый большой эффект на деньги). Посадочная страница (самый большой эффект на конверсию). Заголовки и описания (CTR). Ставки и аудитории (в самом конце). Тестируйте одну переменную и записывайте дату и гипотезу. 10.2 Проблема малой выборки При 30–100 кликах в неделю разница в 1–2 конверсии это шум. Правила: Сравнивайте не меньше 100 кликов на вариант (лучше 300). Для CTR различия в 20% относительных на малых числах чаще всего случайны. Решайте по накопленным данным за 2–4 недели, а не по дням. Проверка на случайность (для программиста). Точный тест Фишера для 2x2: 5 конверсий из 100 кликов против 8 из 100 даёт p = 0,57, то есть разница вполне может быть случайной. Для 10 из 300 против 24 из 300 p = 0,02, то есть различие уже значимо. Вывод: на 100 кликов разница в 3 конверсии ничего не доказывает, а на 300 кликов разница в 14 конверсий уже убедительна. 10.3 Инструменты Эксперименты в Google Ads (Drafts and experiments, A/B для ставок, объявлений, страниц). Ротация объявлений (RSA тестирует сам). A/B страницы: отдельные страницы и разделение трафика по группам. 10.4 Когда остановить тест набрано заранее заданное число кликов; прошло 2–4 недели (учтите сезонность и день недели); нет технических сбоев (обрывы TLS портят любой тест). 10.5 Журнал изменений Ведите таблицу: дата, что изменили, зачем, ожидаемый эффект, результат. Кабинет хранит «История изменений», но свои причины там не записываются. Дата Изменение Гипотеза Метрика Результат 2026-11-01 Заголовок 3: «Монтаж за 1–3 дня» Повысит CTR CTR группы A1 (заполнить) Что сделать на вашем сайте Заведите журнал изменений до запуска. Первые 2 недели менять только минус-слова , остальное оставить стабильным. ", "toc": [["101-что-тестировать-и-в-каком-порядке", "10.1 Что тестировать и в каком порядке"], ["102-проблема-малой-выборки", "10.2 Проблема малой выборки"], ["103-инструменты", "10.3 Инструменты"], ["104-когда-остановить-тест", "10.4 Когда остановить тест"], ["105-журнал-изменений", "10.5 Журнал изменений"], ["что-сделать-на-вашем-сайте", "Что сделать на вашем сайте"]]}, {"id": "ch11", "num": "11", "title": "Измерение конверсий: как данные идут из клика в отчёт", "full": "11. Измерение конверсий: как данные идут из клика в отчёт", "part": "Часть IV. Аналитика и инструменты", "html": "<p>Если вы не измеряете конверсии, вы платите за клики вслепую. Эта глава объясняет <strong>как именно устроен учёт</strong>, чтобы вы могли его проверять, а не верить кабинету.</p>\n<h3 id=\"111-путь-одного-клика\">11.1 Путь одного клика</h3>\n<div class=\"diagram\" data-svg=\"tracking\" role=\"img\" aria-label=\"Диаграмма\"></div>\n<ol><li><strong>Автотеггинг (auto-tagging)</strong> добавляет к адресу страницы параметр <code>gclid</code>, уникальный идентификатор клика.</li><li>Если страница загрузилась и тег GA4 сработал, <code>gclid</code> сохраняется (cookie первой стороны).</li><li>Когда человек выполняет действие (звонок, заявка), в GA4 уходит событие.</li><li>Если событие помечено <strong>ключевым</strong> и импортировано в Google Ads, Google связывает его с кликом и записывает конверсию.</li><li>Эти конверсии учит автоматика ставок.</li></ol>\n<aside class=\"callout analogy\"><p><strong>Аналогия для программиста.</strong> <code>gclid</code> это <code>trace_id</code>: идентификатор запроса, который нужно протащить через все системы, иначе события не склеить. Потеряли <code>trace_id</code> на входе (страница не загрузилась, тег не сработал), и конверсию уже не восстановить.</p></aside>\n<h3 id=\"112-что-нужно-настроить\">11.2 Что нужно настроить</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>Шаг</th><th>Где</th><th>Статус на вашем сайте</th></tr></thead><tbody><tr><td data-label=\"Шаг\">Автотеггинг</td><td data-label=\"Где\">Google Ads → Настройки аккаунта</td><td data-label=\"Статус на вашем сайте\">включить</td></tr><tr><td data-label=\"Шаг\">Связь GA4 и Google Ads</td><td data-label=\"Где\">GA4 → Администратор → Связи с продуктами</td><td data-label=\"Статус на вашем сайте\">сделать</td></tr><tr><td data-label=\"Шаг\">Ключевые события GA4</td><td data-label=\"Где\">GA4 → События</td><td data-label=\"Статус на вашем сайте\"><code>generate_lead</code>, <code>click_phone</code>, <code>click_telegram</code></td></tr><tr><td data-label=\"Шаг\">Импорт в Google Ads</td><td data-label=\"Где\">Google Ads → Цели → Конверсии → Импорт</td><td data-label=\"Статус на вашем сайте\">сделать после связи</td></tr><tr><td data-label=\"Шаг\">Основная и вторичная</td><td data-label=\"Где\">Параметры конверсии</td><td data-label=\"Статус на вашем сайте\"><code>generate_lead</code> и <code>click_phone</code> основные</td></tr><tr><td data-label=\"Шаг\">Окно конверсии</td><td data-label=\"Где\">Параметры</td><td data-label=\"Статус на вашем сайте\">по умолчанию 30 дней, для звонков можно 30</td></tr></tbody></table></div>\n<h3 id=\"113-ga4-и-google-ads-считают-по-разному\">11.3 GA4 и Google Ads считают по-разному</h3>\n<p>Числа не совпадут. Причины:</p>\n<ul><li><strong>Разная атрибуция.</strong> Google Ads засчитывает конверсию клику по объявлению, GA4 по модели всего канала.</li><li><strong>Разное время.</strong> Google Ads записывает конверсию на дату клика, GA4 на дату события.</li><li><strong>Согласие и блокировщики.</strong> Часть событий не доходит.</li><li><strong>Разные определения</strong> «пользователь» и «сеанс».</li></ul>\n<p>Нормально, когда расхождение 10–20%. Если больше 30%, ищите технические проблемы.</p>\n<h3 id=\"114-атрибуция\">11.4 Атрибуция</h3>\n<p>Модель решает, какому касанию приписать конверсию. Сегодня по умолчанию используется <strong>атрибуция на основе данных (data-driven)</strong>, если хватает данных, иначе Google применяет упрощённый вариант. Для малых аккаунтов разница небольшая. Важнее соблюдать одно правило: <strong>считайте за заявку то, что вы реально видите</strong> (таблица «откуда узнали»).</p>\n<h3 id=\"115-ваши-события-и-что-с-ними-делать\">11.5 Ваши события и что с ними делать</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>Событие</th><th>Что измеряет</th><th>Конверсия?</th></tr></thead><tbody><tr><td data-label=\"Событие\"><code>generate_lead</code></td><td data-label=\"Что измеряет\">Успешная отправка формы</td><td data-label=\"Конверсия?\"><strong>Основная</strong></td></tr><tr><td data-label=\"Событие\"><code>click_phone</code></td><td data-label=\"Что измеряет\">Клик по номеру телефона</td><td data-label=\"Конверсия?\"><strong>Основная</strong></td></tr><tr><td data-label=\"Событие\"><code>click_telegram</code></td><td data-label=\"Что измеряет\">Клик по кнопке Telegram</td><td data-label=\"Конверсия?\">Вторичная (намерение, но не факт)</td></tr><tr><td data-label=\"Событие\"><code>click_cta_form</code></td><td data-label=\"Что измеряет\">Клик «Оставить заявку»</td><td data-label=\"Конверсия?\">Нет (микро-событие)</td></tr><tr><td data-label=\"Событие\"><code>calc_open</code>, <code>calculator_interact</code></td><td data-label=\"Что измеряет\">Калькулятор</td><td data-label=\"Конверсия?\">Нет (вовлечённость)</td></tr><tr><td data-label=\"Событие\"><code>lightbox_open</code></td><td data-label=\"Что измеряет\">Открытие фото</td><td data-label=\"Конверсия?\">Нет</td></tr></tbody></table></div>\n<p><strong>Важный нюанс.</strong> <code>click_phone</code> это <strong>намерение</strong>, а не звонок. Звонок мог не состояться. Поэтому в отчёте о конверсиях «клик по номеру» завышает реальные звонки. Сверяйте с таблицей «откуда узнали».</p>\n<h3 id=\"116-инженерные-улучшения-gclid-в-форму-и-офлайн-конверсии\">11.6 Инженерные улучшения: gclid в форму и офлайн-конверсии</h3>\n<p>Сайт может <strong>сохранять <code>gclid</code> вместе с заявкой</strong>, а затем возвращать в Google Ads факт продажи. Это позволяет оптимизировать рекламу не на «заполнили форму», а на «купили».</p>\n<ol><li>На странице добавьте скрытое поле <code>gclid</code> в форму и заполняйте его из URL или cookie.</li><li>В вашей CPT <code>tb_lead</code> сохраняйте поле <code>tb_lead_gclid</code>.</li><li>Когда сделка закрыта, загружайте в Google Ads <strong>офлайн-конверсию</strong>: <code>gclid</code>, время и (по желанию) ценность. Загрузка через CSV, API или скрипт; окно загрузки до 90 дней после клика.</li><li>Это даёт реальную ценность для автоматических ставок.</li></ol>\n<p>Дополнительно для форм с телефоном или email можно включить <strong>расширенные конверсии для лидов (Enhanced Conversions for Leads)</strong>: хешированные данные повышают точность сопоставления. Применять только если политика конфиденциальности и согласие это допускают (проверить).</p>\n<h3 id=\"117-типичные-ошибки-учёта\">11.7 Типичные ошибки учёта</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>Ошибка</th><th>Симптом</th><th>Решение</th></tr></thead><tbody><tr><td data-label=\"Ошибка\">Двойной счёт (импорт и тег дублируют)</td><td data-label=\"Симптом\">Конверсий вдвое больше</td><td data-label=\"Решение\">Оставить один источник</td></tr><tr><td data-label=\"Ошибка\">Все 7 событий импортированы</td><td data-label=\"Симптом\">«Конверсий» много, заявок нет</td><td data-label=\"Решение\">Импортировать только 3</td></tr><tr><td data-label=\"Ошибка\">Тест от администратора</td><td data-label=\"Симптом\">Нет событий</td><td data-label=\"Решение\">Тестировать в обычном окне (код не отправляет GA4 для администратора)</td></tr><tr><td data-label=\"Ошибка\">Тег грузится с задержкой</td><td data-label=\"Симптом\">Часть быстро ушедших не учтена</td><td data-label=\"Решение\">Принять или ускорить загрузку gtag</td></tr><tr><td data-label=\"Ошибка\">Страница недоступна при клике</td><td data-label=\"Симптом\">Клики есть, конверсий нет</td><td data-label=\"Решение\">Починить хостинг (обрывы TLS)</td></tr><tr><td data-label=\"Ошибка\">Не включён автотеггинг</td><td data-label=\"Симптом\">Конверсии не связываются с кликами</td><td data-label=\"Решение\">Включить</td></tr></tbody></table></div>\n<h3 id=\"118-как-проверить-что-всё-работает\">11.8 Как проверить, что всё работает</h3>\n<ol><li>Откройте объявление или ссылку с тестовым <code>?gclid=TEST</code> (не для ставок).</li><li>В GA4: Администратор → DebugView, затем клик по телефону.</li><li>В Google Ads: Цели → Конверсии → статус «Записывает конверсии» (может занять до суток).</li><li>Через неделю сравните число конверсий в Google Ads, GA4 и вашей таблице звонков.</li></ol>\n<h3 id=\"что-сделать-на-вашем-сайте\">Что сделать на вашем сайте</h3>\n<ul><li>Свяжите GA4 и Google Ads, импортируйте 3 события, включите автотеггинг.</li><li>Добавьте в таблицу «откуда узнали» столбец «источник и дата».</li><li>Запланируйте (после запуска) добавление <code>gclid</code> в форму заявки.</li></ul>\n<hr>", "text": " Если вы не измеряете конверсии, вы платите за клики вслепую. Эта глава объясняет как именно устроен учёт , чтобы вы могли его проверять, а не верить кабинету. 11.1 Путь одного клика Автотеггинг (auto-tagging) добавляет к адресу страницы параметр gclid , уникальный идентификатор клика. Если страница загрузилась и тег GA4 сработал, gclid сохраняется (cookie первой стороны). Когда человек выполняет действие (звонок, заявка), в GA4 уходит событие. Если событие помечено ключевым и импортировано в Google Ads, Google связывает его с кликом и записывает конверсию. Эти конверсии учит автоматика ставок. Аналогия для программиста. gclid это trace_id : идентификатор запроса, который нужно протащить через все системы, иначе события не склеить. Потеряли trace_id на входе (страница не загрузилась, тег не сработал), и конверсию уже не восстановить. 11.2 Что нужно настроить Шаг Где Статус на вашем сайте Автотеггинг Google Ads → Настройки аккаунта включить Связь GA4 и Google Ads GA4 → Администратор → Связи с продуктами сделать Ключевые события GA4 GA4 → События generate_lead , click_phone , click_telegram Импорт в Google Ads Google Ads → Цели → Конверсии → Импорт сделать после связи Основная и вторичная Параметры конверсии generate_lead и click_phone основные Окно конверсии Параметры по умолчанию 30 дней, для звонков можно 30 11.3 GA4 и Google Ads считают по-разному Числа не совпадут. Причины: Разная атрибуция. Google Ads засчитывает конверсию клику по объявлению, GA4 по модели всего канала. Разное время. Google Ads записывает конверсию на дату клика, GA4 на дату события. Согласие и блокировщики. Часть событий не доходит. Разные определения «пользователь» и «сеанс». Нормально, когда расхождение 10–20%. Если больше 30%, ищите технические проблемы. 11.4 Атрибуция Модель решает, какому касанию приписать конверсию. Сегодня по умолчанию используется атрибуция на основе данных (data-driven) , если хватает данных, иначе Google применяет упрощённый вариант. Для малых аккаунтов разница небольшая. Важнее соблюдать одно правило: считайте за заявку то, что вы реально видите (таблица «откуда узнали»). 11.5 Ваши события и что с ними делать Событие Что измеряет Конверсия? generate_lead Успешная отправка формы Основная click_phone Клик по номеру телефона Основная click_telegram Клик по кнопке Telegram Вторичная (намерение, но не факт) click_cta_form Клик «Оставить заявку» Нет (микро-событие) calc_open , calculator_interact Калькулятор Нет (вовлечённость) lightbox_open Открытие фото Нет Важный нюанс. click_phone это намерение , а не звонок. Звонок мог не состояться. Поэтому в отчёте о конверсиях «клик по номеру» завышает реальные звонки. Сверяйте с таблицей «откуда узнали». 11.6 Инженерные улучшения: gclid в форму и офлайн-конверсии Сайт может сохранять gclid вместе с заявкой , а затем возвращать в Google Ads факт продажи. Это позволяет оптимизировать рекламу не на «заполнили форму», а на «купили». На странице добавьте скрытое поле gclid в форму и заполняйте его из URL или cookie. В вашей CPT tb_lead сохраняйте поле tb_lead_gclid . Когда сделка закрыта, загружайте в Google Ads офлайн-конверсию : gclid , время и (по желанию) ценность. Загрузка через CSV, API или скрипт; окно загрузки до 90 дней после клика. Это даёт реальную ценность для автоматических ставок. Дополнительно для форм с телефоном или email можно включить расширенные конверсии для лидов (Enhanced Conversions for Leads) : хешированные данные повышают точность сопоставления. Применять только если политика конфиденциальности и согласие это допускают (проверить). 11.7 Типичные ошибки учёта Ошибка Симптом Решение Двойной счёт (импорт и тег дублируют) Конверсий вдвое больше Оставить один источник Все 7 событий импортированы «Конверсий» много, заявок нет Импортировать только 3 Тест от администратора Нет событий Тестировать в обычном окне (код не отправляет GA4 для администратора) Тег грузится с задержкой Часть быстро ушедших не учтена Принять или ускорить загрузку gtag Страница недоступна при клике Клики есть, конверсий нет Починить хостинг (обрывы TLS) Не включён автотеггинг Конверсии не связываются с кликами Включить 11.8 Как проверить, что всё работает Откройте объявление или ссылку с тестовым ?gclid=TEST (не для ставок). В GA4: Администратор → DebugView, затем клик по телефону. В Google Ads: Цели → Конверсии → статус «Записывает конверсии» (может занять до суток). Через неделю сравните число конверсий в Google Ads, GA4 и вашей таблице звонков. Что сделать на вашем сайте Свяжите GA4 и Google Ads, импортируйте 3 события, включите автотеггинг. Добавьте в таблицу «откуда узнали» столбец «источник и дата». Запланируйте (после запуска) добавление gclid в форму заявки. ", "toc": [["111-путь-одного-клика", "11.1 Путь одного клика"], ["112-что-нужно-настроить", "11.2 Что нужно настроить"], ["113-ga4-и-google-ads-считают-по-разному", "11.3 GA4 и Google Ads считают по-разному"], ["114-атрибуция", "11.4 Атрибуция"], ["115-ваши-события-и-что-с-ними-делать", "11.5 Ваши события и что с ними делать"], ["116-инженерные-улучшения-gclid-в-форму-и-офлайн-конверсии", "11.6 Инженерные улучшения: gclid в форму и офлайн-конверсии"], ["117-типичные-ошибки-учёта", "11.7 Типичные ошибки учёта"], ["118-как-проверить-что-всё-работает", "11.8 Как проверить, что всё работает"], ["что-сделать-на-вашем-сайте", "Что сделать на вашем сайте"]]}, {"id": "ch12", "num": "12", "title": "Инструменты специалиста", "full": "12. Инструменты специалиста", "part": "Часть IV. Аналитика и инструменты", "html": "<h3 id=\"121-карта-инструментов\">12.1 Карта инструментов</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>Инструмент</th><th>Для чего</th><th>Когда использовать</th></tr></thead><tbody><tr><td data-label=\"Инструмент\"><strong>Кабинет Google Ads</strong></td><td data-label=\"Для чего\">Кампании, отчёты, рекомендации</td><td data-label=\"Когда использовать\">Каждый день</td></tr><tr><td data-label=\"Инструмент\"><strong>Планировщик ключевых слов</strong></td><td data-label=\"Для чего\">Частота, цена клика, идеи</td><td data-label=\"Когда использовать\">До запуска и при расширении</td></tr><tr><td data-label=\"Инструмент\"><strong>Google Ads Editor</strong></td><td data-label=\"Для чего\">Массовые правки офлайн (CSV, копирование)</td><td data-label=\"Когда использовать\">Когда кампаний больше трёх</td></tr><tr><td data-label=\"Инструмент\"><strong>GA4</strong></td><td data-label=\"Для чего\">Поведение, события, конверсии</td><td data-label=\"Когда использовать\">Раз в неделю</td></tr><tr><td data-label=\"Инструмент\"><strong>GA4 Исследования (Explore)</strong></td><td data-label=\"Для чего\">Воронки и сегменты</td><td data-label=\"Когда использовать\">Когда нужна глубина</td></tr><tr><td data-label=\"Инструмент\"><strong>Search Console</strong></td><td data-label=\"Для чего\">Органические запросы, индексация</td><td data-label=\"Когда использовать\">Для связки с рекламой</td></tr><tr><td data-label=\"Инструмент\"><strong>Looker Studio</strong></td><td data-label=\"Для чего\">Дашборды, отчёты для владельца</td><td data-label=\"Когда использовать\">После первых данных</td></tr><tr><td data-label=\"Инструмент\"><strong>Google Tag Assistant / DebugView</strong></td><td data-label=\"Для чего\">Проверка тегов и событий</td><td data-label=\"Когда использовать\">Перед запуском и после правок</td></tr><tr><td data-label=\"Инструмент\"><strong>PageSpeed Insights</strong></td><td data-label=\"Для чего\">Скорость страниц</td><td data-label=\"Когда использовать\">Перед запуском, после правок</td></tr><tr><td data-label=\"Инструмент\"><strong>Яндекс.Метрика</strong></td><td data-label=\"Для чего\">Карта кликов, Вебвизор, цели</td><td data-label=\"Когда использовать\">После восстановления сервисов</td></tr><tr><td data-label=\"Инструмент\"><strong>Wordstat (Яндекс)</strong></td><td data-label=\"Для чего\">Частота запросов для Беларуси</td><td data-label=\"Когда использовать\">Идеи ключей</td></tr><tr><td data-label=\"Инструмент\"><strong>UTM-генераторы</strong></td><td data-label=\"Для чего\">Единые метки</td><td data-label=\"Когда использовать\">Для внешних ссылок</td></tr><tr><td data-label=\"Инструмент\"><strong>Таблицы (Google Sheets)</strong></td><td data-label=\"Для чего\">Журнал, учёт звонков, отчёты</td><td data-label=\"Когда использовать\">Постоянно</td></tr><tr><td data-label=\"Инструмент\"><strong>Скрипты Google Ads, API, BigQuery</strong></td><td data-label=\"Для чего\">Автоматизация</td><td data-label=\"Когда использовать\">Глава 14</td></tr></tbody></table></div>\n<h3 id=\"122-что-вы-получите-в-кабинете\">12.2 Что вы получите в кабинете</h3>\n<ul><li><strong>Обзор:</strong> расходы, клики, конверсии, оценка оптимизации.</li><li><strong>Кампании:</strong> разрез по кампаниям, группам, ключам.</li><li><strong>Цели (Goals):</strong> конверсии.</li><li><strong>Инструменты:</strong> Планировщик, Общая библиотека (списки минус-слов), Центр оплаты.</li><li><strong>Отчёты и редактор отчётов:</strong> своя табличка, сохранённые отчёты.</li><li><strong>История изменений:</strong> кто и когда менял.</li><li><strong>Рекомендации:</strong> предложения Google. <strong>Относитесь с осторожностью:</strong> многие рекомендации направлены на рост расходов (шире соответствие, больше бюджета), а не на вашу прибыль.</li></ul>\n<h3 id=\"123-рецепты-в-ga4-исследования\">12.3 Рецепты в GA4 «Исследования»</h3>\n<p>Раздел <strong>Исследования (Explore)</strong> даёт свободные отчёты. Три рецепта для вашего сайта:</p>\n<ol><li><strong>Воронка заявки.</strong> Тип «Воронка». Шаги: <code>page_view</code> страницы услуги, затем <code>click_phone</code> или <code>click_telegram</code>, затем <code>generate_lead</code>. Разбивка по «Источник/канал сеанса». Показывает, на каком шаге люди отваливаются и откуда приходят самые «горячие».</li><li><strong>Анализ пути.</strong> Тип «Путь». Начало: <code>click_phone</code>. Видно, какие страницы вели к звонку (часто это калькулятор или портфолио).</li><li><strong>Сравнение сегментов.</strong> Сегменты «google / cpc» и «yandex / organic»: вовлечённость, время, события. Помогает понять качество рекламного трафика.</li></ol>\n<p>Полезные измерения: «Целевая страница», «Источник/канал сеанса», «Устройство», «Город». Помните про <strong>пороги приватности GA4</strong>: при малых числах часть данных скрывается.</p>\n<h3 id=\"124-чертёж-дашборда-в-looker-studio\">12.4 Чертёж дашборда в Looker Studio</h3>\n<p>Один дашборд на 5 страниц, чтобы владелец за 2 минуты видел главное:</p>\n<div class=\"tablewrap\"><table><thead><tr><th>Страница</th><th>Что показывает</th><th>Источник данных</th></tr></thead><tbody><tr><td data-label=\"Страница\">1. Обзор</td><td data-label=\"Что показывает\">Расход, клики, CTR, CPC, конверсии, цена заявки по неделям</td><td data-label=\"Источник данных\">Google Ads</td></tr><tr><td data-label=\"Страница\">2. Запросы</td><td data-label=\"Что показывает\">Таблица поисковых запросов с расходом и конверсиями, фильтр по кампании</td><td data-label=\"Источник данных\">Google Ads</td></tr><tr><td data-label=\"Страница\">3. Где и когда</td><td data-label=\"Что показывает\">Устройства, часы, города</td><td data-label=\"Источник данных\">Google Ads</td></tr><tr><td data-label=\"Страница\">4. Страницы</td><td data-label=\"Что показывает\">Целевые страницы и события (<code>click_phone</code>, <code>generate_lead</code>)</td><td data-label=\"Источник данных\">GA4</td></tr><tr><td data-label=\"Страница\">5. Сверка</td><td data-label=\"Что показывает\">Звонки и заявки из вашей таблицы против «конверсий» кабинета</td><td data-label=\"Источник данных\">Google Таблицы + Ads</td></tr></tbody></table></div>\n<p>Вычисляемое поле «Цена заявки»: <code>Cost / Conversions</code>. Для сверки заведите в таблице звонков столбец «неделя» и сопоставляйте по неделям.</p>\n<h3 id=\"125-проверка-тегов-по-шагам\">12.5 Проверка тегов по шагам</h3>\n<ol><li><strong>DebugView (GA4):</strong> включите режим отладки (расширение Tag Assistant или параметр отладки), откройте сайт <strong>в обычном окне, не от имени администратора</strong> (код не отправляет GA4 для администратора), совершите действия.</li><li><strong>Google Tag Assistant:</strong> проверяет, что теги загружаются. Учтите, что <code>gtag.js</code> у вас грузится с задержкой после первого действия или через 2,5 с.</li><li><strong>Расширение «Network»:</strong> в инструментах разработчика найдите запросы <code>g/collect</code> с нужным событием и параметром <code>gclid</code>.</li><li><strong>Google Ads → Цели → Конверсии:</strong> статус «Записывает конверсии» появляется через сутки.</li></ol>\n<h3 id=\"126-как-выбирать-инструменты-новичку\">12.6 Как выбирать инструменты новичку</h3>\n<p>Минимум на первые 3 недели: <strong>кабинет Google Ads, GA4, Search Console, таблица</strong>. Остальное по необходимости.</p>\n<h3 id=\"127-сторонние-сервисы\">12.7 Сторонние сервисы</h3>\n<p>Есть платные сервисы анализа конкурентов, подбора слов и оптимизации (Semrush, Serpstat, SpyFu и др.). Для региональной услуги малого бизнеса они обычно избыточны. Попробуйте после первых данных, если заметите, что конкуренты сильнее.</p>\n<h3 id=\"что-сделать-на-вашем-сайте\">Что сделать на вашем сайте</h3>\n<ul><li>Установите закладки: Google Ads, GA4, Search Console, PageSpeed.</li><li>Заведите таблицу журнала и учёта звонков.</li></ul>\n<hr>", "text": " 12.1 Карта инструментов Инструмент Для чего Когда использовать Кабинет Google Ads Кампании, отчёты, рекомендации Каждый день Планировщик ключевых слов Частота, цена клика, идеи До запуска и при расширении Google Ads Editor Массовые правки офлайн (CSV, копирование) Когда кампаний больше трёх GA4 Поведение, события, конверсии Раз в неделю GA4 Исследования (Explore) Воронки и сегменты Когда нужна глубина Search Console Органические запросы, индексация Для связки с рекламой Looker Studio Дашборды, отчёты для владельца После первых данных Google Tag Assistant / DebugView Проверка тегов и событий Перед запуском и после правок PageSpeed Insights Скорость страниц Перед запуском, после правок Яндекс.Метрика Карта кликов, Вебвизор, цели После восстановления сервисов Wordstat (Яндекс) Частота запросов для Беларуси Идеи ключей UTM-генераторы Единые метки Для внешних ссылок Таблицы (Google Sheets) Журнал, учёт звонков, отчёты Постоянно Скрипты Google Ads, API, BigQuery Автоматизация Глава 14 12.2 Что вы получите в кабинете Обзор: расходы, клики, конверсии, оценка оптимизации. Кампании: разрез по кампаниям, группам, ключам. Цели (Goals): конверсии. Инструменты: Планировщик, Общая библиотека (списки минус-слов), Центр оплаты. Отчёты и редактор отчётов: своя табличка, сохранённые отчёты. История изменений: кто и когда менял. Рекомендации: предложения Google. Относитесь с осторожностью: многие рекомендации направлены на рост расходов (шире соответствие, больше бюджета), а не на вашу прибыль. 12.3 Рецепты в GA4 «Исследования» Раздел Исследования (Explore) даёт свободные отчёты. Три рецепта для вашего сайта: Воронка заявки. Тип «Воронка». Шаги: page_view страницы услуги, затем click_phone или click_telegram , затем generate_lead . Разбивка по «Источник/канал сеанса». Показывает, на каком шаге люди отваливаются и откуда приходят самые «горячие». Анализ пути. Тип «Путь». Начало: click_phone . Видно, какие страницы вели к звонку (часто это калькулятор или портфолио). Сравнение сегментов. Сегменты «google / cpc» и «yandex / organic»: вовлечённость, время, события. Помогает понять качество рекламного трафика. Полезные измерения: «Целевая страница», «Источник/канал сеанса», «Устройство», «Город». Помните про пороги приватности GA4 : при малых числах часть данных скрывается. 12.4 Чертёж дашборда в Looker Studio Один дашборд на 5 страниц, чтобы владелец за 2 минуты видел главное: Страница Что показывает Источник данных 1. Обзор Расход, клики, CTR, CPC, конверсии, цена заявки по неделям Google Ads 2. Запросы Таблица поисковых запросов с расходом и конверсиями, фильтр по кампании Google Ads 3. Где и когда Устройства, часы, города Google Ads 4. Страницы Целевые страницы и события ( click_phone , generate_lead ) GA4 5. Сверка Звонки и заявки из вашей таблицы против «конверсий» кабинета Google Таблицы + Ads Вычисляемое поле «Цена заявки»: Cost / Conversions . Для сверки заведите в таблице звонков столбец «неделя» и сопоставляйте по неделям. 12.5 Проверка тегов по шагам DebugView (GA4): включите режим отладки (расширение Tag Assistant или параметр отладки), откройте сайт в обычном окне, не от имени администратора (код не отправляет GA4 для администратора), совершите действия. Google Tag Assistant: проверяет, что теги загружаются. Учтите, что gtag.js у вас грузится с задержкой после первого действия или через 2,5 с. Расширение «Network»: в инструментах разработчика найдите запросы g/collect с нужным событием и параметром gclid . Google Ads → Цели → Конверсии: статус «Записывает конверсии» появляется через сутки. 12.6 Как выбирать инструменты новичку Минимум на первые 3 недели: кабинет Google Ads, GA4, Search Console, таблица . Остальное по необходимости. 12.7 Сторонние сервисы Есть платные сервисы анализа конкурентов, подбора слов и оптимизации (Semrush, Serpstat, SpyFu и др.). Для региональной услуги малого бизнеса они обычно избыточны. Попробуйте после первых данных, если заметите, что конкуренты сильнее. Что сделать на вашем сайте Установите закладки: Google Ads, GA4, Search Console, PageSpeed. Заведите таблицу журнала и учёта звонков. ", "toc": [["121-карта-инструментов", "12.1 Карта инструментов"], ["122-что-вы-получите-в-кабинете", "12.2 Что вы получите в кабинете"], ["123-рецепты-в-ga4-исследования", "12.3 Рецепты в GA4 «Исследования»"], ["124-чертёж-дашборда-в-looker-studio", "12.4 Чертёж дашборда в Looker Studio"], ["125-проверка-тегов-по-шагам", "12.5 Проверка тегов по шагам"], ["126-как-выбирать-инструменты-новичку", "12.6 Как выбирать инструменты новичку"], ["127-сторонние-сервисы", "12.7 Сторонние сервисы"], ["что-сделать-на-вашем-сайте", "Что сделать на вашем сайте"]]}, {"id": "ch13", "num": "13", "title": "Отчёты и диагностика", "full": "13. Отчёты и диагностика", "part": "Часть IV. Аналитика и инструменты", "html": "<h3 id=\"131-ежедневная-еженедельная-ежемесячная-рутина\">13.1 Ежедневная, еженедельная, ежемесячная рутина</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>Когда</th><th>Что смотреть</th><th>Что делать</th></tr></thead><tbody><tr><td data-label=\"Когда\"><strong>Ежедневно (5 мин) первые 2 недели</strong></td><td data-label=\"Что смотреть\">Расход, клики, статус объявлений, поисковые запросы</td><td data-label=\"Что делать\">Добавить минус-слова, проверить отклонения</td></tr><tr><td data-label=\"Когда\"><strong>Раз в неделю (30 мин)</strong></td><td data-label=\"Что смотреть\">CTR, цена клика, конверсии, доля показов, устройства, часы</td><td data-label=\"Что делать\">Скорректировать ставки, заменить слабые заголовки</td></tr><tr><td data-label=\"Когда\"><strong>Раз в месяц (1–2 часа)</strong></td><td data-label=\"Что смотреть\">Цена заявки, сравнение со сверкой «откуда узнали», бюджет</td><td data-label=\"Что делать\">Решение: масштаб, пауза, смена стратегии</td></tr></tbody></table></div>\n<h3 id=\"132-главные-отчёты\">13.2 Главные отчёты</h3>\n<ul><li><strong>Поисковые запросы (Search terms):</strong> что люди реально ввели. Важнейший отчёт, из него берутся минус-слова. Google скрывает редкие запросы (политика приватности), поэтому видна не вся картина.</li><li><strong>Ключевые слова:</strong> показы, клики, CTR, цена, конверсии, Quality Score.</li><li><strong>Доля показов (Impression Share):</strong> сколько показов вы получили из возможных и почему потеряли (бюджет или рейтинг).</li><li><strong>Аукцион (Auction Insights):</strong> с кем вы пересекаетесь.</li><li><strong>Устройства, часы, регионы:</strong> где конверсии дешевле.</li><li><strong>Задержка конверсий:</strong> конверсия может записаться через дни после клика, не принимайте решение по вчерашним данным.</li></ul>\n<h3 id=\"133-диагностика-по-симптомам\">13.3 Диагностика по симптомам</h3>\n<div class=\"diagram\" data-svg=\"diagnosis\" role=\"img\" aria-label=\"Диаграмма\"></div>\n<div class=\"tablewrap\"><table><thead><tr><th>Симптом</th><th>Частые причины</th><th>Проверка и действия</th></tr></thead><tbody><tr><td data-label=\"Симптом\"><strong>Нет показов</strong></td><td data-label=\"Частые причины\">Объявление не одобрено, кампания на паузе, слишком низкая ставка или бюджет, слишком узкое гео, мало запросов</td><td data-label=\"Проверка и действия\">Статусы, «Отчёт о причинах», ставка и бюджет, Планировщик</td></tr><tr><td data-label=\"Симптом\"><strong>Показов много, кликов мало</strong></td><td data-label=\"Частые причины\">Низкая позиция, слабое объявление, нецелевые запросы</td><td data-label=\"Проверка и действия\">Позиция и доля показов, переписать заголовки, минус-слова</td></tr><tr><td data-label=\"Симптом\"><strong>Кликов много, заявок нет</strong></td><td data-label=\"Частые причины\">Страница не отвечает, не работает трекинг, <strong>сайт недоступен</strong>, мусорные запросы</td><td data-label=\"Проверка и действия\">Поисковые запросы, открыть страницу вручную, DebugView, статус хостинга</td></tr><tr><td data-label=\"Симптом\"><strong>Заявки есть, но дорого</strong></td><td data-label=\"Частые причины\">Дорогие слова, низкая конверсия</td><td data-label=\"Проверка и действия\">Убрать убыточные ключи, сузить гео и расписание, улучшить страницу</td></tr><tr><td data-label=\"Симптом\"><strong>Расход упал резко</strong></td><td data-label=\"Частые причины\">Объявление отклонено, сбой платежа, сайт недоступен, ограничение аккаунта</td><td data-label=\"Проверка и действия\">Центр оплаты, статусы, политика</td></tr></tbody></table></div>\n<h3 id=\"134-как-читать-цифры\">13.4 Как читать цифры</h3>\n<ul><li><strong>CTR</strong> сравнивайте внутри одной группы и намерения. Брендовые и точные запросы дают высокий CTR, широкие низкий.</li><li><strong>Цена клика</strong> растёт в пик сезона. Не паникуйте от недельных скачков.</li><li><strong>Конверсия</strong> смотрите по группам и устройствам.</li><li><strong>Статистическая значимость:</strong> глава 10.</li><li><strong>Шум малых данных:</strong> при 30–100 кликах в неделю решения принимайте по накопленным 2–4 неделям.</li></ul>\n<p><strong>Пример шума на ваших данных: показы вашего сайта в Google по дням (06.09–06.10.2026, Search Console).</strong> День к дню числа скачут (0, 1, 10 показов), а тренд за месяц растёт. Решать по одному дню нельзя.</p>\n<div class=\"widget\" data-widget=\"gsc-trend\"></div>\n<div class=\"tablewrap\"><table><thead><tr><th>Неделя</th><th>Показы</th><th>Клики</th></tr></thead><tbody><tr><td data-label=\"Неделя\">09-06 – 09-12</td><td data-label=\"Показы\">17</td><td data-label=\"Клики\">1</td></tr><tr><td data-label=\"Неделя\">09-13 – 09-19</td><td data-label=\"Показы\">22</td><td data-label=\"Клики\">2</td></tr><tr><td data-label=\"Неделя\">09-20 – 09-26</td><td data-label=\"Показы\">31</td><td data-label=\"Клики\">0</td></tr><tr><td data-label=\"Неделя\">09-27 – 10-03</td><td data-label=\"Показы\">40</td><td data-label=\"Клики\">1</td></tr><tr><td data-label=\"Неделя\">10-04 – 10-06</td><td data-label=\"Показы\">25</td><td data-label=\"Клики\">1</td></tr></tbody></table></div>\n<h3 id=\"135-доля-показов-сколько-вы-теряете-и-почему\">13.5 Доля показов: сколько вы теряете и почему</h3>\n<p>Столбцы <strong>доля показов (Impression Share)</strong>, <strong>потеряна из-за бюджета</strong>, <strong>потеряна из-за рейтинга</strong>:</p>\n<div class=\"tablewrap\"><table><thead><tr><th>Что видите</th><th>Что значит</th><th>Что делать</th></tr></thead><tbody><tr><td data-label=\"Что видите\">Доля показов 40%, потеря из-за бюджета 50%</td><td data-label=\"Что значит\">Бюджет заканчивается раньше конца дня</td><td data-label=\"Что делать\">Поднять бюджет или сузить показ (минус-слова, расписание)</td></tr><tr><td data-label=\"Что видите\">Потеря из-за рейтинга большая</td><td data-label=\"Что значит\">Ставка или качество ниже конкурентов</td><td data-label=\"Что делать\">Поднять ставку, улучшить объявление и страницу</td></tr><tr><td data-label=\"Что видите\">Доля 90% и выше</td><td data-label=\"Что значит\">Вы показываетесь почти всегда</td><td data-label=\"Что делать\">Ищите улучшение в CTR и конверсии, а не в показах</td></tr></tbody></table></div>\n<h3 id=\"136-задержка-конверсий\">13.6 Задержка конверсий</h3>\n<p>Конверсия записывается на <strong>дату клика</strong>, а клиент может позвонить через 2–7 дней. Поэтому вчерашние и позавчерашние конверсии занижены. Не оценивайте группу по данным последних 2–3 дней. В отчёте можно включить столбец «конверсии по времени конверсии», чтобы видеть, когда они фактически произошли.</p>\n<h3 id=\"137-отчёт-аукцион-auction-insights\">13.7 Отчёт «Аукцион» (Auction Insights)</h3>\n<p>Показывает, с какими рекламодателями вы пересекаетесь: <strong>доля показов, доля перекрытия, доля верхних позиций, доля выше конкурента</strong>. Для региона это быстрый способ узнать, кто ваши реальные конкуренты (кроме тех, кого вы знаете). Данные видны при достаточной статистике.</p>\n<h3 id=\"138-анализ-запросов-по-n-граммам\">13.8 Анализ запросов по n-граммам</h3>\n<p>Одиночные запросы редко повторяются, поэтому смотрят на <strong>слова внутри запросов</strong>:</p>\n<ol><li>Разбейте запросы на слова.</li><li>Для каждого слова просуммируйте расход, клики, конверсии.</li><li>Слова с большим расходом и нулём конверсий кандидаты в минус-слова.</li></ol>\n<div class=\"tablewrap\"><table><thead><tr><th>Слово</th><th>Расход</th><th>Клики</th><th>Конверсии</th><th>Решение</th></tr></thead><tbody><tr><td data-label=\"Слово\">«чертёж»</td><td data-label=\"Расход\">6,2</td><td data-label=\"Клики\">8</td><td data-label=\"Конверсии\">0</td><td data-label=\"Решение\">в минус-слова</td></tr><tr><td data-label=\"Слово\">«цена»</td><td data-label=\"Расход\">11,4</td><td data-label=\"Клики\">14</td><td data-label=\"Конверсии\">2</td><td data-label=\"Решение\">оставить</td></tr><tr><td data-label=\"Слово\">«бесплатно»</td><td data-label=\"Расход\">3,0</td><td data-label=\"Клики\">5</td><td data-label=\"Конверсии\">0</td><td data-label=\"Решение\">в минус-слова</td></tr><tr><td data-label=\"Слово\">«минск»</td><td data-label=\"Расход\">4,8</td><td data-label=\"Клики\">6</td><td data-label=\"Конверсии\">0</td><td data-label=\"Решение\">в минус-слова</td></tr></tbody></table></div>\n<p>Цифры условные. Скрипт, который собирает такую таблицу автоматически, в разделе 14.5.</p>\n<h3 id=\"139-контрольная-панель-пороги-тревоги\">13.9 Контрольная панель: пороги тревоги</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>Показатель</th><th>Порог внимания</th></tr></thead><tbody><tr><td data-label=\"Показатель\">Показы за 24 часа</td><td data-label=\"Порог внимания\">0 при активной кампании</td></tr><tr><td data-label=\"Показатель\">Расход за день</td><td data-label=\"Порог внимания\">Больше 1,5 от дневного бюджета (бывает до 2)</td></tr><tr><td data-label=\"Показатель\">CTR группы при позиции 1–3</td><td data-label=\"Порог внимания\">Меньше 2–3%</td></tr><tr><td data-label=\"Показатель\">Клики в кабинете и визиты в GA4</td><td data-label=\"Порог внимания\">Расхождение больше 25–30%</td></tr><tr><td data-label=\"Показатель\">Конверсии за 7 дней при 30+ кликах</td><td data-label=\"Порог внимания\">0</td></tr><tr><td data-label=\"Показатель\">Статус объявления</td><td data-label=\"Порог внимания\">Любой, кроме «Одобрено»</td></tr><tr><td data-label=\"Показатель\">Цена заявки</td><td data-label=\"Порог внимания\">Выше предельной 7 дней подряд</td></tr></tbody></table></div>\n<h3 id=\"1310-недельный-отчёт\">13.10 Недельный отчёт</h3>\n<p>Шаблон недельного отчёта в приложении B. Основные строки: расход, клики, CTR, CPC, конверсии, CPL, доля показов, главные находки, решения на неделю.</p>\n<h3 id=\"что-сделать-на-вашем-сайте\">Что сделать на вашем сайте</h3>\n<ul><li>Добавьте в календарь ежедневную проверку «поисковых запросов» на первые 14 дней.</li><li>Заведите таблицу недельных отчётов.</li></ul>\n<hr>", "text": " 13.1 Ежедневная, еженедельная, ежемесячная рутина Когда Что смотреть Что делать Ежедневно (5 мин) первые 2 недели Расход, клики, статус объявлений, поисковые запросы Добавить минус-слова, проверить отклонения Раз в неделю (30 мин) CTR, цена клика, конверсии, доля показов, устройства, часы Скорректировать ставки, заменить слабые заголовки Раз в месяц (1–2 часа) Цена заявки, сравнение со сверкой «откуда узнали», бюджет Решение: масштаб, пауза, смена стратегии 13.2 Главные отчёты Поисковые запросы (Search terms): что люди реально ввели. Важнейший отчёт, из него берутся минус-слова. Google скрывает редкие запросы (политика приватности), поэтому видна не вся картина. Ключевые слова: показы, клики, CTR, цена, конверсии, Quality Score. Доля показов (Impression Share): сколько показов вы получили из возможных и почему потеряли (бюджет или рейтинг). Аукцион (Auction Insights): с кем вы пересекаетесь. Устройства, часы, регионы: где конверсии дешевле. Задержка конверсий: конверсия может записаться через дни после клика, не принимайте решение по вчерашним данным. 13.3 Диагностика по симптомам Симптом Частые причины Проверка и действия Нет показов Объявление не одобрено, кампания на паузе, слишком низкая ставка или бюджет, слишком узкое гео, мало запросов Статусы, «Отчёт о причинах», ставка и бюджет, Планировщик Показов много, кликов мало Низкая позиция, слабое объявление, нецелевые запросы Позиция и доля показов, переписать заголовки, минус-слова Кликов много, заявок нет Страница не отвечает, не работает трекинг, сайт недоступен , мусорные запросы Поисковые запросы, открыть страницу вручную, DebugView, статус хостинга Заявки есть, но дорого Дорогие слова, низкая конверсия Убрать убыточные ключи, сузить гео и расписание, улучшить страницу Расход упал резко Объявление отклонено, сбой платежа, сайт недоступен, ограничение аккаунта Центр оплаты, статусы, политика 13.4 Как читать цифры CTR сравнивайте внутри одной группы и намерения. Брендовые и точные запросы дают высокий CTR, широкие низкий. Цена клика растёт в пик сезона. Не паникуйте от недельных скачков. Конверсия смотрите по группам и устройствам. Статистическая значимость: глава 10. Шум малых данных: при 30–100 кликах в неделю решения принимайте по накопленным 2–4 неделям. Пример шума на ваших данных: показы вашего сайта в Google по дням (06.09–06.10.2026, Search Console). День к дню числа скачут (0, 1, 10 показов), а тренд за месяц растёт. Решать по одному дню нельзя. Неделя Показы Клики 09-06 – 09-12 17 1 09-13 – 09-19 22 2 09-20 – 09-26 31 0 09-27 – 10-03 40 1 10-04 – 10-06 25 1 13.5 Доля показов: сколько вы теряете и почему Столбцы доля показов (Impression Share) , потеряна из-за бюджета , потеряна из-за рейтинга : Что видите Что значит Что делать Доля показов 40%, потеря из-за бюджета 50% Бюджет заканчивается раньше конца дня Поднять бюджет или сузить показ (минус-слова, расписание) Потеря из-за рейтинга большая Ставка или качество ниже конкурентов Поднять ставку, улучшить объявление и страницу Доля 90% и выше Вы показываетесь почти всегда Ищите улучшение в CTR и конверсии, а не в показах 13.6 Задержка конверсий Конверсия записывается на дату клика , а клиент может позвонить через 2–7 дней. Поэтому вчерашние и позавчерашние конверсии занижены. Не оценивайте группу по данным последних 2–3 дней. В отчёте можно включить столбец «конверсии по времени конверсии», чтобы видеть, когда они фактически произошли. 13.7 Отчёт «Аукцион» (Auction Insights) Показывает, с какими рекламодателями вы пересекаетесь: доля показов, доля перекрытия, доля верхних позиций, доля выше конкурента . Для региона это быстрый способ узнать, кто ваши реальные конкуренты (кроме тех, кого вы знаете). Данные видны при достаточной статистике. 13.8 Анализ запросов по n-граммам Одиночные запросы редко повторяются, поэтому смотрят на слова внутри запросов : Разбейте запросы на слова. Для каждого слова просуммируйте расход, клики, конверсии. Слова с большим расходом и нулём конверсий кандидаты в минус-слова. Слово Расход Клики Конверсии Решение «чертёж» 6,2 8 0 в минус-слова «цена» 11,4 14 2 оставить «бесплатно» 3,0 5 0 в минус-слова «минск» 4,8 6 0 в минус-слова Цифры условные. Скрипт, который собирает такую таблицу автоматически, в разделе 14.5. 13.9 Контрольная панель: пороги тревоги Показатель Порог внимания Показы за 24 часа 0 при активной кампании Расход за день Больше 1,5 от дневного бюджета (бывает до 2) CTR группы при позиции 1–3 Меньше 2–3% Клики в кабинете и визиты в GA4 Расхождение больше 25–30% Конверсии за 7 дней при 30+ кликах 0 Статус объявления Любой, кроме «Одобрено» Цена заявки Выше предельной 7 дней подряд 13.10 Недельный отчёт Шаблон недельного отчёта в приложении B. Основные строки: расход, клики, CTR, CPC, конверсии, CPL, доля показов, главные находки, решения на неделю. Что сделать на вашем сайте Добавьте в календарь ежедневную проверку «поисковых запросов» на первые 14 дней. Заведите таблицу недельных отчётов. ", "toc": [["131-ежедневная-еженедельная-ежемесячная-рутина", "13.1 Ежедневная, еженедельная, ежемесячная рутина"], ["132-главные-отчёты", "13.2 Главные отчёты"], ["133-диагностика-по-симптомам", "13.3 Диагностика по симптомам"], ["134-как-читать-цифры", "13.4 Как читать цифры"], ["135-доля-показов-сколько-вы-теряете-и-почему", "13.5 Доля показов: сколько вы теряете и почему"], ["136-задержка-конверсий", "13.6 Задержка конверсий"], ["137-отчёт-аукцион-auction-insights", "13.7 Отчёт «Аукцион» (Auction Insights)"], ["138-анализ-запросов-по-n-граммам", "13.8 Анализ запросов по n-граммам"], ["139-контрольная-панель-пороги-тревоги", "13.9 Контрольная панель: пороги тревоги"], ["1310-недельный-отчёт", "13.10 Недельный отчёт"], ["что-сделать-на-вашем-сайте", "Что сделать на вашем сайте"]]}, {"id": "ch14", "num": "14", "title": "Автоматизация для программиста: GAQL, скрипты, API, BigQuery", "full": "14. Автоматизация для программиста: GAQL, скрипты, API, BigQuery", "part": "Часть IV. Аналитика и инструменты", "html": "<p>Ваше преимущество перед обычным владельцем бизнеса: вы можете <strong>превратить рекламный аккаунт в данные</strong> и автоматизировать рутину. Ниже уровни от простого к сложному.</p>\n<h3 id=\"141-уровни-автоматизации\">14.1 Уровни автоматизации</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>Уровень</th><th>Инструмент</th><th>Порог входа</th><th>Что даёт</th></tr></thead><tbody><tr><td data-label=\"Уровень\">1</td><td data-label=\"Инструмент\">Автоматические правила в кабинете</td><td data-label=\"Порог входа\">Нет</td><td data-label=\"Что даёт\">Пауза по условию, письма</td></tr><tr><td data-label=\"Уровень\">2</td><td data-label=\"Инструмент\"><strong>Looker Studio</strong> с коннекторами Google Ads и GA4</td><td data-label=\"Порог входа\">Низкий</td><td data-label=\"Что даёт\">Дашборд без кода</td></tr><tr><td data-label=\"Уровень\">3</td><td data-label=\"Инструмент\"><strong>Google Ads Scripts</strong> (JavaScript)</td><td data-label=\"Порог входа\">Средний</td><td data-label=\"Что даёт\">Проверки, оповещения, выгрузки</td></tr><tr><td data-label=\"Уровень\">4</td><td data-label=\"Инструмент\"><strong>Google Ads API</strong> (Python и другие)</td><td data-label=\"Порог входа\">Высокий (нужен токен разработчика)</td><td data-label=\"Что даёт\">Полный контроль и интеграции</td></tr><tr><td data-label=\"Уровень\">5</td><td data-label=\"Инструмент\"><strong>BigQuery</strong> (экспорт Google Ads и GA4)</td><td data-label=\"Порог входа\">Высокий</td><td data-label=\"Что даёт\">SQL по всем данным, объединение с CRM</td></tr></tbody></table></div>\n<h3 id=\"142-gaql-язык-запросов-google-ads\">14.2 GAQL: язык запросов Google Ads</h3>\n<p><strong>GAQL</strong> (Google Ads Query Language) похож на SQL. Он используется в Scripts и API.</p>\n<p>Запрос: ключевые слова и расходы за 7 дней.</p>\n<div class=\"codewrap\"><button class=\"copy\" type=\"button\" aria-label=\"Копировать код\">Копировать</button><pre><code class=\"lang-sql\">SELECT\n  campaign.name,\n  ad_group.name,\n  ad_group_criterion.keyword.text,\n  ad_group_criterion.keyword.match_type,\n  metrics.impressions,\n  metrics.clicks,\n  metrics.cost_micros,\n  metrics.conversions\nFROM keyword_view\nWHERE segments.date DURING LAST_7_DAYS\n  AND metrics.impressions &gt; 0\nORDER BY metrics.cost_micros DESC\nLIMIT 50</code></pre></div>\n<p>Запрос: поисковые запросы (для минус-слов).</p>\n<div class=\"codewrap\"><button class=\"copy\" type=\"button\" aria-label=\"Копировать код\">Копировать</button><pre><code class=\"lang-sql\">SELECT\n  search_term_view.search_term,\n  campaign.name,\n  metrics.impressions,\n  metrics.clicks,\n  metrics.cost_micros,\n  metrics.conversions\nFROM search_term_view\nWHERE segments.date DURING LAST_14_DAYS\n  AND metrics.clicks &gt; 0\nORDER BY metrics.cost_micros DESC\nLIMIT 100</code></pre></div>\n<p>Замечание: деньги в API хранятся в <strong>микро-единицах</strong> (<code>cost_micros</code> = стоимость x 1 000 000).</p>\n<h3 id=\"143-скрипт-1-проверка-доступности-страниц-для-вашей-ситуации\">14.3 Скрипт 1: проверка доступности страниц (для вашей ситуации с TLS)</h3>\n<p>Скрипт Google Ads обращается к конечным URL ваших объявлений и присылает письмо, если страница не отвечает кодом 200. Он выполняется на серверах Google, поэтому показывает, как выглядит ваш сайт именно с этой стороны.</p>\n<div class=\"codewrap\"><button class=\"copy\" type=\"button\" aria-label=\"Копировать код\">Копировать</button><pre><code class=\"lang-javascript\">// Google Ads Script: проверка конечных URL активных объявлений\nfunction main() {\n  var EMAIL = 'you@example.com';          // подставьте свою почту\n  var query =\n    'SELECT ad_group_ad.ad.final_urls, campaign.name ' +\n    'FROM ad_group_ad ' +\n    'WHERE ad_group_ad.status = \"ENABLED\" AND campaign.status = \"ENABLED\"';\n  var rows = AdsApp.search(query);\n  var seen = {};\n  var problems = [];\n  while (rows.hasNext()) {\n    var row = rows.next();\n    var urls = row.adGroupAd.ad.finalUrls || [];\n    urls.forEach(function (u) {\n      if (seen[u]) return;\n      seen[u] = true;\n      var code = 0;\n      try {\n        code = UrlFetchApp.fetch(u, {muteHttpExceptions: true, followRedirects: true}).getResponseCode();\n      } catch (e) {\n        code = -1;                          // сетевая ошибка или обрыв TLS\n      }\n      if (code !== 200) problems.push(u + ' -&gt; ' + code + ' (' + row.campaign.name + ')');\n    });\n  }\n  if (problems.length) {\n    MailApp.sendEmail(EMAIL, 'Google Ads: проблемные посадочные страницы',\n      problems.join('\\n'));\n  }\n}</code></pre></div>\n<p>Расписание: ежечасно. <strong>Ограничение:</strong> скрипт не равен AdsBot и может иметь другие IP, но обрыв или код не 200 стоит расследовать.</p>\n<h3 id=\"144-скрипт-2-оповещение-о-расходе\">14.4 Скрипт 2: оповещение о расходе</h3>\n<div class=\"codewrap\"><button class=\"copy\" type=\"button\" aria-label=\"Копировать код\">Копировать</button><pre><code class=\"lang-javascript\">function main() {\n  var LIMIT = 30; // порог расхода сегодня (в валюте аккаунта)\n  var EMAIL = 'you@example.com';\n  var rows = AdsApp.search(\n    'SELECT metrics.cost_micros FROM customer WHERE segments.date DURING TODAY');\n  var cost = 0;\n  while (rows.hasNext()) { cost += rows.next().metrics.costMicros / 1000000; }\n  if (cost &gt; LIMIT) {\n    MailApp.sendEmail(EMAIL, 'Google Ads: расход сегодня ' + cost.toFixed(2),\n      'Порог ' + LIMIT + ' превышен.');\n  }\n}</code></pre></div>\n<h3 id=\"145-скрипт-3-кандидаты-в-минус-слова-по-словам-запросов\">14.5 Скрипт 3: кандидаты в минус-слова по словам запросов</h3>\n<p>Скрипт собирает запросы за 30 дней, разбивает их на слова, суммирует расход и конверсии по словам и записывает в Google Таблицу. Сортировка по расходу показывает слова, на которые уходят деньги без результата (см. раздел 13.8).</p>\n<div class=\"codewrap\"><button class=\"copy\" type=\"button\" aria-label=\"Копировать код\">Копировать</button><pre><code class=\"lang-javascript\">// Google Ads Script: слова из поисковых запросов, кандидаты в минус-слова\nfunction main() {\n  var SHEET_URL = 'https://docs.google.com/spreadsheets/d/XXXX/edit'; // ваша таблица\n  var rows = AdsApp.search(\n    'SELECT search_term_view.search_term, metrics.clicks, metrics.cost_micros, metrics.conversions ' +\n    'FROM search_term_view WHERE segments.date DURING LAST_30_DAYS AND metrics.clicks &gt; 0');\n  var words = {};\n  while (rows.hasNext()) {\n    var r = rows.next();\n    var tokens = r.searchTermView.searchTerm.toLowerCase().split(/[\\s,.;:!?()\"']+/);\n    tokens.forEach(function (w) {\n      if (w.length &lt; 3) return;\n      var o = words[w] || (words[w] = {clicks: 0, cost: 0, conv: 0});\n      o.clicks += Number(r.metrics.clicks);\n      o.cost += Number(r.metrics.costMicros) / 1000000;\n      o.conv += Number(r.metrics.conversions);\n    });\n  }\n  var list = Object.keys(words).map(function (w) {\n    return [w, words[w].clicks, words[w].cost, words[w].conv];\n  }).sort(function (a, b) { return b[2] - a[2]; }).slice(0, 200);\n  var ss = SpreadsheetApp.openByUrl(SHEET_URL);\n  var sheet = ss.getSheetByName('ngrams') || ss.insertSheet('ngrams');\n  sheet.clear();\n  sheet.appendRow(['слово', 'клики', 'расход', 'конверсии']);\n  list.forEach(function (row) { sheet.appendRow(row); });\n}</code></pre></div>\n<p>Запуск раз в неделю. Решение о минус-слове принимаете <strong>вы</strong>, скрипт только подсказывает.</p>\n<h3 id=\"146-python-и-api\">14.6 Python и API</h3>\n<p>Подходит для интеграций с CRM и собственными панелями.</p>\n<div class=\"codewrap\"><button class=\"copy\" type=\"button\" aria-label=\"Копировать код\">Копировать</button><pre><code class=\"lang-python\">from google.ads.googleads.client import GoogleAdsClient\n\nclient = GoogleAdsClient.load_from_storage(\"google-ads.yaml\")\nga = client.get_service(\"GoogleAdsService\")\nquery = \"\"\"\n  SELECT campaign.name, metrics.clicks, metrics.cost_micros, metrics.conversions\n  FROM campaign\n  WHERE segments.date DURING LAST_7_DAYS\n\"\"\"\nfor batch in ga.search_stream(customer_id=\"1234567890\", query=query):\n    for row in batch.results:\n        cost = row.metrics.cost_micros / 1_000_000\n        print(row.campaign.name, row.metrics.clicks, cost, row.metrics.conversions)</code></pre></div>\n<p>Нужны <strong>токен разработчика</strong> (developer token, заявка на доступ), OAuth-доступ и идентификатор клиента. <strong>Для вашего масштаба Scripts и Looker Studio проще</strong>. API имеет смысл, когда вы интегрируете рекламу с CRM или собственной панелью.</p>\n<h3 id=\"147-bigquery\">14.7 BigQuery</h3>\n<ol><li><strong>Экспорт GA4 в BigQuery</strong> (бесплатный, в настройках GA4): таблицы событий по дням.</li><li><strong>Google Ads Data Transfer</strong> в BigQuery: статистика кампаний.</li><li>SQL по обоим источникам.</li></ol>\n<p>Пример: заявки по дням и источнику (на уровне пользователя, проверьте различия моделей атрибуции).</p>\n<div class=\"codewrap\"><button class=\"copy\" type=\"button\" aria-label=\"Копировать код\">Копировать</button><pre><code class=\"lang-sql\">SELECT\n  PARSE_DATE('%Y%m%d', event_date) AS day,\n  traffic_source.medium AS medium,\n  COUNTIF(event_name = 'generate_lead') AS leads,\n  COUNTIF(event_name = 'click_phone') AS phone_clicks\nFROM `PROJECT.analytics_PROPERTY.events_*`\nWHERE _TABLE_SUFFIX BETWEEN '20261101' AND '20261130'\nGROUP BY day, medium\nORDER BY day, medium;</code></pre></div>\n<p><strong>Оговорка.</strong> <code>traffic_source</code> в GA4 хранит источник <strong>первого касания пользователя</strong>, для событий конкретной сессии используйте поля с <code>collected_traffic_source</code> и данные сессии. Проверьте схему текущего экспорта.</p>\n<h3 id=\"148-версионирование-и-безопасность\">14.8 Версионирование и безопасность</h3>\n<ul><li>Храните <strong>структуру аккаунта в CSV</strong> (как в вашем <a href=\"#/kw\">google-ads-keywords.csv</a>) и импортируйте через <strong>Google Ads Editor</strong>: так изменения в git, а не только в кабинете.</li><li><strong>Не хардкодьте</strong> токены и секреты в скриптах, храните в защищённых настройках.</li><li>Скрипты сначала запускайте в <strong>режиме предпросмотра</strong>. Любой скрипт, меняющий ставки или паузы, тестируйте на отдельной тестовой кампании.</li><li>Ограничивайте права: скрипту, который только читает, не нужны права на запись.</li></ul>\n<h3 id=\"149-загрузка-офлайн-конверсий-продажи-по-gclid\">14.9 Загрузка офлайн-конверсий (продажи по gclid)</h3>\n<p>Когда сделка закрыта, загрузите её в Google Ads. В кабинете: Цели → Конверсии → Загрузки → создайте действие «Импорт» из кликов. Файл CSV (шаблон лучше скачать из кабинета, формат может меняться):</p>\n<div class=\"codewrap\"><button class=\"copy\" type=\"button\" aria-label=\"Копировать код\">Копировать</button><pre><code class=\"lang-text\">Parameters:TimeZone=+0300\nGoogle Click ID,Conversion Name,Conversion Time,Conversion Value,Conversion Currency\nEAIaIQobChMI-пример-gclid,Заявка закрыта,2026-11-10 14:30:00,800,BYN</code></pre></div>\n<ul><li><strong>Google Click ID</strong> вы сохранили вместе с заявкой (раздел 11.6).</li><li><strong>Conversion Name</strong> должно совпадать с названием действия в кабинете.</li><li>Часовой пояс: Минск UTC+3, то есть <code>+0300</code>.</li><li>Окно загрузки: до 90 дней после клика.</li><li>Загрузку можно автоматизировать скриптом или API; для вашего объёма ручной CSV раз в неделю достаточно.</li></ul>\n<h3 id=\"1410-если-скрипт-не-работает\">14.10 Если скрипт не работает</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>Проблема</th><th>Причина и решение</th></tr></thead><tbody><tr><td data-label=\"Проблема\">Нет прав</td><td data-label=\"Причина и решение\">Скрипт просит разрешение на доступ к таблице или почте: предоставьте при первом запуске</td></tr><tr><td data-label=\"Проблема\">Ошибка запроса</td><td data-label=\"Причина и решение\">В скриптах используется <strong>GAQL</strong> через <code>AdsApp.search</code>. Старый язык AWQL больше не используется</td></tr><tr><td data-label=\"Проблема\">Поля пустые</td><td data-label=\"Причина и решение\">Названия полей в скриптах пишутся в верхнем «верблюжьем» регистре (<code>row.metrics.costMicros</code>), в запросе в виде <code>metrics.cost_micros</code></td></tr><tr><td data-label=\"Проблема\">Скрипт долго работает</td><td data-label=\"Причина и решение\">Лимит времени выполнения (около 30 минут), добавляйте фильтры и <code>LIMIT</code></td></tr><tr><td data-label=\"Проблема\">Письма не приходят</td><td data-label=\"Причина и решение\">Проверьте адрес, папку спам, квоты почты скриптов</td></tr><tr><td data-label=\"Проблема\">Результаты странные</td><td data-label=\"Причина и решение\">Запустите в режиме предпросмотра и выведите данные в журнал (<code>Logger.log</code>)</td></tr></tbody></table></div>\n<h3 id=\"что-сделать-на-вашем-сайте\">Что сделать на вашем сайте</h3>\n<ul><li>После запуска поставьте скрипт проверки страниц (14.3) на каждый час.</li><li>Через 2–3 недели соберите дашборд в Looker Studio (расход, клики, конверсии, цена заявки, таблица звонков).</li></ul>\n<hr>", "text": " Ваше преимущество перед обычным владельцем бизнеса: вы можете превратить рекламный аккаунт в данные и автоматизировать рутину. Ниже уровни от простого к сложному. 14.1 Уровни автоматизации Уровень Инструмент Порог входа Что даёт 1 Автоматические правила в кабинете Нет Пауза по условию, письма 2 Looker Studio с коннекторами Google Ads и GA4 Низкий Дашборд без кода 3 Google Ads Scripts (JavaScript) Средний Проверки, оповещения, выгрузки 4 Google Ads API (Python и другие) Высокий (нужен токен разработчика) Полный контроль и интеграции 5 BigQuery (экспорт Google Ads и GA4) Высокий SQL по всем данным, объединение с CRM 14.2 GAQL: язык запросов Google Ads GAQL (Google Ads Query Language) похож на SQL. Он используется в Scripts и API. Запрос: ключевые слова и расходы за 7 дней. Копировать SELECT campaign.name, ad_group.name, ad_group_criterion.keyword.text, ad_group_criterion.keyword.match_type, metrics.impressions, metrics.clicks, metrics.cost_micros, metrics.conversions FROM keyword_view WHERE segments.date DURING LAST_7_DAYS AND metrics.impressions > 0 ORDER BY metrics.cost_micros DESC LIMIT 50 Запрос: поисковые запросы (для минус-слов). Копировать SELECT search_term_view.search_term, campaign.name, metrics.impressions, metrics.clicks, metrics.cost_micros, metrics.conversions FROM search_term_view WHERE segments.date DURING LAST_14_DAYS AND metrics.clicks > 0 ORDER BY metrics.cost_micros DESC LIMIT 100 Замечание: деньги в API хранятся в микро-единицах ( cost_micros = стоимость x 1 000 000). 14.3 Скрипт 1: проверка доступности страниц (для вашей ситуации с TLS) Скрипт Google Ads обращается к конечным URL ваших объявлений и присылает письмо, если страница не отвечает кодом 200. Он выполняется на серверах Google, поэтому показывает, как выглядит ваш сайт именно с этой стороны. Копировать // Google Ads Script: проверка конечных URL активных объявлений function main() { var EMAIL = 'you@example.com'; // подставьте свою почту var query = 'SELECT ad_group_ad.ad.final_urls, campaign.name ' + 'FROM ad_group_ad ' + 'WHERE ad_group_ad.status = \"ENABLED\" AND campaign.status = \"ENABLED\"'; var rows = AdsApp.search(query); var seen = {}; var problems = []; while (rows.hasNext()) { var row = rows.next(); var urls = row.adGroupAd.ad.finalUrls || []; urls.forEach(function (u) { if (seen[u]) return; seen[u] = true; var code = 0; try { code = UrlFetchApp.fetch(u, {muteHttpExceptions: true, followRedirects: true}).getResponseCode(); } catch (e) { code = -1; // сетевая ошибка или обрыв TLS } if (code !== 200) problems.push(u + ' -> ' + code + ' (' + row.campaign.name + ')'); }); } if (problems.length) { MailApp.sendEmail(EMAIL, 'Google Ads: проблемные посадочные страницы', problems.join('\\n')); } } Расписание: ежечасно. Ограничение: скрипт не равен AdsBot и может иметь другие IP, но обрыв или код не 200 стоит расследовать. 14.4 Скрипт 2: оповещение о расходе Копировать function main() { var LIMIT = 30; // порог расхода сегодня (в валюте аккаунта) var EMAIL = 'you@example.com'; var rows = AdsApp.search( 'SELECT metrics.cost_micros FROM customer WHERE segments.date DURING TODAY'); var cost = 0; while (rows.hasNext()) { cost += rows.next().metrics.costMicros / 1000000; } if (cost > LIMIT) { MailApp.sendEmail(EMAIL, 'Google Ads: расход сегодня ' + cost.toFixed(2), 'Порог ' + LIMIT + ' превышен.'); } } 14.5 Скрипт 3: кандидаты в минус-слова по словам запросов Скрипт собирает запросы за 30 дней, разбивает их на слова, суммирует расход и конверсии по словам и записывает в Google Таблицу. Сортировка по расходу показывает слова, на которые уходят деньги без результата (см. раздел 13.8). Копировать // Google Ads Script: слова из поисковых запросов, кандидаты в минус-слова function main() { var SHEET_URL = 'https://docs.google.com/spreadsheets/d/XXXX/edit'; // ваша таблица var rows = AdsApp.search( 'SELECT search_term_view.search_term, metrics.clicks, metrics.cost_micros, metrics.conversions ' + 'FROM search_term_view WHERE segments.date DURING LAST_30_DAYS AND metrics.clicks > 0'); var words = {}; while (rows.hasNext()) { var r = rows.next(); var tokens = r.searchTermView.searchTerm.toLowerCase().split(/[\\s,.;:!?()\"']+/); tokens.forEach(function (w) { if (w.length < 3) return; var o = words[w] || (words[w] = {clicks: 0, cost: 0, conv: 0}); o.clicks += Number(r.metrics.clicks); o.cost += Number(r.metrics.costMicros) / 1000000; o.conv += Number(r.metrics.conversions); }); } var list = Object.keys(words).map(function (w) { return [w, words[w].clicks, words[w].cost, words[w].conv]; }).sort(function (a, b) { return b[2] - a[2]; }).slice(0, 200); var ss = SpreadsheetApp.openByUrl(SHEET_URL); var sheet = ss.getSheetByName('ngrams') || ss.insertSheet('ngrams'); sheet.clear(); sheet.appendRow(['слово', 'клики', 'расход', 'конверсии']); list.forEach(function (row) { sheet.appendRow(row); }); } Запуск раз в неделю. Решение о минус-слове принимаете вы , скрипт только подсказывает. 14.6 Python и API Подходит для интеграций с CRM и собственными панелями. Копировать from google.ads.googleads.client import GoogleAdsClient client = GoogleAdsClient.load_from_storage(\"google-ads.yaml\") ga = client.get_service(\"GoogleAdsService\") query = \"\"\" SELECT campaign.name, metrics.clicks, metrics.cost_micros, metrics.conversions FROM campaign WHERE segments.date DURING LAST_7_DAYS \"\"\" for batch in ga.search_stream(customer_id=\"1234567890\", query=query): for row in batch.results: cost = row.metrics.cost_micros /
